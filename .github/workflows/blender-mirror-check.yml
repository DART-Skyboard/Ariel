name: Check Blender tablet demo mirror
on:
  schedule: [{cron: "17 9 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the mirror and update latest.json
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          D="https://mirror.blender.org/demo/tablet/"
          H={"User-Agent":"BlenderTabletUpdater/1.0 (GitHub Action)"}
          html=urllib.request.urlopen(urllib.request.Request(D,headers=H),timeout=30).read().decode()
          names=sorted(set(re.findall(r'href="\./([^"?]+\.apk)"',html)))
          rows=[]
          for n in names:
              r=urllib.request.urlopen(urllib.request.Request(D+n,method="HEAD",headers=H),timeout=30)
              rows.append({"name":n,"size":int(r.headers.get("Content-Length",0)),"modified":r.headers.get("Last-Modified","")})
          from email.utils import parsedate_to_datetime as p
          rows.sort(key=lambda x:(p(x["modified"]) if x["modified"] else 0,x["name"]))
          out={"mirror":D,"latest":rows[-1] if rows else None,"all":rows}
          json.dump(out,open("templates/blender/latest.json","w"),indent=1)
          PY
      - name: Commit if changed
        run: |
          git config user.name "blender-mirror-bot"; git config user.email "bot@users.noreply.github.com"
          git add templates/blender/latest.json
          git diff --cached --quiet || (git commit -m "Blender tablet demo mirror: update latest.json" && git push)
