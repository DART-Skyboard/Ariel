<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
  <defs>
    <!-- Vertical fade: visible at bottom, fades out at top -->
    <linearGradient id="sfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b1a1a" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#8b1a1a" stop-opacity="0.18"/>
      <stop offset="70%"  stop-color="#7a1515" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6b1010" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Subtle edge glow on silhouette -->
    <filter id="sil-glow" x="-8%" y="-4%" width="116%" height="108%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Inner shadow for depth on face planes -->
    <filter id="inner-depth">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <clipPath id="card-clip">
      <rect width="400" height="520" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">

    <!-- Base silhouette fill — deep crimson, transparent overall -->
    <!-- Profile faces LEFT, hair back, turtleneck collar, hoop earring, AR glasses -->

    <!-- Hair mass (flowing back) -->
    <path d="
      M 248 28
      C 220 18, 185 14, 168 22
      C 148 30, 138 45, 135 62
      C 128 90, 132 115, 138 138
      C 144 162, 152 182, 158 205
      C 164 228, 166 255, 162 278
      C 158 300, 152 318, 148 340
      C 144 362, 142 385, 145 408
      C 148 430, 155 450, 165 468
      L 340 468
      L 340 28
      Z
    " fill="url(#sfade)" filter="url(#sil-glow)"/>

    <!-- Dark hair shadow layer -->
    <path d="
      M 255 30
      C 235 20, 210 16, 192 26
      C 175 36, 165 55, 162 78
      C 158 105, 165 130, 170 155
      L 340 155
      L 340 30
      Z
    " fill="#3d0808" opacity="0.45"/>

    <!-- Face / neck / head profile -->
    <path d="
      M 165 62
      C 162 48, 168 36, 178 30
      C 188 24, 200 22, 212 26
      C 228 32, 236 46, 238 62
      C 240 76, 236 90, 230 102
      C 224 114, 215 122, 210 132
      C 206 140, 205 148, 207 158
      C 209 168, 215 175, 218 182
      L 218 210
      C 218 220, 215 228, 210 232
      C 205 236, 198 236, 192 234
      C 186 232, 180 226, 176 218
      C 172 210, 170 200, 168 190
      C 165 178, 162 165, 158 152
      C 154 138, 150 122, 148 108
      C 146 92, 148 76, 155 65
      Z
    " fill="url(#sfade)" opacity="0.9"/>

    <!-- Nose bridge bump -->
    <path d="M 162 118 C 158 122, 155 128, 156 134 C 157 138, 160 140, 162 138 C 164 136, 163 130, 162 125 Z"
      fill="#5a0f0f" opacity="0.5"/>

    <!-- Lip area -->
    <path d="M 158 165 C 162 168, 168 170, 172 168 C 176 166, 178 162, 176 160 C 174 158, 168 158, 164 160 Z"
      fill="#4a0a0a" opacity="0.6"/>

    <!-- Neck -->
    <path d="
      M 192 234
      C 188 240, 185 250, 184 262
      C 183 274, 184 285, 186 295
      L 210 295
      C 212 285, 213 274, 212 262
      C 211 250, 208 240, 205 234
      Z
    " fill="url(#sfade)" opacity="0.85"/>

    <!-- Turtleneck collar -->
    <path d="
      M 175 292
      C 168 298, 162 308, 160 320
      C 158 332, 160 345, 165 355
      L 230 355
      C 235 345, 237 332, 235 320
      C 233 308, 227 298, 220 292
      C 215 288, 207 286, 200 286
      C 193 286, 182 288, 175 292
      Z
    " fill="#6b1010" opacity="0.6"/>
    <!-- Collar inner shadow -->
    <path d="M 178 295 C 175 302, 174 312, 175 322 L 225 322 C 226 312, 225 302, 222 295 Z"
      fill="#3d0808" opacity="0.4"/>

    <!-- Shoulder/chest left -->
    <path d="
      M 130 355
      C 118 362, 108 375, 102 390
      C 96 405, 94 422, 96 440
      C 98 458, 105 472, 115 480
      L 285 480
      C 295 472, 302 458, 304 440
      C 306 422, 304 405, 298 390
      C 292 375, 282 362, 270 355
      Z
    " fill="url(#sfade)" opacity="0.8"/>

    <!-- Shoulder seam lines -->
    <path d="M 155 360 C 148 370, 142 382, 140 396" stroke="#8b2020" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 245 360 C 252 370, 258 382, 260 396" stroke="#8b2020" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- AR Glasses frame -->
    <rect x="148" y="108" width="90" height="18" rx="4" fill="#1a1a1a" opacity="0.82"/>
    <!-- Lens tint -->
    <rect x="150" y="110" width="86" height="14" rx="3" fill="#2a0808" opacity="0.6"/>
    <!-- Temple arm going back -->
    <path d="M 238 117 C 255 117, 280 115, 310 112" stroke="#1a1a1a" stroke-width="4" fill="none" opacity="0.82" stroke-linecap="round"/>
    <!-- Gold DART Meadow logo mark on glasses -->
    <g transform="translate(207, 113)" opacity="0.9">
      <!-- Small bird/arrow shape in gold -->
      <path d="M 0 4 L 5 0 L 10 4 L 7 4 L 7 8 L 3 8 L 3 4 Z" fill="#f5a623" transform="scale(0.7)"/>
    </g>
    <!-- Glasses nose piece -->
    <rect x="192" y="110" width="4" height="8" rx="1" fill="#111" opacity="0.7"/>

    <!-- Hoop earring -->
    <circle cx="225" cy="182" r="14" fill="none" stroke="#c0c0c0" stroke-width="4" opacity="0.75"/>
    <!-- Earring opening gap (top) -->
    <path d="M 218 170 L 232 170" stroke="#1a0808" stroke-width="5" opacity="0.9"/>
    <!-- Earring shine -->
    <path d="M 214 178 C 212 184, 214 192, 218 196" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Hair highlight streaks (lighter planes) -->
    <path d="M 210 28 C 220 35, 235 55, 248 80 C 260 105, 268 135, 270 165"
      stroke="#aa2525" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 225 32 C 240 50, 258 78, 268 108 C 278 138, 282 170, 280 200"
      stroke="#aa2525" stroke-width="5" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- Face plane shadow (cheek/jaw) -->
    <path d="M 168 90 C 162 105, 158 125, 160 145 C 162 158, 168 168, 172 175"
      stroke="#3d0808" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- Overall gradient overlay to unify and fade edges -->
    <rect width="400" height="520" fill="url(#sfade)" opacity="0.15"/>

  </g>
</svg>
