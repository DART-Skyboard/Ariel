<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background:#060a10">
  <!-- Silicon wafer base -->
  <ellipse cx="100" cy="168" rx="74" ry="15" fill="rgba(58,0,128,0.7)" stroke="#3a0080" stroke-width="1.5"/>
  <!-- Wafer grid lines -->
  <g stroke="rgba(0,229,255,0.2)" stroke-width="0.6">
    <line x1="40" y1="162" x2="160" y2="162"/>
    <line x1="36" y1="168" x2="164" y2="168"/>
    <line x1="52" y1="162" x2="47" y2="172"/>
    <line x1="75" y1="162" x2="70" y2="172"/>
    <line x1="100" y1="162" x2="95" y2="172"/>
    <line x1="125" y1="162" x2="120" y2="172"/>
    <line x1="148" y1="162" x2="143" y2="172"/>
  </g>
  <!-- Dark desk/roof -->
  <rect x="28" y="28" width="144" height="24" rx="3" fill="#0f1818"/>
  <!-- Red compiler frame posts -->
  <rect x="48" y="50" width="8" height="112" rx="2" fill="#cc2010" opacity="0.95"/>
  <rect x="144" y="50" width="8" height="112" rx="2" fill="#cc2010" opacity="0.95"/>
  <!-- Top beam -->
  <rect x="45" y="48" width="110" height="8" rx="2" fill="#cc2010" opacity="0.95"/>
  <!-- NO bottom beam — open system -->
  <!-- Glows on posts -->
  <rect x="48" y="50" width="8" height="112" rx="2" fill="url(#redglow)" opacity="0.5"/>
  <!-- Cyan inner walls -->
  <rect x="60" y="50" width="5" height="95" rx="1" fill="rgba(0,200,230,0.45)"/>
  <rect x="135" y="50" width="5" height="95" rx="1" fill="rgba(0,200,230,0.45)"/>
  <rect x="60" y="50" width="80" height="5" rx="1" fill="rgba(0,200,230,0.35)"/>
  <!-- Orange outer walls (thin) -->
  <rect x="55" y="50" width="3" height="100" rx="1" fill="rgba(255,120,0,0.3)"/>
  <rect x="142" y="50" width="3" height="100" rx="1" fill="rgba(255,120,0,0.3)"/>
  <!-- IDE screen left -->
  <rect x="14" y="62" width="32" height="55" rx="2" fill="#0a1208"/>
  <line x1="19" y1="73" x2="42" y2="73" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="80" x2="38" y2="80" stroke="#ffcc00" stroke-width="1" opacity="0.4"/>
  <line x1="19" y1="87" x2="40" y2="87" stroke="#00e5ff" stroke-width="1" opacity="0.35"/>
  <line x1="19" y1="94" x2="35" y2="94" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  <line x1="19" y1="101" x2="43" y2="101" stroke="#00e5ff" stroke-width="0.8" opacity="0.25"/>
  <!-- Output screen right -->
  <rect x="154" y="68" width="32" height="48" rx="2" fill="rgba(0,40,55,0.7)" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
  <!-- Green net torus -->
  <ellipse cx="100" cy="142" rx="14" ry="5" fill="none" stroke="#39ff14" stroke-width="3" opacity="0.9"/>
  <ellipse cx="100" cy="142" rx="19" ry="7" fill="none" stroke="rgba(57,255,20,0.25)" stroke-width="1"/>
  <!-- Purple poly box -->
  <rect x="83" y="106" width="34" height="22" rx="2" fill="rgba(100,20,200,0.5)" stroke="rgba(123,47,255,0.7)" stroke-width="1"/>
  <!-- Center label -->
  <text x="100" y="19" text-anchor="middle" font-family="'Orbitron',monospace" font-size="11" font-weight="900" fill="#00e5ff" letter-spacing="3">LEATR</text>
  <!-- Subtitle -->
  <text x="100" y="192" text-anchor="middle" font-family="'Orbitron',monospace" font-size="7" fill="rgba(0,229,255,0.6)" letter-spacing="2">UNIVERSAL FRAMEWORK</text>
  <!-- Corner accent dots -->
  <circle cx="56" cy="50" r="3" fill="#ff3020" opacity="0.9"/>
  <circle cx="144" cy="50" r="3" fill="#ff3020" opacity="0.9"/>
  <circle cx="56" cy="162" r="2" fill="#ff3020" opacity="0.35"/>
  <circle cx="144" cy="162" r="2" fill="#ff3020" opacity="0.35"/>
  <!-- Gradient def -->
  <defs>
    <linearGradient id="redglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3020" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff3020" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff3020" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>
