<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0044aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06101a"/>
      <stop offset="100%" stop-color="#02060f"/>
    </radialGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff7a"/>
      <stop offset="100%" stop-color="#00aa44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c800ff"/>
      <stop offset="100%" stop-color="#6600aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#aa6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#aa0033" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Orbital dot cloud mask -->
    <clipPath id="circ"><circle cx="256" cy="256" r="230"/></clipPath>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle hex grid background -->
  <g opacity="0.06" stroke="#00e5ff" stroke-width="0.8" fill="none">
    <path d="M128 44 L148 44 L158 61 L148 78 L128 78 L118 61Z"/>
    <path d="M168 44 L188 44 L198 61 L188 78 L168 78 L158 61Z"/>
    <path d="M208 44 L228 44 L238 61 L228 78 L208 78 L198 61Z"/>
    <path d="M148 78 L168 78 L178 95 L168 112 L148 112 L138 95Z"/>
    <path d="M188 78 L208 78 L218 95 L208 112 L188 112 L178 95Z"/>
    <path d="M228 78 L248 78 L258 95 L248 112 L228 112 L218 95Z"/>
    <path d="M268 78 L288 78 L298 95 L288 112 L268 112 L258 95Z"/>
    <path d="M308 78 L328 78 L338 95 L328 112 L308 112 L298 95Z"/>
    <path d="M128 112 L148 112 L158 129 L148 146 L128 146 L118 129Z"/>
    <path d="M168 112 L188 112 L198 129 L188 146 L168 146 L158 129Z"/>
    <path d="M348 112 L368 112 L378 129 L368 146 L348 146 L338 129Z"/>
    <path d="M108 146 L128 146 L138 163 L128 180 L108 180 L98 163Z"/>
    <path d="M388 146 L408 146 L418 163 L408 180 L388 180 L378 163Z"/>
    <path d="M88 180 L108 180 L118 197 L108 214 L88 214 L78 197Z"/>
    <path d="M408 180 L428 180 L438 197 L428 214 L408 214 L398 197Z"/>
    <path d="M78 214 L98 214 L108 231 L98 248 L78 248 L68 231Z"/>
    <path d="M418 214 L438 214 L448 231 L438 248 L418 248 L408 231Z"/>
    <path d="M78 248 L98 248 L108 265 L98 282 L78 282 L68 265Z"/>
    <path d="M418 248 L438 248 L448 265 L438 282 L418 282 L408 265Z"/>
    <path d="M88 282 L108 282 L118 299 L108 316 L88 316 L78 299Z"/>
    <path d="M408 282 L428 282 L438 299 L428 316 L408 316 L398 299Z"/>
    <path d="M108 316 L128 316 L138 333 L128 350 L108 350 L98 333Z"/>
    <path d="M388 316 L408 316 L418 333 L408 350 L388 350 L378 333Z"/>
    <path d="M128 350 L148 350 L158 367 L148 384 L128 384 L118 367Z"/>
    <path d="M348 350 L368 350 L378 367 L368 384 L348 384 L338 367Z"/>
    <path d="M168 384 L188 384 L198 401 L188 418 L168 418 L158 401Z"/>
    <path d="M208 384 L228 384 L238 401 L228 418 L208 418 L198 401Z"/>
    <path d="M248 384 L268 384 L278 401 L268 418 L248 418 L238 401Z"/>
    <path d="M288 384 L308 384 L318 401 L308 418 L288 418 L278 401Z"/>
    <path d="M328 384 L348 384 L358 401 L348 418 L328 418 L318 401Z"/>
    <path d="M188 418 L208 418 L218 435 L208 452 L188 452 L178 435Z"/>
    <path d="M228 418 L248 418 L258 435 L248 452 L228 452 L218 435Z"/>
    <path d="M268 418 L288 418 L298 435 L288 452 L268 452 L258 435Z"/>
    <path d="M308 418 L328 418 L338 435 L328 452 L308 452 L298 435Z"/>
  </g>

  <!-- Electron cloud dots — s orbital (1s, spherical) -->
  <g clip-path="url(#circ)" opacity="0.55" filter="url(#softglow)">
    <!-- 1s orbital dots scattered near nucleus -->
    <circle cx="245" cy="248" r="1.8" fill="#00e5ff"/>
    <circle cx="267" cy="252" r="1.4" fill="#00e5ff"/>
    <circle cx="253" cy="239" r="2.1" fill="#00e5ff"/>
    <circle cx="261" cy="270" r="1.6" fill="#00e5ff"/>
    <circle cx="238" cy="263" r="1.9" fill="#00e5ff"/>
    <circle cx="270" cy="241" r="1.3" fill="#00e5ff"/>
    <circle cx="243" cy="275" r="1.7" fill="#00e5ff"/>
    <circle cx="278" cy="258" r="1.5" fill="#00e5ff"/>
    <circle cx="233" cy="245" r="1.4" fill="#00e5ff"/>
    <circle cx="259" cy="233" r="1.8" fill="#00e5ff"/>
    <circle cx="272" cy="266" r="2.0" fill="#00e5ff"/>
    <circle cx="240" cy="256" r="1.6" fill="#00e5ff"/>
  </g>

  <!-- 2p orbital lobe — horizontal (cyan) -->
  <ellipse cx="256" cy="256" rx="110" ry="32" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.35"/>
  <!-- 2p lobes density dots -->
  <g opacity="0.5">
    <circle cx="188" cy="254" r="3.5" fill="#00e5ff" filter="url(#softglow)"/>
    <circle cx="175" cy="258" r="2.4" fill="#00e5ff" opacity="0.6"/>
    <circle cx="195" cy="248" r="2.0" fill="#00e5ff" opacity="0.7"/>
    <circle cx="322" cy="254" r="3.5" fill="#00e5ff" filter="url(#softglow)"/>
    <circle cx="335" cy="258" r="2.4" fill="#00e5ff" opacity="0.6"/>
    <circle cx="316" cy="248" r="2.0" fill="#00e5ff" opacity="0.7"/>
  </g>

  <!-- 2p orbital lobe — vertical (green) -->
  <ellipse cx="256" cy="256" rx="32" ry="110" fill="none" stroke="#39ff7a" stroke-width="1.2" opacity="0.35"/>
  <g opacity="0.5">
    <circle cx="257" cy="188" r="3.5" fill="#39ff7a" filter="url(#softglow)"/>
    <circle cx="253" cy="175" r="2.4" fill="#39ff7a" opacity="0.6"/>
    <circle cx="261" cy="195" r="2.0" fill="#39ff7a" opacity="0.7"/>
    <circle cx="257" cy="322" r="3.5" fill="#39ff7a" filter="url(#softglow)"/>
    <circle cx="253" cy="335" r="2.4" fill="#39ff7a" opacity="0.6"/>
    <circle cx="261" cy="316" r="2.0" fill="#39ff7a" opacity="0.7"/>
  </g>

  <!-- 3d orbital — tilted ellipse 1 (purple) -->
  <ellipse cx="256" cy="256" rx="148" ry="42" fill="none" stroke="#c800ff" stroke-width="1.0" opacity="0.3" transform="rotate(45 256 256)"/>
  <!-- 3d orbital — tilted ellipse 2 (amber) -->
  <ellipse cx="256" cy="256" rx="148" ry="42" fill="none" stroke="#ffb300" stroke-width="1.0" opacity="0.3" transform="rotate(-45 256 256)"/>
  <!-- 3d orbital — outer ring (red) -->
  <ellipse cx="256" cy="256" rx="42" ry="148" fill="none" stroke="#ff3366" stroke-width="1.0" opacity="0.28" transform="rotate(30 256 256)"/>

  <!-- Orbital electrons on 3d shells -->
  <g filter="url(#softglow)">
    <!-- Purple orbital electrons -->
    <circle cx="352" cy="156" r="5" fill="#c800ff" opacity="0.85"/>
    <circle cx="160" cy="354" r="5" fill="#c800ff" opacity="0.85"/>
    <!-- Amber orbital electrons -->
    <circle cx="354" cy="354" r="5" fill="#ffb300" opacity="0.85"/>
    <circle cx="158" cy="158" r="5" fill="#ffb300" opacity="0.85"/>
    <!-- Red orbital electrons -->
    <circle cx="256" cy="112" r="5" fill="#ff3366" opacity="0.85"/>
    <circle cx="256" cy="400" r="5" fill="#ff3366" opacity="0.85"/>
  </g>

  <!-- Outer heatmap ring — probability density -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.12"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#39ff7a" stroke-width="0.5" opacity="0.10"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#c800ff" stroke-width="0.5" opacity="0.10"/>

  <!-- Scattered electron cloud — outer shells -->
  <g clip-path="url(#circ)" opacity="0.35">
    <circle cx="180" cy="210" r="1.5" fill="#c800ff"/>
    <circle cx="165" cy="240" r="1.2" fill="#c800ff"/>
    <circle cx="170" cy="278" r="1.8" fill="#c800ff"/>
    <circle cx="330" cy="200" r="1.4" fill="#ffb300"/>
    <circle cx="345" cy="235" r="1.7" fill="#ffb300"/>
    <circle cx="338" cy="270" r="1.3" fill="#ffb300"/>
    <circle cx="225" cy="160" r="1.6" fill="#39ff7a"/>
    <circle cx="255" cy="148" r="1.9" fill="#39ff7a"/>
    <circle cx="288" cy="162" r="1.4" fill="#39ff7a"/>
    <circle cx="220" cy="350" r="1.5" fill="#ff3366"/>
    <circle cx="256" cy="362" r="1.8" fill="#ff3366"/>
    <circle cx="290" cy="348" r="1.3" fill="#ff3366"/>
    <circle cx="155" cy="310" r="1.6" fill="#00e5ff"/>
    <circle cx="350" cy="310" r="1.4" fill="#00e5ff"/>
    <circle cx="155" cy="200" r="1.7" fill="#00e5ff"/>
    <circle cx="350" cy="200" r="1.5" fill="#00e5ff"/>
  </g>

  <!-- Nucleus — dense glow core -->
  <g filter="url(#coreglow)">
    <circle cx="256" cy="256" r="28" fill="#00e5ff" opacity="0.18"/>
    <circle cx="256" cy="256" r="18" fill="#00e5ff" opacity="0.35"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- Nucleus detail — proton/neutron packing -->
  <circle cx="252" cy="252" r="4.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="260" cy="252" r="4.5" fill="#ff3366" opacity="0.8"/>
  <circle cx="256" cy="259" r="4.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="252" cy="260" r="3.5" fill="#ffb300" opacity="0.7"/>
  <circle cx="260" cy="260" r="3.5" fill="#39ff7a" opacity="0.7"/>

  <!-- Border ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.18"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.08"/>

  <!-- Watermark text -->
  <text x="256" y="486" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="13" fill="#00e5ff" opacity="0.35" letter-spacing="3">ARCLAKE · ATOMS</text>
</svg>
