<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d1f2d"/><stop offset="100%" stop-color="#060a10"/></radialGradient>
    <linearGradient id="merc" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5a3d"/>
      <stop offset="55%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffd23d"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>

  <!-- Arc Edge containment rings -->
  <path d="M8 40 A24 24 0 0 1 56 40" fill="none" stroke="#00e5ff" stroke-width="1" opacity=".22"/>
  <path d="M12 42 A20 20 0 0 1 52 42" fill="none" stroke="#00e5ff" stroke-width="1" opacity=".35"/>
  <path d="M16 44 A16 16 0 0 1 48 44" fill="none" stroke="#00e5ff" stroke-width="1.4" opacity=".5" filter="url(#g)"/>

  <!-- Heat radiance lines -->
  <line x1="40" y1="14" x2="44" y2="10" stroke="#ff8a3d" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
  <line x1="44" y1="18" x2="49" y2="16" stroke="#ff8a3d" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
  <line x1="44" y1="24" x2="50" y2="24" stroke="#ff8a3d" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>

  <!-- Thermometer tube -->
  <rect x="28.5" y="10" width="7" height="34" rx="3.5" fill="none" stroke="#00e5ff" stroke-width="1.6" opacity=".7"/>
  <!-- Mercury fill -->
  <rect x="30.4" y="20" width="3.2" height="24" rx="1.6" fill="url(#merc)" filter="url(#g)"/>
  <!-- Bulb -->
  <circle cx="32" cy="46" r="6.5" fill="#0d1f2d" stroke="#00e5ff" stroke-width="1.6"/>
  <circle cx="32" cy="46" r="4.4" fill="url(#merc)" filter="url(#g)"/>

  <!-- Scale ticks -->
  <line x1="37" y1="14" x2="39.5" y2="14" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
  <line x1="37" y1="20" x2="39.5" y2="20" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
  <line x1="37" y1="26" x2="39.5" y2="26" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
  <line x1="37" y1="32" x2="39.5" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
  <line x1="37" y1="38" x2="39.5" y2="38" stroke="#00e5ff" stroke-width="1" opacity=".5"/>

  <!-- Small flame accent -->
  <path d="M21 18 C19 22 17 24 19 28 C20.5 30.5 23.5 30.5 25 28 C26.5 25.8 25 23.8 24.2 22.2 C23.6 24 22 24.4 22 22.4 C22 20.6 22.6 19.2 21 18 Z"
        fill="#ff8a3d" opacity=".85" filter="url(#g)"/>

  <text x="32" y="59" font-family="monospace" font-size="5.5" fill="#00e5ff" text-anchor="middle" opacity=".55" letter-spacing="1">BTU</text>
</svg>
