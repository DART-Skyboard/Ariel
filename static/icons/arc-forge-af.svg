<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c18"/>
      <stop offset="100%" stop-color="#040f1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#0080a8"/>
    </linearGradient>
    <linearGradient id="magGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0090"/>
      <stop offset="100%" stop-color="#cc0070"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c87010"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect width="64" height="64" rx="10" fill="none" stroke="#0d2540" stroke-width="1"/>
  <!-- Subtle top edge highlight -->
  <line x1="10" y1="1" x2="54" y2="1" stroke="#00c8ff" stroke-width="0.5" opacity="0.3"/>

  <!-- PCB trace grid (background layer) -->
  <!-- Horizontal traces -->
  <line x1="6" y1="16" x2="22" y2="16" stroke="#0d2540" stroke-width="1"/>
  <line x1="42" y1="16" x2="58" y2="16" stroke="#0d2540" stroke-width="1"/>
  <line x1="6" y1="48" x2="22" y2="48" stroke="#0d2540" stroke-width="1"/>
  <line x1="42" y1="48" x2="58" y2="48" stroke="#0d2540" stroke-width="1"/>
  <!-- Vertical traces -->
  <line x1="16" y1="6" x2="16" y2="22" stroke="#0d2540" stroke-width="1"/>
  <line x1="48" y1="6" x2="48" y2="22" stroke="#0d2540" stroke-width="1"/>
  <line x1="16" y1="42" x2="16" y2="58" stroke="#0d2540" stroke-width="1"/>
  <line x1="48" y1="42" x2="48" y2="58" stroke="#0d2540" stroke-width="1"/>

  <!-- Corner via pads -->
  <circle cx="16" cy="16" r="2.5" fill="none" stroke="#0f3a5e" stroke-width="1"/>
  <circle cx="16" cy="16" r="1" fill="#0080a8"/>
  <circle cx="48" cy="16" r="2.5" fill="none" stroke="#0f3a5e" stroke-width="1"/>
  <circle cx="48" cy="16" r="1" fill="#0080a8"/>
  <circle cx="16" cy="48" r="2.5" fill="none" stroke="#0f3a5e" stroke-width="1"/>
  <circle cx="16" cy="48" r="1" fill="#0080a8"/>
  <circle cx="48" cy="48" r="2.5" fill="none" stroke="#0f3a5e" stroke-width="1"/>
  <circle cx="48" cy="48" r="1" fill="#0080a8"/>

  <!-- Central IC chip body -->
  <rect x="20" y="20" width="24" height="24" rx="2" fill="#060d14" stroke="#0f3a5e" stroke-width="1"/>
  <!-- IC inner border (copper fill effect) -->
  <rect x="21.5" y="21.5" width="21" height="21" rx="1" fill="none" stroke="#0d2540" stroke-width="0.5"/>

  <!-- IC pins — left side -->
  <rect x="14" y="24" width="6" height="2" rx="0.5" fill="url(#cyanGrad)" opacity="0.9"/>
  <rect x="14" y="29" width="6" height="2" rx="0.5" fill="url(#cyanGrad)" opacity="0.7"/>
  <rect x="14" y="34" width="6" height="2" rx="0.5" fill="url(#cyanGrad)" opacity="0.5"/>
  <rect x="14" y="39" width="6" height="2" rx="0.5" fill="url(#cyanGrad)" opacity="0.7"/>

  <!-- IC pins — right side -->
  <rect x="44" y="24" width="6" height="2" rx="0.5" fill="url(#magGrad)" opacity="0.9"/>
  <rect x="44" y="29" width="6" height="2" rx="0.5" fill="url(#magGrad)" opacity="0.7"/>
  <rect x="44" y="34" width="6" height="2" rx="0.5" fill="url(#magGrad)" opacity="0.5"/>
  <rect x="44" y="39" width="6" height="2" rx="0.5" fill="url(#magGrad)" opacity="0.7"/>

  <!-- IC pins — top -->
  <rect x="24" y="14" width="2" height="6" rx="0.5" fill="url(#cyanGrad)" opacity="0.7"/>
  <rect x="29" y="14" width="2" height="6" rx="0.5" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="34" y="14" width="2" height="6" rx="0.5" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="39" y="14" width="2" height="6" rx="0.5" fill="url(#magGrad)" opacity="0.7"/>

  <!-- IC pins — bottom -->
  <rect x="24" y="44" width="2" height="6" rx="0.5" fill="url(#cyanGrad)" opacity="0.7"/>
  <rect x="29" y="44" width="2" height="6" rx="0.5" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="34" y="44" width="2" height="6" rx="0.5" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="39" y="44" width="2" height="6" rx="0.5" fill="url(#magGrad)" opacity="0.7"/>

  <!-- Central arc/forge symbol — stylized "AF" circuit arc -->
  <!-- Arc arc (C-curve) in cyan -->
  <path d="M 27 27 Q 22 32 27 37" fill="none" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Vertical bar + crossbar of F in magenta -->
  <line x1="33" y1="26" x2="33" y2="38" stroke="url(#magGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="33" y1="26" x2="39" y2="26" stroke="url(#magGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="33" y1="31" x2="37" y2="31" stroke="url(#magGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Gold spark/forge dot at junction -->
  <circle cx="30.5" cy="32" r="2" fill="url(#goldGrad)" filter="url(#glowStrong)"/>
  <circle cx="30.5" cy="32" r="0.8" fill="#fff8e0" opacity="0.9"/>
</svg>
