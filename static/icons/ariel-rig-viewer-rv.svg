<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="rvbg" cx="50%" cy="38%" r="75%"><stop offset="0%" stop-color="#14283a"/><stop offset="100%" stop-color="#060a10"/></radialGradient>
    <linearGradient id="rvskin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f1c9ac"/><stop offset="100%" stop-color="#c98f6e"/></linearGradient>
    <linearGradient id="rvhair" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b0f16"/><stop offset="60%" stop-color="#121a27"/><stop offset="100%" stop-color="#2a4058"/></linearGradient>
    <linearGradient id="rvshirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#232c38"/><stop offset="100%" stop-color="#10151c"/></linearGradient>
    <filter id="rvglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="rvclip"><rect width="64" height="64" rx="10"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#rvbg)"/>
  <g clip-path="url(#rvclip)">
    <!-- floor grid hint -->
    <g stroke="#00e5ff" stroke-width=".35" opacity=".18">
      <line x1="0" y1="58" x2="64" y2="58"/><line x1="0" y1="62" x2="64" y2="62"/>
      <line x1="32" y1="56" x2="32" y2="64"/><line x1="16" y1="56" x2="6" y2="64"/><line x1="48" y1="56" x2="58" y2="64"/>
    </g>
    <!-- back hair mass -->
    <path d="M32 7 C19 7 14 18 15 30 C15.5 40 12 47 9 55 C14 53 18 50 20 46 C21 52 19 57 17 61 C23 58 26 52 26 46 L38 46 C38 52 41 58 47 61 C45 57 43 52 44 46 C46 50 50 53 55 55 C52 47 48.500 40 49 30 C50 18 45 7 32 7 Z" fill="url(#rvhair)"/>
    <!-- torso -->
    <path d="M10 64 C10 53 16 49 25 47 L39 47 C48 49 54 53 54 64 Z" fill="url(#rvshirt)"/>
    <path d="M26 47 L32 56 L38 47" fill="none" stroke="#3a4757" stroke-width=".7"/>
    <!-- neck -->
    <path d="M28 38 L28 46 C30 49 34 49 36 46 L36 38 Z" fill="url(#rvskin)"/>
    <path d="M28 41 C30 44 34 44 36 41 L36 38 L28 38 Z" fill="#9c6a52" opacity=".35"/>
    <!-- face -->
    <path d="M32 11 C24 11 21.500 18 22 26 C22.500 33 26 39 32 40 C38 39 41.500 33 42 26 C42.500 18 40 11 32 11 Z" fill="url(#rvskin)"/>
    <!-- eyes, brows, lips -->
    <path d="M25.500 24 C27 22.800 29 22.800 30.200 24" fill="none" stroke="#1a1218" stroke-width=".9" stroke-linecap="round"/>
    <path d="M33.800 24 C35 22.800 37 22.800 38.500 24" fill="none" stroke="#1a1218" stroke-width=".9" stroke-linecap="round"/>
    <ellipse cx="27.800" cy="25" rx="1.150" ry=".8" fill="#6aa7d8"/><ellipse cx="36.200" cy="25" rx="1.150" ry=".8" fill="#6aa7d8"/>
    <path d="M25 21.200 C27 20 29.500 20.200 30.500 21" fill="none" stroke="#141a22" stroke-width=".9" stroke-linecap="round"/>
    <path d="M33.500 21 C34.500 20.200 37 20 39 21.200" fill="none" stroke="#141a22" stroke-width=".9" stroke-linecap="round"/>
    <path d="M32 26 L31 30.500 C31.600 31.200 32.400 31.200 33 30.500" fill="none" stroke="#a8745a" stroke-width=".6" stroke-linecap="round" opacity=".8"/>
    <path d="M29.200 34.400 C30.600 33.600 33.400 33.600 34.800 34.400 C33.600 36 30.400 36 29.200 34.400 Z" fill="#b9606a"/>
    <!-- glasses -->
    <g fill="#bfe8ff" fill-opacity=".18" stroke="#0e141b" stroke-width=".8"><rect x="24.200" y="22.200" width="7" height="5.200" rx="1.200"/><rect x="32.800" y="22.200" width="7" height="5.200" rx="1.200"/></g>
    <line x1="31.200" y1="24" x2="32.800" y2="24" stroke="#0e141b" stroke-width=".8"/>
    <!-- front hair: parted crown + framing strands -->
    <path d="M32 9.500 C25 9.500 20.500 14 20.800 23 C21 28 19.500 33 17 40 C20.500 37 22.500 33 23 28 C23.500 21 26 14 32 12.500 C38 14 40.500 21 41 28 C41.500 33 43.500 37 47 40 C44.500 33 43 28 43.200 23 C43.500 14 39 9.500 32 9.500 Z" fill="#0d121b"/>
    <!-- individual strands (fine) -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#3d5f80" stroke-width=".35" opacity=".85">
        <path d="M32 9.800 C24 10 20 17 20.500 27 C20.800 37 16 46 12 57"/>
        <path d="M31 9.900 C23 11 19.500 18 19.500 28 C19.500 38 14.500 47 10.500 58"/>
        <path d="M33 9.800 C41 10 45 17 44.500 27 C44.200 37 49 46 53 57"/>
        <path d="M34 9.900 C42 11 45.500 18 45.500 28 C45.500 38 50.500 47 54.500 58"/>
        <path d="M27 10.500 C22 13 21 20 21.500 30 C21.800 40 18.500 50 16 60"/>
        <path d="M37 10.500 C42 13 43 20 42.500 30 C42.200 40 45.500 50 48 60"/>
      </g>
      <g stroke="#0a0e15" stroke-width=".5" opacity=".9">
        <path d="M30 10 C23 12 20.500 19 20.800 28 C21 38 17.500 47 14 58"/>
        <path d="M34 10 C41 12 43.500 19 43.200 28 C43 38 46.500 47 50 58"/>
        <path d="M25 11 C21.500 15 21 22 21 31 C21 40 19 49 17.500 61"/>
        <path d="M39 11 C42.500 15 43 22 43 31 C43 40 45 49 46.500 61"/>
      </g>
    </g>
    <!-- physics strand: simulated points -->
    <g filter="url(#rvglow)">
      <path d="M46 40 C48 46 51 50 54 55" fill="none" stroke="#c8f400" stroke-width=".7" stroke-linecap="round" stroke-dasharray="1.800 1.200" opacity=".9"/>
      <circle cx="46" cy="40" r="1" fill="#c8f400"/><circle cx="48.200" cy="45.500" r=".85" fill="#c8f400"/><circle cx="51" cy="50" r=".85" fill="#c8f400"/><circle cx="54" cy="55" r=".85" fill="#c8f400"/>
    </g>
    <!-- rig: spine, clavicles, joints -->
    <g filter="url(#rvglow)" stroke="#00e5ff" stroke-width=".8" stroke-linecap="round" fill="#00e5ff">
      <line x1="32" y1="46" x2="32" y2="62" opacity=".9"/>
      <line x1="32" y1="47" x2="18" y2="51" opacity=".9"/><line x1="32" y1="47" x2="46" y2="51" opacity=".9"/>
      <line x1="18" y1="51" x2="12" y2="62" opacity=".7"/><line x1="46" y1="51" x2="52" y2="62" opacity=".7"/>
      <circle cx="32" cy="46" r="1.400" stroke="none"/><circle cx="32" cy="55" r="1.100" stroke="none"/>
      <circle cx="18" cy="51" r="1.400" stroke="none"/><circle cx="46" cy="51" r="1.400" stroke="none"/>
      <circle cx="12" cy="62" r="1" stroke="none"/><circle cx="52" cy="62" r="1" stroke="none"/>
    </g>
  </g>
  <rect x=".4" y=".4" width="63.200" height="63.200" rx="9.600" fill="none" stroke="#00e5ff" stroke-opacity=".25" stroke-width=".8"/>
</svg>
