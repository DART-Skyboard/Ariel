<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6eb4"/>
      <stop offset="50%" stop-color="#c840ff"/>
      <stop offset="100%" stop-color="#47c4f1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6eb4"/>
      <stop offset="100%" stop-color="#47c4f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#waveGrad)" stroke-width="3"/>

  <!-- Outer ring pulse -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#waveGrad)" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#waveGrad)" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- MP3 waveform bars (left side, compressed/lossy look) -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="68" y="230" width="14" height="52" rx="7" fill="#ff6eb4"/>
    <rect x="88" y="210" width="14" height="92" rx="7" fill="#ff6eb4"/>
    <rect x="108" y="196" width="14" height="120" rx="7" fill="#ff6eb4"/>
    <rect x="128" y="220" width="14" height="72" rx="7" fill="#ff6eb4"/>
    <rect x="148" y="238" width="14" height="36" rx="7" fill="#ff6eb4"/>
    <rect x="168" y="214" width="14" height="84" rx="7" fill="#ff6eb4"/>
  </g>

  <!-- Arrow in center -->
  <g transform="translate(256,256)" filter="url(#softglow)">
    <!-- Arrow shaft -->
    <rect x="-36" y="-6" width="72" height="12" rx="6" fill="url(#arrowGrad)"/>
    <!-- Arrow head -->
    <polygon points="38,-18 72,0 38,18" fill="url(#arrowGrad)"/>
  </g>

  <!-- WAV waveform bars (right side, full quality look — more bars, varied heights) -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="322" y="244" width="10" height="24" rx="5" fill="#47c4f1"/>
    <rect x="338" y="228" width="10" height="56" rx="5" fill="#47c4f1"/>
    <rect x="354" y="204" width="10" height="104" rx="5" fill="#47c4f1"/>
    <rect x="370" y="218" width="10" height="76" rx="5" fill="#47c4f1"/>
    <rect x="386" y="238" width="10" height="36" rx="5" fill="#47c4f1"/>
    <rect x="402" y="196" width="10" height="120" rx="5" fill="#47c4f1"/>
    <rect x="418" y="224" width="10" height="64" rx="5" fill="#47c4f1"/>
    <rect x="434" y="242" width="10" height="28" rx="5" fill="#47c4f1"/>
  </g>

  <!-- MP3 label -->
  <text x="130" y="378" font-family="'Courier New', monospace" font-size="28" font-weight="900"
        fill="#ff6eb4" text-anchor="middle" letter-spacing="2" filter="url(#glow)">MP3</text>

  <!-- WAV label -->
  <text x="390" y="378" font-family="'Courier New', monospace" font-size="28" font-weight="900"
        fill="#47c4f1" text-anchor="middle" letter-spacing="2" filter="url(#glow)">WAV</text>

  <!-- Bottom label -->
  <text x="256" y="430" font-family="'Courier New', monospace" font-size="16" font-weight="700"
        fill="rgba(224,244,255,0.6)" text-anchor="middle" letter-spacing="4">CONVERT · HQ</text>

  <!-- Top label -->
  <text x="256" y="128" font-family="'Courier New', monospace" font-size="14" font-weight="700"
        fill="rgba(224,244,255,0.45)" text-anchor="middle" letter-spacing="6">ARIEL STUDIO</text>

  <!-- Small sparkle dots -->
  <circle cx="256" cy="88" r="4" fill="#c840ff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="190" cy="106" r="2.5" fill="#ff6eb4" opacity="0.5"/>
  <circle cx="322" cy="106" r="2.5" fill="#47c4f1" opacity="0.5"/>
</svg>
