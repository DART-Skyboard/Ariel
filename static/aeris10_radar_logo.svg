<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Sweep glow -->
    <filter id="sweepglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Radial gradient background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a0f"/>
      <stop offset="100%" stop-color="#050c06"/>
    </radialGradient>
    <!-- Sweep sector gradient -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#00c832" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00c832"/>
      <stop offset="100%" stop-color="#007a1e"/>
    </linearGradient>
    <!-- Target blip gradient -->
    <radialGradient id="blipGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>

  <!-- Outer bezel ring -->
  <circle cx="100" cy="100" r="98" fill="#0a1a0c" stroke="#1a3a1e" stroke-width="1.5"/>
  <!-- Tick marks on bezel -->
  <g stroke="#00aa28" stroke-width="1" opacity="0.7">
    <!-- Major ticks every 30° -->
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(0,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(30,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(60,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(90,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(120,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(150,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(180,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(210,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(240,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(270,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(300,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="14" transform="rotate(330,100,100)"/>
    <!-- Minor ticks every 10° -->
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(10,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(20,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(40,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(50,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(70,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(80,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(100,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(110,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(130,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(140,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(160,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(170,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(190,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(200,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(220,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(230,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(250,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(260,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(280,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(290,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(310,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(320,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(340,100,100)"/>
    <line x1="100" y1="4" x2="100" y2="10" stroke-width="0.6" transform="rotate(350,100,100)"/>
  </g>
  <!-- Bezel outer ring stroke -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#00aa28" stroke-width="0.8" opacity="0.5"/>

  <!-- Main radar screen background -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)"/>

  <!-- Phosphor scanline overlay (subtle horizontal lines) -->
  <g clip-path="url(#circleClip)" opacity="0.04">
    <line x1="12" y1="16" x2="188" y2="16" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="20" x2="188" y2="20" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="24" x2="188" y2="24" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="28" x2="188" y2="28" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="32" x2="188" y2="32" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="36" x2="188" y2="36" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="40" x2="188" y2="40" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="44" x2="188" y2="44" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="48" x2="188" y2="48" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="52" x2="188" y2="52" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="56" x2="188" y2="56" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="60" x2="188" y2="60" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="64" x2="188" y2="64" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="68" x2="188" y2="68" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="72" x2="188" y2="72" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="76" x2="188" y2="76" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="80" x2="188" y2="80" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="84" x2="188" y2="84" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="88" x2="188" y2="88" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="92" x2="188" y2="92" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="96" x2="188" y2="96" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="100" x2="188" y2="100" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="104" x2="188" y2="104" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="108" x2="188" y2="108" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="112" x2="188" y2="112" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="116" x2="188" y2="116" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="120" x2="188" y2="120" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="124" x2="188" y2="124" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="128" x2="188" y2="128" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="132" x2="188" y2="132" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="136" x2="188" y2="136" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="140" x2="188" y2="140" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="144" x2="188" y2="144" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="148" x2="188" y2="148" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="152" x2="188" y2="152" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="156" x2="188" y2="156" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="160" x2="188" y2="160" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="164" x2="188" y2="164" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="168" x2="188" y2="168" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="172" x2="188" y2="172" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="176" x2="188" y2="176" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="180" x2="188" y2="180" stroke="#00ff41" stroke-width="1"/>
    <line x1="12" y1="184" x2="188" y2="184" stroke="#00ff41" stroke-width="1"/>
  </g>

  <!-- Range rings -->
  <g fill="none" stroke="#00aa28" filter="url(#glow)">
    <circle cx="100" cy="100" r="22" stroke-width="0.6" opacity="0.55"/>
    <circle cx="100" cy="100" r="44" stroke-width="0.6" opacity="0.55"/>
    <circle cx="100" cy="100" r="66" stroke-width="0.6" opacity="0.55"/>
    <circle cx="100" cy="100" r="88" stroke-width="0.9" opacity="0.7"/>
  </g>

  <!-- Cardinal crosshairs -->
  <g stroke="#00aa28" stroke-width="0.6" opacity="0.45">
    <line x1="100" y1="12" x2="100" y2="188"/>
    <line x1="12" y1="100" x2="188" y2="100"/>
  </g>
  <!-- Diagonal crosshairs (lighter) -->
  <g stroke="#00aa28" stroke-width="0.4" opacity="0.22">
    <line x1="37.8" y1="37.8" x2="162.2" y2="162.2"/>
    <line x1="162.2" y1="37.8" x2="37.8" y2="162.2"/>
  </g>

  <!-- Sweep sector (frozen at ~45° — top-right quadrant) -->
  <path d="M100,100 L162.2,37.8 A88,88 0 0,1 188,100 Z"
        fill="url(#sweepGrad)" clip-path="url(#circleClip)"
        filter="url(#sweepglow)" opacity="0.9"/>

  <!-- Sweep arm line -->
  <line x1="100" y1="100" x2="162.2" y2="37.8"
        stroke="#00ff41" stroke-width="1.5"
        filter="url(#glow)" opacity="0.95"/>

  <!-- Target blips -->
  <!-- Blip 1: strong close target, upper-right -->
  <circle cx="136" cy="72" r="4.5" fill="url(#blipGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="136" cy="72" r="7" fill="none" stroke="#00ff41" stroke-width="0.7" opacity="0.4"/>

  <!-- Blip 2: mid-range target, right -->
  <circle cx="152" cy="108" r="3" fill="url(#blipGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="152" cy="108" r="5.5" fill="none" stroke="#00ff41" stroke-width="0.6" opacity="0.3"/>

  <!-- Blip 3: faint long-range echo, lower-left -->
  <circle cx="62" cy="140" r="2.2" fill="url(#blipGrad)" filter="url(#glow)" opacity="0.55"/>

  <!-- Blip 4: faint echo upper-left -->
  <circle cx="70" cy="66" r="1.8" fill="url(#blipGrad)" filter="url(#glow)" opacity="0.45"/>

  <!-- Phased array antenna diagram — bottom, symbolic 8-element row -->
  <g transform="translate(100,173)" filter="url(#glow)">
    <!-- Base bar -->
    <rect x="-26" y="0" width="52" height="3" rx="1" fill="#00aa28" opacity="0.7"/>
    <!-- Array elements -->
    <g fill="#00ff41" opacity="0.85">
      <rect x="-24" y="-8" width="4" height="8" rx="0.5"/>
      <rect x="-17" y="-8" width="4" height="8" rx="0.5"/>
      <rect x="-10" y="-8" width="4" height="8" rx="0.5"/>
      <rect x="-3"  y="-8" width="4" height="8" rx="0.5"/>
      <rect x="4"   y="-8" width="4" height="8" rx="0.5"/>
      <rect x="11"  y="-8" width="4" height="8" rx="0.5"/>
      <rect x="18"  y="-8" width="4" height="8" rx="0.5"/>
    </g>
    <!-- Beam lobes (stylized arcs above each element) -->
    <g fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.4">
      <path d="M-22,-8 Q-22,-16 -22,-22"/>
      <path d="M-15,-8 Q-15,-18 -15,-24"/>
      <path d="M-8,-8 Q-8,-20 -8,-26"/>
      <path d="M-1,-8 Q-1,-22 -1,-28"/>
      <path d="M6,-8 Q6,-22 6,-28"/>
      <path d="M13,-8 Q13,-20 13,-26"/>
      <path d="M20,-8 Q20,-18 20,-24"/>
    </g>
  </g>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="2.5" fill="#00ff41" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="1.2" fill="#ffffff" opacity="0.9"/>

  <!-- Top label: AERIS-10 -->
  <text x="100" y="30" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="9.5" font-weight="700"
        fill="#00ff41" filter="url(#glow)" letter-spacing="2.5">AERIS-10</text>

  <!-- Bottom label: RADAR -->
  <text x="100" y="158" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="7" font-weight="400"
        fill="#00aa28" letter-spacing="3.5" opacity="0.85">RADAR</text>

  <!-- Frequency label: 10.5 GHz -->
  <text x="100" y="192" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="6"
        fill="#007a1e" letter-spacing="1.5" opacity="0.7">10.5 GHz · PLFM</text>

  <!-- Outer ring final stroke -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#003a10" stroke-width="2"/>
</svg>
