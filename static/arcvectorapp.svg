<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#060a10"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow-x" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-y" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-z" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Hex clip for rounded hex shape -->
    <clipPath id="hex-clip">
      <polygon points="100,8 178,52 178,148 100,192 22,148 22,52"/>
    </clipPath>
  </defs>

  <!-- Hex frame background -->
  <polygon points="100,8 178,52 178,148 100,192 22,148 22,52"
           fill="url(#bg)" stroke="#00e5ff" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- Inner hex ring -->
  <polygon points="100,26 162,62 162,138 100,174 38,138 38,62"
           fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- Glow blob at center -->
  <circle cx="100" cy="100" r="38" fill="url(#glow-c)" filter="url(#blur-c)"/>

  <!-- ── 3D AXES (isometric-ish projection) ── -->
  <!-- Origin at (100,100), projected axes in 2D -->

  <!-- Y axis: straight up/down -->
  <line x1="100" y1="148" x2="100" y2="48"
        stroke="#39ff82" stroke-width="1.6" filter="url(#glow-y)" opacity="0.9"/>

  <!-- X axis: lower-right / upper-left -->
  <line x1="50" y1="124" x2="152" y2="76"
        stroke="#ff3d5a" stroke-width="1.6" filter="url(#glow-x)" opacity="0.9"/>

  <!-- Z axis: lower-left / upper-right -->
  <line x1="48" y1="76" x2="152" y2="124"
        stroke="#00e5ff" stroke-width="1.6" filter="url(#glow-z)" opacity="0.9"/>

  <!-- ── ARC CURVES (Arc Edge style tangent bends) ── -->

  <!-- Y arc — curves slightly right at midpoint (sigma offset) -->
  <path d="M100,148 Q118,100 100,48"
        fill="none" stroke="#39ff82" stroke-width="2.4" stroke-opacity="0.7"
        filter="url(#glow-y)"/>

  <!-- X arc — curves toward camera -->
  <path d="M50,124 Q88,88 152,76"
        fill="none" stroke="#ff3d5a" stroke-width="2.4" stroke-opacity="0.7"
        filter="url(#glow-x)"/>

  <!-- Z arc — curves down gently -->
  <path d="M48,76 Q92,114 152,124"
        fill="none" stroke="#00e5ff" stroke-width="2.4" stroke-opacity="0.7"
        filter="url(#glow-z)"/>

  <!-- ── SIGMA MERIDIAN POINT ── -->
  <!-- The shared central point where all 3 arcs intersect -->
  <circle cx="100" cy="100" r="6.5" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.92"/>
  <circle cx="100" cy="100" r="3"   fill="#ffffff" opacity="0.85"/>
  <circle cx="100" cy="100" r="12"  fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- West handle dots -->
  <circle cx="50"  cy="124" r="3" fill="#ff3d5a" opacity="0.75"/>
  <circle cx="48"  cy="76"  r="3" fill="#00e5ff" opacity="0.75"/>
  <circle cx="100" cy="148" r="3" fill="#39ff82" opacity="0.75"/>

  <!-- East handle dots -->
  <circle cx="152" cy="76"  r="3" fill="#ff3d5a" opacity="0.75"/>
  <circle cx="152" cy="124" r="3" fill="#00e5ff" opacity="0.75"/>
  <circle cx="100" cy="48"  r="3" fill="#39ff82" opacity="0.75"/>

  <!-- Axis labels -->
  <text x="156" y="73"  font-family="monospace" font-size="9" fill="#ff3d5a" opacity="0.85">+X</text>
  <text x="102" y="44"  font-family="monospace" font-size="9" fill="#39ff82" opacity="0.85">+Y</text>
  <text x="155" y="128" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.85">+Z</text>

  <!-- Corner decoration ticks on hex -->
  <line x1="100" y1="8"   x2="100" y2="18"  stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="182" x2="100" y2="192" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <line x1="22"  y1="52"  x2="30"  y2="57"  stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="52"  x2="178" y2="52"  stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Title text at bottom -->
  <text x="100" y="184" font-family="monospace" font-size="7.5" fill="#00e5ff"
        text-anchor="middle" letter-spacing="2.5" opacity="0.72">ARC VECTOR</text>
</svg>
