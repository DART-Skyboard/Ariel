<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="arBg" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="#10263a"/><stop offset="100%" stop-color="#05090f"/></radialGradient>
    <linearGradient id="arScope" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".30"/><stop offset="100%" stop-color="#47c4f1" stop-opacity=".08"/></linearGradient>
    <linearGradient id="arRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ff3ff"/><stop offset="100%" stop-color="#1f8fb8"/></linearGradient>
    <filter id="arGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#arBg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="11.3" fill="none" stroke="#47c4f1" stroke-opacity=".28" stroke-width="1.5"/>
  <!-- fine grid -->
  <g stroke="#47c4f1" stroke-opacity=".08" stroke-width=".5">
    <path d="M8 16H56M8 24H56M8 32H56M8 40H56M8 48H56M16 10V54M24 10V54M32 10V54M40 10V54M48 10V54"/>
  </g>
  <!-- 4:3 frame -->
  <rect x="16" y="14" width="32" height="24" rx="1.2" fill="none" stroke="#ffc94d" stroke-opacity=".75" stroke-width="1" stroke-dasharray="2.2 1.6"/>
  <!-- 16:9 frame -->
  <rect x="11.3" y="16.6" width="41.4" height="23.3" rx="1.2" fill="none" stroke="#ff6eb4" stroke-opacity=".8" stroke-width="1"/>
  <!-- 2.39:1 scope frame (hero) -->
  <rect x="7" y="19.5" width="50" height="20.9" rx="1.6" fill="url(#arScope)" stroke="url(#arRim)" stroke-width="1.6" filter="url(#arGlow)"/>
  <!-- diagonal ratio line -->
  <line x1="7" y1="40.4" x2="57" y2="19.5" stroke="#e6fbff" stroke-width=".7" stroke-opacity=".55"/>
  <circle cx="32" cy="29.95" r="1.5" fill="#e6fbff" filter="url(#arGlow)"/>
  <!-- crop marks -->
  <g stroke="#e6fbff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M4 16.5V13.5H7M60 16.5V13.5H57M4 43.4V46.4H7M60 43.4V46.4H57"/>
  </g>
  <!-- label -->
  <text x="32" y="57" text-anchor="middle" font-family="Orbitron,'Exo 2',monospace" font-size="8.5" font-weight="700" letter-spacing="1.6" fill="#7ff3ff">AR</text>
</svg>
