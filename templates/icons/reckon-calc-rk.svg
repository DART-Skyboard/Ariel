<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="42%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="55%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="40%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5e4c8"/>
      <stop offset="100%" stop-color="#9fb892"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffd4"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <circle cx="12" cy="10" r="18" fill="#00e5ff" opacity=".06"/>
  <path d="M8 18 A24 24 0 0 1 56 18" fill="none" stroke="#00e5ff" stroke-width=".8" opacity=".18"/>
  <path d="M11 20 A20 20 0 0 1 53 20" fill="none" stroke="#00e5ff" stroke-width="1.1" opacity=".28" filter="url(#g)"/>

  <!-- chassis -->
  <rect x="11" y="8" width="42" height="46" rx="5.5" fill="url(#chassis)" stroke="#00e5ff" stroke-width="1.15" opacity=".95"/>
  <rect x="12.2" y="9.1" width="39.6" height="8" rx="3" fill="#00e5ff" opacity=".05"/>

  <!-- LCD -->
  <rect x="14.5" y="11" width="35" height="12.5" rx="2" fill="url(#lcd)"/>
  <rect x="14.5" y="11" width="35" height="12.5" rx="2" fill="none" stroke="#1c2a20" stroke-width=".4" opacity=".35"/>
  <text x="17" y="16.2" font-family="ui-monospace,monospace" font-size="3.2" fill="#3a4a32" opacity=".55">3ⁿ√(8+19)</text>
  <text x="47.6" y="21.6" font-family="ui-monospace,monospace" font-size="5.6" font-weight="700" fill="#1c2e18" text-anchor="end">3</text>

  <!-- sci row -->
  <g fill="#151c24" stroke="#00e5ff" stroke-width=".35" opacity=".85">
    <rect x="15" y="26.2" width="6.2" height="4.6" rx=".8"/>
    <rect x="22.2" y="26.2" width="6.2" height="4.6" rx=".8"/>
    <rect x="29.4" y="26.2" width="6.2" height="4.6" rx=".8"/>
    <rect x="36.6" y="26.2" width="6.2" height="4.6" rx=".8"/>
    <rect x="43.8" y="26.2" width="5.6" height="4.6" rx=".8"/>
  </g>
  <text x="18.1" y="29.5" font-family="ui-monospace,monospace" font-size="2.4" fill="#7dffd4" text-anchor="middle">xⁿ</text>
  <text x="25.3" y="29.5" font-family="ui-monospace,monospace" font-size="2.4" fill="#7dffd4" text-anchor="middle">ⁿ√</text>
  <text x="32.5" y="29.5" font-family="ui-monospace,monospace" font-size="2.6" fill="#c8f4ff" text-anchor="middle">(</text>
  <text x="39.7" y="29.5" font-family="ui-monospace,monospace" font-size="2.6" fill="#c8f4ff" text-anchor="middle">)</text>
  <text x="46.6" y="29.5" font-family="ui-monospace,monospace" font-size="2.3" fill="#ffc94d" text-anchor="middle">π</text>

  <!-- numeric pad -->
  <g fill="#0e141b" stroke="#3a5160" stroke-width=".3">
    <rect x="15" y="32.2" width="6.2" height="5.1" rx=".7"/>
    <rect x="22.2" y="32.2" width="6.2" height="5.1" rx=".7"/>
    <rect x="29.4" y="32.2" width="6.2" height="5.1" rx=".7"/>
    <rect x="15" y="38.4" width="6.2" height="5.1" rx=".7"/>
    <rect x="22.2" y="38.4" width="6.2" height="5.1" rx=".7"/>
    <rect x="29.4" y="38.4" width="6.2" height="5.1" rx=".7"/>
    <rect x="15" y="44.6" width="13.4" height="5.1" rx=".7"/>
    <rect x="29.4" y="44.6" width="6.2" height="5.1" rx=".7"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="3.1" fill="#dceeff" text-anchor="middle">
    <text x="18.1" y="35.8">7</text><text x="25.3" y="35.8">8</text><text x="32.5" y="35.8">9</text>
    <text x="18.1" y="42.0">4</text><text x="25.3" y="42.0">5</text><text x="32.5" y="42.0">6</text>
    <text x="21.7" y="48.2">0</text><text x="32.5" y="48.2">.</text>
  </g>
  <!-- ops + equals -->
  <rect x="36.8" y="32.2" width="5.8" height="5.1" rx=".7" fill="#1a2a22" stroke="#7dffd4" stroke-width=".4"/>
  <rect x="43.6" y="32.2" width="5.8" height="5.1" rx=".7" fill="#1a2a22" stroke="#7dffd4" stroke-width=".4"/>
  <rect x="36.8" y="38.4" width="5.8" height="5.1" rx=".7" fill="#1a2a22" stroke="#7dffd4" stroke-width=".4"/>
  <rect x="43.6" y="38.4" width="5.8" height="11.3" rx=".9" fill="url(#eq)" filter="url(#g)"/>
  <g font-family="ui-monospace,monospace" font-size="3.3" fill="#7dffd4" text-anchor="middle">
    <text x="39.7" y="35.8">÷</text><text x="46.5" y="35.8">×</text><text x="39.7" y="42.0">−</text>
  </g>
  <text x="46.5" y="45.6" font-family="ui-monospace,monospace" font-size="4.4" font-weight="700" fill="#061018" text-anchor="middle">=</text>

  <text x="32" y="61.2" font-family="ui-monospace,monospace" font-size="5.2" fill="#00e5ff" text-anchor="middle" opacity=".7" letter-spacing="1.4" filter="url(#g)">RKN</text>
</svg>
