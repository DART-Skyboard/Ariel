<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ash Tree IDE - LEATR vs Transformer Architecture</title>
    
    <!-- Autoload Scripts pointing to the DART-Skyboard/Ariel Repository -->
    <!-- When pushed to GitHub, these paths will resolve to your repo structure -->
    <script src="https://cdn.jsdelivr.net/gh/DART-Skyboard/Ariel@main/dartide/leatr_core.js" onerror="console.log('Repo script hook ready for GitHub deployment')"></script>
    <script src="https://cdn.jsdelivr.net/gh/DART-Skyboard/Ariel@main/dartide/ash_syntax.js" onerror="console.log('Syntax hook ready for GitHub deployment')"></script>
    
    <!-- Standard WebGL Renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #090b14;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #ide-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #111424 0%, #05060b 100%);
            border-bottom: 2px solid rgba(0, 243, 255, 0.4);
        }
        #console-panel {
            height: 35vh;
            display: flex;
            background-color: rgba(255, 255, 255, 0.02);
        }
        .log-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            font-size: 13px;
            white-space: pre-wrap;
        }
        .log-box.transformer {
            color: #b026ff;
            border-right: none;
        }
        .btn-run {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .btn-run:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .panel-header {
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="ide-container">
    <div id="viewport">
        <button class="btn-run" onclick="runIDE()">▶ BUILD & RUN COMPARISON</button>
        <div id="canvas-container" style="width: 100%; height: 100%;"></div>
    </div>
    <div id="console-panel">
        <div class="log-box" id="leatr-out">
<span class="panel-header" style="color: #00f3ff;">// LEATR ASH COMPILER</span>
// Awaiting Execute Command...
        </div>
        <div class="log-box transformer" id="transformer-out">
<span class="panel-header" style="color: #b026ff;">// TRANSFORMER WEIGHT MATRIX</span>
// Awaiting Vector Generation...
        </div>
    </div>
</div>

<script>
    // --- 3D Context Initialization ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Rooting parameters permanently active on XZ plane at Y=0
    const gridHelper = new THREE.GridHelper(20, 20, 0x00f3ff, 0x222538);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Objective Coordinate Node
    const targetGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const targetMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const targetMesh = new THREE.Mesh(targetGeo, targetMat);
    targetMesh.position.set(5, 4, -3);
    scene.add(targetMesh);

    const transformerMat = new THREE.LineBasicMaterial({ color: 0xb026ff });
    const leatrMat = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 2 });

    camera.position.set(0, 12, 20);
    camera.lookAt(0, 2, 0);

    function animate() {
        requestAnimationFrame(animate);
        targetMesh.rotation.y += 0.02;
        targetMesh.rotation.x += 0.01;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- IDE Execution Simulation ---
    function runIDE() {
        scene.remove(scene.getObjectByName("transformer-line"));
        scene.remove(scene.getObjectByName("leatr-line"));
        runLEATR();
        runTransformer();
    }

    function runLEATR() {
        const log = document.getElementById('leatr-out');
        log.innerHTML = '<span class="panel-header" style="color: #00f3ff;">// LEATR ASH COMPILER</span>\n';
        
        const syntax = \`// INITIATE LAYER ISOLATION
(xa²√xa)-1

// ESTABLISH DEFAULT ROOT
ROOT_XZ(Y=0);

// ALLOCATE BASE POLYGONS (ORDERS 1-20)
ALLOCATE_AXIS_POLY(X_EDGE, 5);
ALLOCATE_AXIS_POLY(Z_EDGE, -3);

// PROPAGATE VERTICAL PERPENDICULAR TO XC
GROW_PERPENDICULAR_XC(Y_TARGET, 4);

// ENGAGE SENSORY PENDULUM NODE (ORDERS 21-25)
BRPN_SYNC(ACTIVE);

// SEAL BOUNDARIES
(xa²√xa)+1\`;

        let points = [
            new THREE.Vector3(0,0,0),
            new THREE.Vector3(5,0,-3),
            new THREE.Vector3(5,4,-3)
        ];

        let lines = syntax.split("\n");
        let step = 0;

        const interval = setInterval(() => {
            if(step < lines.length) {
                if(lines[step].trim() !== "") {
                    log.innerHTML += lines[step] + "\n";
                    log.scrollTop = log.scrollHeight;
                }
                if(step === 7) {
                    const partial = new THREE.BufferGeometry().setFromPoints([points[0], points[1]]);
                    const line = new THREE.Line(partial, leatrMat);
                    line.name = "leatr-line";
                    scene.add(line);
                }
                if(step === 10) {
                    scene.remove(scene.getObjectByName("leatr-line"));
                    const full = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(full, leatrMat);
                    line.name = "leatr-line";
                    scene.add(line);
                }
                step++;
            } else {
                log.innerHTML += \`\n> COMPILATION SUCCESS. ZERO NOISE.\n\`;
                clearInterval(interval);
            }
        }, 150);
    }

    function runTransformer() {
        const log = document.getElementById('transformer-out');
        log.innerHTML = '<span class="panel-header" style="color: #b026ff;">// TRANSFORMER WEIGHT MATRIX</span>\n';
        
        let points = [];
        let current = new THREE.Vector3(0, 0, 0);
        points.push(current.clone());

        let step = 0;
        const interval = setInterval(() => {
            if(step < 10) {
                current.x += (5 - current.x) * 0.3 + (Math.random() - 0.5) * 0.8;
                current.y += (4 - current.y) * 0.3 + (Math.random() - 0.5) * 0.8;
                current.z += (-3 - current.z) * 0.3 + (Math.random() - 0.5) * 0.8;
                points.push(current.clone());
                
                log.innerHTML += \`[Attention Node] Approximating spatial vector: diff_variance(\${(Math.random()*0.1).toFixed(4)})\n\`;
                log.scrollTop = log.scrollHeight;
                
                scene.remove(scene.getObjectByName("transformer-line"));
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, transformerMat);
                line.name = "transformer-line";
                scene.add(line);
                
                step++;
            } else {
                points.push(targetMesh.position.clone());
                scene.remove(scene.getObjectByName("transformer-line"));
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, transformerMat);
                line.name = "transformer-line";
                scene.add(line);
                log.innerHTML += \`\n> TARGET CONVERGED VIA STATISTICAL SUMMATION.\n\`;
                clearInterval(interval);
            }
        }, 180);
    }
</script>
</body>
</html>
