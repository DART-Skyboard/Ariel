<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmospheric & Gravitational Calculators</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        :root {
            --primary-bg: #1a1e23;
            --secondary-bg: #2c323a;
            --border-color: #4a5461;
            --text-color: #e1e1e1;
            --accent-color-psi: #00bfff; /* Deep Sky Blue */
            --accent-hover-psi: #009acd;
            --accent-color-gravity: #39e75f; /* Neon Green */
            --accent-hover-gravity: #28b847;
            --font-main: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 0;
            margin: 0;
            font-size: 16px;
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 550px;
        }

        .calculator-container {
            width: 100%;
            background-color: var(--secondary-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        header {
            background-color: var(--primary-bg);
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 400;
            text-align: center;
            letter-spacing: 1px;
        }
        
        header h1 span.psi { color: var(--accent-color-psi); }
        header h1 span.gravity { color: var(--accent-color-gravity); }

        .main-content {
            padding: 25px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 300;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        select { cursor: pointer; }
        
        input:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.2); }
        .psi-calculator input:focus, .psi-calculator select:focus { border-color: var(--accent-color-psi); box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.2); }
        .gravity-calculator input:focus, .gravity-calculator select:focus { border-color: var(--accent-color-gravity); box-shadow: 0 0 0 3px rgba(57, 231, 95, 0.2); }


        .calculate-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .calculate-btn.psi-btn { background-color: var(--accent-color-psi); }
        .calculate-btn.psi-btn:hover { background-color: var(--accent-hover-psi); }
        .calculate-btn.gravity-btn { background-color: var(--accent-color-gravity); }
        .calculate-btn.gravity-btn:hover { background-color: var(--accent-hover-gravity); }


        hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 30px 0;
        }

        .results-container {
            background-color: var(--primary-bg);
            padding: 20px;
            border-radius: 6px;
            display: none; /* Initially hidden */
        }
        
        .results-container h2 {
            margin-top: 0;
            text-align: center;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            text-align: center;
        }
        
        .result-item {
            background-color: var(--secondary-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-item .unit {
            font-size: 0.85em;
            font-weight: 300;
            color: #aaa;
        }

        .result-item .value {
            font-size: 1.25em;
            font-weight: 700;
            word-wrap: break-word;
        }
        .psi-calculator .result-item .value { color: var(--accent-color-psi); }
        .gravity-calculator .result-item .value { color: var(--accent-color-gravity); }


    </style>
</head>
<body>

<div id="app-wrapper">
    <div class="calculator-container psi-calculator">
        <header>
            <h1>Atmospheric <span class="psi">Altitude</span> Calculator</h1>
        </header>
        <main class="main-content">
            <div class="control-group">
                <label for="preset-select-psi">Celestial Body Preset</label>
                <select id="preset-select-psi">
                    <option value="earth">Earth</option>
                    <option value="moon">Moon</option>
                    <option value="mars">Mars</option>
                    <option value="titan">Titan</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="control-group">
                <label for="psi-input">Sea Level Pressure (PSI)</label>
                <input type="number" id="psi-input" placeholder="e.g., 14.7">
            </div>
            <div class="control-group">
                <label for="gravity-input-psi">Relative Gravity (Used to scale depletion rate)</label>
                <input type="number" id="gravity-input-psi" placeholder="e.g., 1.0">
            </div>
            <button class="calculate-btn psi-btn" id="calculate-btn-psi">Calculate Max Atmospheric Altitude</button>
            <hr>
            <div class="results-container" id="results-container-psi">
                <h2>Max Atmospheric Altitude</h2>
                <div class="result-grid">
                    <div class="result-item"><div class="value" id="result-in-psi">0</div><div class="unit">Inches</div></div>
                    <div class="result-item"><div class="value" id="result-ft-psi">0</div><div class="unit">Feet</div></div>
                    <div class="result-item"><div class="value" id="result-m-psi">0</div><div class="unit">Meters</div></div>
                    <div class="result-item"><div class="value" id="result-mi-psi">0</div><div class="unit">Miles</div></div>
                    <div class="result-item"><div class="value" id="result-km-psi">0</div><div class="unit">Kilometers</div></div>
                </div>
            </div>
        </main>
    </div>

    <div class="calculator-container gravity-calculator">
        <header>
            <h1>Gravitational <span class="gravity">Altitude</span> Calculator</h1>
        </header>
        <main class="main-content">
            <div class="control-group">
                <label for="preset-select-gravity">Celestial Body Preset</label>
                <select id="preset-select-gravity">
                    <option value="earth">Earth</option>
                    <option value="moon">Moon</option>
                    <option value="mars">Mars</option>
                    <option value="titan">Titan</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gravity-input-surface">Surface Gravity (Relative to Earth = 1 G)</label>
                <input type="number" id="gravity-input-surface" placeholder="e.g., 1.0">
            </div>
            <button class="calculate-btn gravity-btn" id="calculate-btn-gravity">Calculate Max Gravitational Altitude</button>
            <hr>
            <div class="results-container" id="results-container-gravity">
                <h2>Max Gravitational Altitude</h2>
                <div class="result-grid">
                    <div class="result-item"><div class="value" id="result-in-gravity">0</div><div class="unit">Inches</div></div>
                    <div class="result-item"><div class="value" id="result-ft-gravity">0</div><div class="unit">Feet</div></div>
                    <div class="result-item"><div class="value" id="result-m-gravity">0</div><div class="unit">Meters</div></div>
                    <div class="result-item"><div class="value" id="result-mi-gravity">0</div><div class="unit">Miles</div></div>
                    <div class="result-item"><div class="value" id="result-km-gravity">0</div><div class="unit">Kilometers</div></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Shared Data ---
        const presets = {
            earth: { psi: 14.7, gravity: 1.0 },
            moon: { psi: 0.000000000000044, gravity: 0.166 },
            mars: { psi: 0.095, gravity: 0.379 },
            titan: { psi: 21.0, gravity: 0.138 },
            custom: { psi: '', gravity: ''}
        };

        const formatNumber = (num) => {
             if (num < 1000) return num.toFixed(2);
             return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
        };
        
        // --- PSI Calculator Logic ---
        const psiPresetSelect = document.getElementById('preset-select-psi');
        const psiInput = document.getElementById('psi-input');
        const psiGravityInput = document.getElementById('gravity-input-psi');
        const psiCalculateBtn = document.getElementById('calculate-btn-psi');
        const psiResultsContainer = document.getElementById('results-container-psi');
        
        function setupPsiCalculator() {
            function updateInputs(preset) {
                psiInput.value = presets[preset].psi;
                psiGravityInput.value = presets[preset].gravity;
                psiInput.readOnly = (preset !== 'custom');
                psiGravityInput.readOnly = (preset !== 'custom');
            }

            psiPresetSelect.addEventListener('change', () => {
                updateInputs(psiPresetSelect.value);
                psiResultsContainer.style.display = 'none';
            });

            psiCalculateBtn.addEventListener('click', () => {
                const seaLevelPsi = parseFloat(psiInput.value);
                const relativeGravity = parseFloat(psiGravityInput.value);

                if (isNaN(seaLevelPsi) || isNaN(relativeGravity) || seaLevelPsi < 0 || relativeGravity < 0) {
                    alert("Please enter valid, non-negative numbers for PSI and gravity.");
                    return;
                }
                if (seaLevelPsi === 0) { displayResults(0); return; }
                if (relativeGravity === 0) {
                     alert("Gravity cannot be zero for the pressure calculation, as it would imply an infinitely tall atmosphere.");
                    return;
                }
                
                const earthAtmosphereInches = 62 * 5280 * 12; // ~3.9M inches
                const basePsiDecreasePerInch = 14.7 / earthAtmosphereInches;
                const currentPsiDecreasePerInch = basePsiDecreasePerInch * relativeGravity;
                const totalInches = seaLevelPsi / currentPsiDecreasePerInch;
                displayResults(totalInches);
            });

            function displayResults(totalInches) {
                document.getElementById('result-in-psi').textContent = formatNumber(totalInches);
                document.getElementById('result-ft-psi').textContent = formatNumber(totalInches / 12);
                document.getElementById('result-m-psi').textContent = formatNumber(totalInches * 0.0254);
                document.getElementById('result-mi-psi').textContent = formatNumber(totalInches / 12 / 5280);
                document.getElementById('result-km-psi').textContent = formatNumber(totalInches * 0.0254 / 1000);
                psiResultsContainer.style.display = 'block';
            }
            updateInputs('earth');
        }

        // --- Gravity Calculator Logic ---
        const gravityPresetSelect = document.getElementById('preset-select-gravity');
        const gravitySurfaceInput = document.getElementById('gravity-input-surface');
        const gravityCalculateBtn = document.getElementById('calculate-btn-gravity');
        const gravityResultsContainer = document.getElementById('results-container-gravity');

        function setupGravityCalculator() {
             function updateInputs(preset) {
                gravitySurfaceInput.value = presets[preset].gravity;
                gravitySurfaceInput.readOnly = (preset !== 'custom');
            }

            gravityPresetSelect.addEventListener('change', () => {
                updateInputs(gravityPresetSelect.value);
                gravityResultsContainer.style.display = 'none';
            });

            gravityCalculateBtn.addEventListener('click', () => {
                const surfaceGravityG = parseFloat(gravitySurfaceInput.value);

                if (isNaN(surfaceGravityG) || surfaceGravityG <= 0) {
                    alert("Please enter a valid, positive number for surface gravity.");
                    return;
                }
                
                // This is a simplified linear model and not physically accurate.
                // It assumes Earth's significant gravity "ends" at the exosphere boundary (~10,000 km) for this model.
                const earthGravityAltitudeKm = 10000;
                const earthGravityAltitudeInches = earthGravityAltitudeKm * 1000 / 0.0254;
                
                // Base rate is for Earth's 1G depleting over that distance.
                const baseGravityDecreasePerInch = 1.0 / earthGravityAltitudeInches;
                
                // The total altitude is scaled directly from the surface gravity.
                const totalInches = surfaceGravityG / baseGravityDecreasePerInch;

                displayResults(totalInches);
            });
            
            function displayResults(totalInches) {
                document.getElementById('result-in-gravity').textContent = formatNumber(totalInches);
                document.getElementById('result-ft-gravity').textContent = formatNumber(totalInches / 12);
                document.getElementById('result-m-gravity').textContent = formatNumber(totalInches * 0.0254);
                document.getElementById('result-mi-gravity').textContent = formatNumber(totalInches / 12 / 5280);
                document.getElementById('result-km-gravity').textContent = formatNumber(totalInches * 0.0254 / 1000);
                gravityResultsContainer.style.display = 'block';
            }
            updateInputs('earth');
        }

        // --- Initialize Both Calculators ---
        setupPsiCalculator();
        setupGravityCalculator();
    });
</script>

</body>
</html>
