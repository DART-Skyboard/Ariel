<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmospheric Altitude Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        :root {
            --primary-bg: #1a1e23;
            --secondary-bg: #2c323a;
            --border-color: #4a5461;
            --text-color: #e1e1e1;
            --accent-color: #00bfff; /* Deep Sky Blue */
            --accent-hover: #009acd;
            --font-main: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-size: 16px;
        }

        .calculator-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--secondary-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        header {
            background-color: var(--primary-bg);
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 400;
            text-align: center;
            letter-spacing: 1px;
        }
        
        header h1 span {
            font-weight: 700;
            color: var(--accent-color);
        }

        .main-content {
            padding: 25px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 300;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.2);
        }
        
        select {
            cursor: pointer;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            background-color: var(--accent-hover);
        }

        hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 30px 0;
        }

        #results-container {
            background-color: var(--primary-bg);
            padding: 20px;
            border-radius: 6px;
            display: none; /* Initially hidden */
        }
        
        #results-container h2 {
            margin-top: 0;
            text-align: center;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            text-align: center;
        }
        
        .result-item {
            background-color: var(--secondary-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-item .unit {
            font-size: 0.85em;
            font-weight: 300;
            color: #aaa;
        }

        .result-item .value {
            font-size: 1.25em;
            font-weight: 700;
            color: var(--accent-color);
            word-wrap: break-word;
        }

    </style>
</head>
<body>

    <div class="calculator-container">
        <header>
            <h1>Atmospheric Altitude <span>Calculator</span></h1>
        </header>
        <main class="main-content">
            <div class="control-group">
                <label for="preset-select">Celestial Body Preset</label>
                <select id="preset-select">
                    <option value="earth">Earth</option>
                    <option value="moon">Moon</option>
                    <option value="mars">Mars</option>
                    <option value="titan">Titan</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="psi-input">Sea Level Pressure (PSI)</label>
                <input type="number" id="psi-input" placeholder="e.g., 14.7">
            </div>

            <div class="control-group">
                <label for="gravity-input">Relative Gravity (Earth = 1 G)</label>
                <input type="number" id="gravity-input" placeholder="e.g., 1.0">
            </div>

            <button class="calculate-btn" id="calculate-btn">Calculate Altitude</button>
            
            <hr>

            <div id="results-container">
                <h2>Maximum Atmospheric Altitude</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="value" id="result-in">0</div>
                        <div class="unit">Inches</div>
                    </div>
                     <div class="result-item">
                        <div class="value" id="result-ft">0</div>
                        <div class="unit">Feet</div>
                    </div>
                     <div class="result-item">
                        <div class="value" id="result-m">0</div>
                        <div class="unit">Meters</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="result-mi">0</div>
                        <div class="unit">Miles</div>
                    </div>
                     <div class="result-item">
                        <div class="value" id="result-km">0</div>
                        <div class="unit">Kilometers</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const presets = {
                earth: { psi: 14.7, gravity: 1.0 },
                moon: { psi: 0.000000000000044, gravity: 0.166 },
                mars: { psi: 0.095, gravity: 0.379 },
                titan: { psi: 21.0, gravity: 0.138 },
                custom: { psi: '', gravity: ''}
            };

            const presetSelect = document.getElementById('preset-select');
            const psiInput = document.getElementById('psi-input');
            const gravityInput = document.getElementById('gravity-input');
            const calculateBtn = document.getElementById('calculate-btn');
            const resultsContainer = document.getElementById('results-container');
            
            const resultIn = document.getElementById('result-in');
            const resultFt = document.getElementById('result-ft');
            const resultMi = document.getElementById('result-mi');
            const resultM = document.getElementById('result-m');
            const resultKm = document.getElementById('result-km');

            function updateInputs(preset) {
                psiInput.value = presets[preset].psi;
                gravityInput.value = presets[preset].gravity;
                psiInput.readOnly = (preset !== 'custom');
                gravityInput.readOnly = (preset !== 'custom');
            }

            presetSelect.addEventListener('change', () => {
                updateInputs(presetSelect.value);
                resultsContainer.style.display = 'none';
            });
            
            calculateBtn.addEventListener('click', () => {
                const seaLevelPsi = parseFloat(psiInput.value);
                const relativeGravity = parseFloat(gravityInput.value);

                if (isNaN(seaLevelPsi) || isNaN(relativeGravity) || seaLevelPsi < 0 || relativeGravity < 0) {
                    alert("Please enter valid, non-negative numbers for PSI and gravity.");
                    return;
                }
                
                if (seaLevelPsi === 0) {
                    displayResults(0);
                    return;
                }
                
                if (relativeGravity === 0) {
                     alert("Gravity cannot be zero for this calculation, as it would imply an infinitely tall atmosphere.");
                    return;
                }
                
                // This calculation is based on a simplified linear model where pressure depletes at a constant rate.
                // The base rate is derived from Earth's pressure (14.7 PSI) depleting over its effective atmosphere height (~62 miles).
                const earthAtmosphereInches = 62 * 5280 * 12; // 3,934,080 inches
                const basePsiDecreasePerInch = 14.7 / earthAtmosphereInches;
                
                // Adjust the rate of depletion based on the celestial body's gravity.
                const currentPsiDecreasePerInch = basePsiDecreasePerInch * relativeGravity;
                
                // Calculate the total inches required to deplete the given PSI.
                const totalInches = seaLevelPsi / currentPsiDecreasePerInch;
                
                displayResults(totalInches);
            });

            function displayResults(totalInches) {
                const totalFeet = totalInches / 12;
                const totalMiles = totalFeet / 5280;
                const totalMeters = totalInches * 0.0254;
                const totalKilometers = totalMeters / 1000;
                
                const formatNumber = (num) => {
                     if (num < 1000) return num.toFixed(2);
                     return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
                };

                resultIn.textContent = formatNumber(totalInches);
                resultFt.textContent = formatNumber(totalFeet);
                resultM.textContent = formatNumber(totalMeters);
                resultMi.textContent = formatNumber(totalMiles);
                resultKm.textContent = formatNumber(totalKilometers);
                
                resultsContainer.style.display = 'block';
            }

            // Initialize with Earth preset
            updateInputs('earth');
        });
    </script>
</body>
</html>
