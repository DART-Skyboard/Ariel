<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DART Dovetail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; background: #05080d; color: #e7f4f6; font-family: 'Rajdhani', system-ui, sans-serif; overflow: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: linear-gradient(to right, rgba(186,214,224,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(186,214,224,.05) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #bgvid { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; background: #05080d; }
    model-viewer { width: 100%; height: 100%; background: transparent !important; --poster-color: transparent; display: block; position: relative; z-index: 2; }
    #headertool { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
    #logo { width: min(168px, 46vw); height: auto; filter: drop-shadow(0 0 8px rgba(140,180,255,.35)); }
    #toolbar { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; pointer-events: auto; background: transparent; border: none; }
    #toolbar button, #toolbar a { padding: 5px 11px; background: rgba(8,14,22,.42); color: #e7f4f6; border: 1px solid rgba(186,214,224,.45); border-radius: 999px; font-weight: 600; font-size: .68rem; letter-spacing: .4px; text-transform: uppercase; text-decoration: none; white-space: nowrap; font-family: inherit; backdrop-filter: blur(8px); }
    #toolbar button.active { background: rgba(8,14,22,.7); color: #fff; }
    #muteBtn { position: absolute; top: 10px; right: 10px; z-index: 61; width: 36px; height: 36px; border-radius: 50%; background: rgba(8,14,22,.35); border: 1px solid rgba(186,214,224,.35); display: flex; align-items: center; justify-content: center; }
    #muteBtn svg { width: 16px; height: 16px; fill: #d5e7ee; }
    #tryonStage { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden; background: #000; }
    #tryonStage.active { display: block; }
    #tryonMirror { position: absolute; inset: 0; overflow: hidden; transform: scaleX(-1); }
    #tryonVideo, #tryonOverlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #tryonOverlay { pointer-events: none; }
    #exitCam { position: absolute; top: 14px; left: 14px; z-index: 4; padding: 6px 12px; border: none; border-radius: 999px; background: rgba(8,14,22,.55); color: #fff; font: 700 .75rem Rajdhani, system-ui, sans-serif; letter-spacing: .3px; text-transform: uppercase; }
    #shutter { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 4; width: 68px; height: 68px; border-radius: 50%; border: 3px solid #fff; background: transparent; padding: 0; }
    #shutter span { display: block; width: 52px; height: 52px; margin: 5px auto; border-radius: 50%; background: #fff; }
    #tryonStatus { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 2; color: #d5e7ee; font-size: .8rem; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 12px; }
    #err { pointer-events: auto; margin: 0; max-width: 92vw; text-align: center; font-size: .78rem; background: rgba(8,16,28,.72); border: 1px solid rgba(0,255,255,.35); border-radius: 12px; padding: 5px 8px; }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <video id="bgvid" autoplay muted loop playsinline></video>
  <audio id="bgAudio" loop src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/dovetail_lock.mp3"></audio>
  <button id="muteBtn" aria-label="Play track"><svg id="iconMuted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
  <div id="headertool">
    <img id="logo" src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/dovetailwhite.png" alt="dart dovetail">
    <div id="toolbar">
      <button id="exportPNG">Export PNG</button>
      <button id="exportGLB">Export GLB</button>
      <button id="toggleTryOn">Start AR</button>
    </div>
    <p id="err" hidden></p>
  </div>
  <model-viewer id="viewer" src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/templates/dovetail.glb" ios-src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/templates/DART%20Dovetail.usdz" alt="DART Dovetail" camera-controls exposure="1" environment-image="neutral" shadow-intensity="1" interaction-prompt="auto"></model-viewer>
  <div id="tryonStage">
    <div id="tryonMirror">
      <video id="tryonVideo" playsinline muted autoplay></video>
      <canvas id="tryonOverlay"></canvas>
    </div>
    <button id="exitCam" type="button">Exit</button>
    <button id="shutter" type="button" aria-label="Take photo"><span></span></button>
    <div id="tryonStatus">Starting camera…</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const TASK = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    const GLB = 'https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/templates/dovetail.glb';
    const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

    const bgvid = document.getElementById('bgvid');
    const bgAudio = document.getElementById('bgAudio');
    const viewer = document.getElementById('viewer');
    const stage = document.getElementById('tryonStage');
    const video = document.getElementById('tryonVideo');
    const canvas = document.getElementById('tryonOverlay');
    const statusEl = document.getElementById('tryonStatus');
    const errEl = document.getElementById('err');
    const btnTry = document.getElementById('toggleTryOn');

    (async () => {
      try {
        const r = await fetch('https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/dovetail.mp4');
        if (!r.ok) throw new Error('video');
        const blob = await r.blob();
        bgvid.src = URL.createObjectURL(new Blob([blob], { type: 'video/mp4' }));
        bgvid.play().catch(() => {});
      } catch { bgvid.play().catch(() => {}); }
    })();

    let trackOn = false;
    document.getElementById('muteBtn').onclick = () => {
      if (bgAudio.paused) bgAudio.play().catch(() => {});
      else { bgAudio.pause(); bgAudio.currentTime = 0; }
    };
    document.getElementById('exportGLB').onclick = () => {
      const a = document.createElement('a');
      a.href = GLB; a.download = 'dovetail.glb'; a.click();
    };
    document.getElementById('exportPNG').onclick = () => {
      if (trackOn && video.videoWidth > 2) {
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        const ctx = c.getContext('2d');
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        ctx.drawImage(canvas, 0, 0);
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png'); a.download = 'dovetail-tryon.png'; a.click();
        return;
      }
      try {
        const a = document.createElement('a');
        a.href = viewer.toDataURL('image/png'); a.download = 'dovetail.png'; a.click();
      } catch { showErr('PNG export failed. Make sure the model is loaded.'); }
    };

    let active = false, stream = null, raf = 0, landmarker = null, renderer, scene, camera, pivot, occluder, modelWidth = 0.14, seen = false;
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), targetPos = new THREE.Vector3(), targetQuat = new THREE.Quaternion();
    const xAxis = new THREE.Vector3(), yAxis = new THREE.Vector3(), zAxis = new THREE.Vector3(), yRaw = new THREE.Vector3();
    const leftEye = new THREE.Vector3(), rightEye = new THREE.Vector3(), scratch = new THREE.Vector3();
    let scale = 1;

    function showErr(msg) { errEl.hidden = !msg; errEl.textContent = msg || ''; }
    async function openCam() {
      const tries = [
        { audio: false, video: { facingMode: { exact: 'user' } } },
        { audio: false, video: { facingMode: 'user' } },
      ];
      let last;
      for (const constraints of tries) {
        try { return await navigator.mediaDevices.getUserMedia(constraints); }
        catch (err) { last = err; }
      }
      throw last || new Error('camera blocked');
    }
    function stop() {
      active = false; trackOn = false; cancelAnimationFrame(raf);
      stream?.getTracks().forEach(t => t.stop()); stream = null;
      video.srcObject = null;
      stage.classList.remove('active');
      bgvid.style.display = ''; viewer.style.display = '';
      document.getElementById('headertool').style.visibility = '';
      btnTry.textContent = 'Start AR'; btnTry.classList.remove('active');
    }
    btnTry.onclick = () => active ? stop() : start();
    document.getElementById('exitCam').onclick = () => stop();
    document.getElementById('shutter').onclick = () => document.getElementById('exportPNG').click();

    async function start() {
      showErr('');
      statusEl.textContent = 'Requesting camera…';
      stage.classList.add('active');
      try {
        stream = await Promise.race([
          openCam(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), 8000))
        ]);
        video.srcObject = stream; video.muted = true; video.playsInline = true;
        await video.play();
        bgvid.style.display = 'none'; viewer.style.display = 'none';
        document.getElementById('headertool').style.visibility = 'hidden';
        active = true; trackOn = true;
        btnTry.textContent = 'Exit'; btnTry.classList.add('active');
        statusEl.textContent = 'Tracking…';
        await track();
      } catch (e) {
        stop();
        const raw = e && e.message ? e.message : 'camera blocked';
        showErr(/denied|notallowed|permission|timed out/i.test(raw)
          ? 'Front camera was blocked. Allow the camera, then tap Start AR again.'
          : 'Front camera failed: ' + raw);
      }
    }

    function place(face, w, h) {
      const IPD = 0.063;
      const focal = (h / 2) / Math.tan((camera.fov * Math.PI) / 360);
      const mid = (a, b) => ({ x: (face[a].x + face[b].x) / 2, y: (face[a].y + face[b].y) / 2, z: (face[a].z + face[b].z) / 2 });
      const L = mid(33, 133), R = mid(263, 362);
      const ipdPx = Math.hypot((R.x - L.x) * w, (R.y - L.y) * h);
      if (ipdPx < 8) return;
      const widthM = (IPD * w) / ipdPx;
      const eyeZ = (L.z + R.z) / 2;
      const depth = (IPD * focal) / ipdPx;
      const at = (i, out) => {
        const lm = face[i];
        return out.set((lm.x - 0.5) * widthM, -((lm.y - 0.5) * h * widthM) / w, -(depth + (lm.z - eyeZ) * widthM));
      };
      at(33, leftEye); leftEye.add(at(133, scratch)).multiplyScalar(0.5);
      at(263, rightEye); rightEye.add(at(362, scratch)).multiplyScalar(0.5);
      at(10, yRaw); at(152, scratch); yRaw.sub(scratch);
      xAxis.copy(rightEye).sub(leftEye).normalize();
      yRaw.normalize();
      zAxis.crossVectors(xAxis, yRaw).normalize();
      if (zAxis.z < 0) zAxis.negate();
      yAxis.crossVectors(zAxis, xAxis).normalize();
      targetPos.copy(leftEye).add(rightEye).multiplyScalar(0.5);
      targetPos.addScaledVector(yAxis, -0.005);
      targetPos.addScaledVector(zAxis, 0.012);
      targetQuat.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
      const targetScale = 0.132 / modelWidth;
      const k = seen ? 0.45 : 1;
      pos.lerp(targetPos, k); quat.slerp(targetQuat, k);
      scale = seen ? scale + (targetScale - scale) * 0.35 : targetScale;
      seen = true;
      pivot.position.copy(pos); pivot.quaternion.copy(quat); pivot.scale.setScalar(scale);
      const attr = occluder.geometry.getAttribute('position');
      let cx = 0, cy = 0, cz = 0;
      for (let i = 0; i < OVAL.length; i++) {
        at(OVAL[i], scratch); scratch.addScaledVector(zAxis, -0.01);
        attr.setXYZ(i + 1, scratch.x, scratch.y, scratch.z);
        cx += scratch.x; cy += scratch.y; cz += scratch.z;
      }
      const n = OVAL.length;
      attr.setXYZ(0, cx / n - zAxis.x * 0.04, cy / n - zAxis.y * 0.04, cz / n - zAxis.z * 0.04);
      attr.needsUpdate = true;
    }

    async function track() {
      if (!renderer) {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setClearColor(0, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.add(new THREE.HemisphereLight(0xf4fbff, 0x1a2430, 0.9));
        const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(0.2, 0.5, 1); scene.add(key);
        camera = new THREE.PerspectiveCamera(55, 1, 0.02, 8);
        pivot = new THREE.Group(); scene.add(pivot);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((OVAL.length + 1) * 3), 3));
        const idx = [];
        for (let i = 0; i < OVAL.length; i++) idx.push(0, i + 1, ((i + 1) % OVAL.length) + 1);
        geo.setIndex(idx);
        occluder = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, side: THREE.DoubleSide }));
        occluder.renderOrder = -1; occluder.frustumCulled = false; scene.add(occluder);
        const gltf = await new GLTFLoader().loadAsync(GLB);
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        modelWidth = Math.max(size.x, 1e-4);
        model.position.sub(new THREE.Vector3(center.x, center.y, box.max.z));
        pivot.add(model);
      }
      if (!landmarker) {
        const vision = await import(VISION + '/vision_bundle.mjs');
        const files = await vision.FilesetResolver.forVisionTasks(VISION + '/wasm');
        const opts = (delegate) => ({ baseOptions: { modelAssetPath: TASK, delegate }, runningMode: 'VIDEO', numFaces: 1 });
        landmarker = await vision.FaceLandmarker.createFromOptions(files, opts('GPU')).catch(() => vision.FaceLandmarker.createFromOptions(files, opts('CPU')));
      }
      let last = 0;
      const loop = () => {
        if (!active) return;
        raf = requestAnimationFrame(loop);
        if (video.readyState < 2) return;
        const w = video.videoWidth, h = video.videoHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h; camera.updateProjectionMatrix();
        }
        const now = performance.now();
        last = now <= last ? last + 1 : now;
        const face = landmarker.detectForVideo(video, last).faceLandmarks?.[0];
        const found = !!(face && face.length > 454);
        if (found) place(face, w, h);
        pivot.visible = found && seen;
        occluder.visible = found && seen;
        statusEl.textContent = found ? 'Locked' : 'Tracking…';
        renderer.render(scene, camera);
      };
      loop();
    }
  </script>
</body>
</html>
