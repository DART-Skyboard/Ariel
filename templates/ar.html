<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DART Dovetail — Front-Camera Try-On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #05080d; color: #00ffff;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
    }
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transform: scaleX(-1); /* mirror so tracking matches visual */
      background: #000;
    }
    #video {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    #overlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Slim, frosted toolbar */
    #headertool {
      position: absolute; top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex; flex-direction: column; align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    #logo {
      width: min(180px, 40vw); height: auto;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.4));
      pointer-events: none;
    }
    #toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 10px;
      background: rgba(10, 20, 35, 0.35);
      border: 1px solid rgba(0,255,255,0.35);
      border-radius: 20px;
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      pointer-events: auto;
    }
    #toolbar button, #toolbar .status {
      padding: 6px 12px;
      background: rgba(0,255,255,0.85);
      color: #051018;
      border: none; border-radius: 14px;
      font-weight: 700; font-size: 0.85rem;
      cursor: pointer; letter-spacing: 0.4px;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.15s;
    }
    #toolbar button:hover { background: #00e0e0; }
    #toolbar button:active { transform: scale(0.97); }
    #toolbar button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { background: transparent !important; color: #00ffff !important; font-size: 0.75rem; padding: 4px 8px; }

    #muteBtn {
      position: absolute; top: 12px; right: 12px; z-index: 21;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(10,20,35,0.4);
      border: 1px solid rgba(0,255,255,0.35);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #muteBtn svg { width: 18px; height: 18px; fill: #00ffff; }

    #consent {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5,8,13,0.92); gap: 16px; text-align: center; padding: 20px;
    }
    #consent button {
      padding: 10px 22px; border-radius: 20px; border: none;
      background: #00ffff; color: #051018; font-weight: 700; font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="consent">
    <img src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/refs/heads/main/static/dovetailwhite.png" alt="DART Dovetail" style="width:140px;">
    <p style="max-width:360px; line-height:1.4;">Front-camera try-on for DART Dovetail AR glasses.<br>Face & head tracking runs on-device. Nothing is uploaded.</p>
    <button id="startBtn">Start Front Camera</button>
  </div>

  <div id="stage" style="display:none;">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="headertool" style="display:none;">
    <img id="logo" src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/refs/heads/main/static/dovetailwhite.png" alt="dovetail">
    <div id="toolbar">
      <span class="status" id="status">Tracking…</span>
      <button id="captureBtn">Capture PNG</button>
    </div>
  </div>

  <button id="muteBtn" style="display:none;" aria-label="Mute">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>

  <audio id="bgAudio" loop preload="none" src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/dovetail_lock.mp3"></audio>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';

    const GLASSES_URL = 'https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/templates/dovetail.glb';
    const FACE_URL = 'https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/mediapipe/modules/face_geometry/data/canonical_face_model.obj';
    const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

    const FIT = 0.92;
    const SMOOTH = 0.45;
    const DROP = 0.4;

    const startBtn = document.getElementById('startBtn');
    const consent = document.getElementById('consent');
    const stage = document.getElementById('stage');
    const video = document.getElementById('video');
    const header = document.getElementById('headertool');
    const statusEl = document.getElementById('status');
    const captureBtn = document.getElementById('captureBtn');
    const muteBtn = document.getElementById('muteBtn');
    const bgAudio = document.getElementById('bgAudio');

    let landmarker, renderer, scene, camera, anchor, glasses;
    let running = false;

    startBtn.onclick = start;

    async function start() {
      try {
        statusEl.textContent = 'Requesting camera…';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        consent.style.display = 'none';
        stage.style.display = 'block';
        header.style.display = 'flex';
        muteBtn.style.display = 'flex';

        await setupTracking();
        running = true;
        statusEl.textContent = 'Tracking';
      } catch (e) {
        statusEl.textContent = 'Camera error';
        alert('Camera access required for try-on: ' + e.message);
      }
    }

    async function setupTracking() {
      const { FilesetResolver, FaceLandmarker } = await import(VISION + '/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks(VISION + '/wasm');
      const opts = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFacialTransformationMatrixes: true,
        outputFaceBlendshapes: false
      });
      landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU'))
        .catch(() => FaceLandmarker.createFromOptions(files, opts('CPU')));

      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, canvas: document.getElementById('overlay') });
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(63, w / h, 0.1, 10000);
      camera.position.set(0, 0, 0);

      anchor = new THREE.Group();
      anchor.matrixAutoUpdate = false;
      scene.add(anchor);

      // Optional canonical face occluder (depth only)
      try {
        const faceText = await (await fetch(FACE_URL)).text();
        const occluder = new OBJLoader().parse(faceText);
        occluder.traverse(m => {
          if (m.isMesh) m.material = new THREE.MeshBasicMaterial({ colorWrite: false });
        });
        occluder.renderOrder = -1;
        anchor.add(occluder);
      } catch (_) { /* non-fatal */ }

      // Load glasses
      const gltf = await new GLTFLoader().loadAsync(GLASSES_URL);
      glasses = gltf.scene;
      const box = new THREE.Box3().setFromObject(glasses);
      const size = box.getSize(new THREE.Vector3());
      // Approximate face width from typical canonical (~12-14 cm)
      const faceWidth = 13.5;
      glasses.scale.setScalar(FIT * faceWidth / Math.max(size.x, 0.01));
      glasses.position.set(0, -DROP, 2.5); // fine-tune Z for snug fit
      anchor.add(glasses);

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir = new THREE.DirectionalLight(0xffffff, 0.6);
      dir.position.set(1, 2, 3);
      scene.add(dir);

      animate();
    }

    const target = new THREE.Matrix4();
    const tp = new THREE.Vector3(), tq = new THREE.Quaternion(), ts = new THREE.Vector3();
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    let seen = false;

    function animate() {
      if (!running) return;
      requestAnimationFrame(animate);

      if (video.readyState < 2) return;

      const res = landmarker.detectForVideo(video, performance.now());
      const found = res.facialTransformationMatrixes && res.facialTransformationMatrixes.length > 0;

      if (found) {
        target.fromArray(res.facialTransformationMatrixes[0].data).decompose(tp, tq, ts);
        const k = seen ? SMOOTH : 1;
        p.lerp(tp, k);
        q.slerp(tq, k);
        s.lerp(ts, k);
        anchor.matrix.compose(p, q, s);
        anchor.matrixWorldNeedsUpdate = true;
        anchor.visible = true;
        statusEl.textContent = 'Tracking';
      } else {
        anchor.visible = false;
        statusEl.textContent = 'No face';
      }
      seen = found;

      renderer.render(scene, camera);
    }

    // Capture: composite video + overlay, download PNG
    captureBtn.onclick = () => {
      if (!video.videoWidth) return;
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      const ctx = c.getContext('2d');

      // Draw video (flip back because stage is mirrored)
      ctx.save();
      ctx.translate(c.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, c.width, c.height);
      ctx.restore();

      // Draw Three.js overlay (also flip to match)
      if (renderer && renderer.domElement) {
        ctx.save();
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(renderer.domElement, 0, 0, c.width, c.height);
        ctx.restore();
      }

      const a = document.createElement('a');
      a.href = c.toDataURL('image/png');
      a.download = 'dart-dovetail-tryon-' + Date.now() + '.png';
      a.click();
      statusEl.textContent = 'PNG saved';
      setTimeout(() => { if (running) statusEl.textContent = 'Tracking'; }, 1500);
    };

    // Mute toggle
    let trackPlaying = false;
    muteBtn.onclick = () => {
      if (!trackPlaying) {
        bgAudio.play().catch(()=>{});
        trackPlaying = true;
      } else {
        bgAudio.pause();
        bgAudio.currentTime = 0;
        trackPlaying = false;
      }
    };

    window.addEventListener('resize', () => {
      if (!renderer || !video.videoWidth) return;
      const w = video.videoWidth, h = video.videoHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    });
  </script>
</body>
</html>
