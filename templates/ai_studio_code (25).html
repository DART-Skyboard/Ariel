<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Edge Web App - Single File</title>
    <style>
        /* --- CSS Styles --- */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: #eee;
            display: flex;
            height: 100vh; /* Full viewport height */
            box-sizing: border-box;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Behind UI */
            pointer-events: auto; /* Ensure canvas can receive pointer events */
        }
        #ui-container {
            position: absolute; /* Changed to absolute for sliding effect */
            top: 0;
            left: 0; /* Starts at the left edge */
            width: 320px; /* Fixed width for the UI panel */
            height: 100vh; /* Full viewport height */
            background-color: rgba(30, 30, 30, 0.95);
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateX(-100%); /* Hidden by default */
            transition: transform 0.3s ease-in-out; /* Smooth transition */
            z-index: 10; /* Above the canvas */
        }
        #nav-cube-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            z-index: 20;
            border: 1px solid #555;
        }
        #clipping-ui-container {
            position: absolute;
            top: 120px;
            right: 10px;
            width: 150px;
            background-color: rgba(50, 50, 50, 0.5);
            padding: 5px;
            border-radius: 3px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #clipping-ui-container label {
            color: #eee;
            font-size: 0.8em;
        }
        #clipping-ui-container input {
            width: 100%;
            background-color: #222;
            color: #eee;
            border: 1px solid #555;
        }
        #ui-container.expanded {
            transform: translateX(0); /* Show the menu */
        }
        .menu-toggle-button {
            position: absolute;
            top: 10px;
            left: 10px; /* Position it on the edge of the viewport */
            z-index: 11; /* Above the menu itself */
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: left 0.3s ease-in-out; /* Transition the left property */
            width: 50px; /* Small fixed size */
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .menu-toggle-button.expanded {
            left: 330px; /* Move it past the expanded menu (width + padding) */
        }

        h2 {
            margin-top: 0;
            color: #87CEEB; /* Sky Blue */
            text-align: center;
            font-size: 1.4em;
        }
        .controls-section {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .controls-section h3 {
            margin: 0 0 5px 0;
            font-size: 1.1em;
            color: #00BFFF; /* Deep Sky Blue */
            border-bottom: 1px dashed #00BFFF;
            padding-bottom: 3px;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            flex-wrap: wrap; /* Allow items to wrap */
        }
        .input-row label {
            flex-shrink: 0;
            width: 80px; /* Fixed width for labels */
            text-align: right;
            font-size: 0.9em;
        }
        .input-row input[type="number"],
        .input-row input[type="range"] {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #555;
            border-radius: 3px;
            background-color: #333;
            color: #eee;
            box-sizing: border-box;
        }
        .input-row input[type="number"] { width: 70px; } /* Specific width for number inputs */
        .input-row input[type="range"] { margin-top: 3px; }

        button {
            background-color: #007acc; /* Blue */
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #005fa3;
        }
        button:active {
            background-color: #004d80;
        }
        #measureResults {
            margin-top: 8px;
            padding: 5px;
            background-color: rgba(50, 50, 50, 0.7);
            border-radius: 3px;
            font-size: 0.85em;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 5px 8px;
        }
        #measureResults span {
            font-weight: bold;
            color: #FFFFE0; /* Light Yellow */
        }
        .slider-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: stretch; /* Stretch input to fill width */
            gap: 5px;
        }
        .slider-container label {
            width: auto; /* Override fixed width */
            text-align: left;
            font-size: 0.9em;
        }
        .slider-container input[type="range"] {
            cursor: pointer;
        }
        .clear-button {
            background-color: #cc0000; /* Red */
            padding: 6px 10px;
            font-size: 0.85em;
        }
        .clear-button:hover {
            background-color: #aa0000;
        }
        .clear-scene-button {
            background-color: #ff8c00; /* Dark Orange */
            margin-top: 10px;
        }
        .clear-scene-button:hover {
            background-color: #cc6600;
        }
        .view-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        .view-controls button {
            background-color: #444;
            padding: 5px 10px;
            font-size: 0.8em;
        }
        .view-controls button:hover {
            background-color: #666;
        }
        /* Style for the download button */
        .download-button {
            background-color: #008080; /* Teal */
            margin-top: 15px;
            padding: 10px 15px;
            font-size: 1em;
        }
        .download-button:hover {
            background-color: #006666;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- UI elements will be generated here by JavaScript -->
    </div>
    <button id="menu-toggle-button" class="menu-toggle-button collapsed">☰</button>
    <div id="nav-cube-container"></div>
    <div id="clipping-ui-container">
        <label for="near-clip">Near Clip:</label>
        <input type="number" id="near-clip" step="0.01">
        <label for="far-clip">Far Clip:</label>
        <input type="number" id="far-clip" step="100">
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.160.0/examples/jsm/exporters/GLTFExporter.js"
            }
        }
    </script>

    <script type="module">
        // --- IMPORT THREE.JS ---
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let arcObjects = []; // Store our created arcs
        let uiContainer;
        let menuToggleButton;
        let currentProgress = 0;
        let animationTimer = null;
        let measureOperationActive = false;
        let selectedObject = null; // For object selection
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let gridHelper; // For the 3D grid
        let isOrthographic = false; // To track the current view mode
        const frustumSizeDefault = 20; // Base size for the orthographic camera
        let canvasElement; // To hold the canvas element for pointer events
        let navScene, navCamera, navRenderer, navCube; // For navigation cube
        let nearClipInput, farClipInput; // For clipping UI

        // --- Doc-Based Math Functions (Translated from Python) ---
        function docCircumference(d) {
            return d * 3;
        }

        // --- ARC CREATION: Tube Mesh Arcs (Simplified, based on Python script) ---
        function createArcTubeMesh(name, x, y, z, resolution, deviation, tubeRadius = 0.1, crossSeg = 8) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const indices = [];

            // Create vertices ring by ring
            for (let i = 0; i <= resolution; i++) {
                const t = i / resolution;
                const px = t * x;
                const py = t * y + Math.sin(3 * t) * deviation;
                const pz = t * z;
                const center = new THREE.Vector3(px, py, pz);

                for (let c = 0; c < crossSeg; c++) {
                    // Use doc-based theta: 2.0 * 3 * (c/cross_seg)
                    const theta = 2.0 * 3 * (c / crossSeg);
                    const localX = tubeRadius * Math.sin(theta);
                    const localZ = tubeRadius * Math.cos(theta);
                    vertices.push(center.x + localX, center.y, center.z + localZ);
                }
            }

            // Create faces by connecting rings
            for (let i = 0; i < resolution; i++) {
                const ringA_start_idx = i * crossSeg;
                const ringB_start_idx = (i + 1) * crossSeg;

                for (let c = 0; c < crossSeg; c++) {
                    const c_next = (c + 1) % crossSeg;
                    const v1 = ringA_start_idx + c;
                    const v2 = ringA_start_idx + c_next;
                    const v3 = ringB_start_idx + c_next;
                    const v4 = ringB_start_idx + c;

                    indices.push(v1, v2, v3);
                    indices.push(v1, v3, v4);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(indices), 1));
            geometry.computeVertexNormals(); // Let Three.js compute normals for shading

            const material = new THREE.MeshStandardMaterial({
                color: 0x87CEEB,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = name;

            const arcParams = {
                x: x, y: y, z: z,
                resolution: resolution,
                deviation: deviation,
                radius: tubeRadius
            };
            mesh.userData["arc_params"] = JSON.stringify(arcParams);
            arcObjects.push(mesh);

            return mesh;
        }

        // --- MEASUREMENT FUNCTIONS ---
        function measureAnyObject(obj, progressCallback) {
            if (!obj || !obj.isMesh || !obj.userData["arc_params"]) {
                if (progressCallback) progressCallback(100);
                return 0.0;
            }

            try {
                const params = JSON.parse(obj.userData["arc_params"]);
                const resolution = params.resolution;
                const crossSeg = 8; // As per the python script
                const vertices = obj.geometry.getAttribute('position').array;

                const neededVerts = (resolution + 1) * crossSeg;
                if (vertices.length / 3 < neededVerts) {
                    console.error("Not enough vertices to measure arc.");
                    if (progressCallback) progressCallback(100);
                    return 0.0;
                }

                const ringCenters = [];
                for (let i = 0; i <= resolution; i++) {
                    const sum = new THREE.Vector3(0, 0, 0);
                    for (let c = 0; c < crossSeg; c++) {
                        const vertIndex = (i * crossSeg + c) * 3;
                        sum.x += vertices[vertIndex];
                        sum.y += vertices[vertIndex + 1];
                        sum.z += vertices[vertIndex + 2];
                    }
                    ringCenters.push(sum.divideScalar(crossSeg));
                    if (progressCallback) {
                        // Update progress during this loop
                        progressCallback(((i + 1) / (resolution + 1)) * 50);
                    }
                }

                let totalLength = 0;
                for (let i = 0; i < ringCenters.length - 1; i++) {
                    totalLength += ringCenters[i].distanceTo(ringCenters[i+1]);
                    if (progressCallback) {
                        // Update progress during the second loop
                        progressCallback(50 + ((i + 1) / (ringCenters.length - 1)) * 50);
                    }
                }

                return totalLength;

            } catch (e) {
                console.error("Error measuring arc:", e);
                if (progressCallback) progressCallback(100);
                return 0.0;
            }
        }

        function getBoundingSphereDiameter(obj) {
            if (!obj || !obj.geometry) return 0;
            obj.geometry.computeBoundingSphere();
            if (obj.geometry.boundingSphere) {
                return obj.geometry.boundingSphere.radius * 2;
            }
            return 0;
        }

        // --- UI GENERATION ---
        function generateUI() {
            uiContainer = document.getElementById('ui-container');
            uiContainer.innerHTML = ''; // Clear previous content

            menuToggleButton = document.getElementById('menu-toggle-button');

            // Helper to create input elements
            const createInput = (type, id, label, value, step, min, max) => {
                const div = document.createElement('div');
                div.className = 'input-row';
                div.innerHTML = `
                    <label for="${id}">${label}:</label>
                    <input type="${type}" id="${id}" value="${value}" ${step !== undefined ? `step="${step}"` : ''} ${min !== undefined ? `min="${min}"` : ''} ${max !== undefined ? `max="${max}"` : ''}>
                `;
                return div;
            };

            // Helper to create a controls section
            const createSection = (title, idPrefix, initialValues) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'controls-section';
                sectionDiv.innerHTML = `<h3>${title}</h3>`;

                const posRow = document.createElement('div');
                posRow.className = 'input-row';
                posRow.appendChild(createInput('number', `${idPrefix}_x`, 'X', initialValues.x, 0.1));
                posRow.appendChild(createInput('number', `${idPrefix}_y`, 'Y', initialValues.y, 0.1));
                posRow.appendChild(createInput('number', `${idPrefix}_z`, 'Z', initialValues.z, 0.1));
                sectionDiv.appendChild(posRow);

                sectionDiv.appendChild(createInput('number', `${idPrefix}_deviation`, 'Deviation', initialValues.deviation, 0.1));
                sectionDiv.appendChild(createInput('number', `${idPrefix}_resolution`, 'Resolution', initialValues.resolution, 1, 2, 256));

                const buttonRow = document.createElement('div');
                buttonRow.style.display = 'flex';
                buttonRow.style.justifyContent = 'space-between';
                buttonRow.style.gap = '5px';

                const createButton = document.createElement('button');
                createButton.textContent = `Create ${title}`;
                createButton.onclick = () => {
                    const x = parseFloat(document.getElementById(`${idPrefix}_x`).value);
                    const y = parseFloat(document.getElementById(`${idPrefix}_y`).value);
                    const z = parseFloat(document.getElementById(`${idPrefix}_z`).value);
                    const deviation = parseFloat(document.getElementById(`${idPrefix}_deviation`).value);
                    const resolution = parseInt(document.getElementById(`${idPrefix}_resolution`).value);

                    const newArc = createArcTubeMesh(`Arc_${idPrefix.split('_')[1]}`, x, y, z, resolution, deviation);
                    scene.add(newArc);
                    console.log(`Created ${newArc.name}`);
                };
                buttonRow.appendChild(createButton);

                const clearButton = document.createElement('button');
                clearButton.textContent = `Clear Arc`;
                clearButton.className = 'clear-button';
                clearButton.onclick = () => {
                    const arcId = idPrefix.split('_')[1]; // e.g., '1' from 'arc1_x'
                    clearArc(`Arc_${arcId}`);
                };
                buttonRow.appendChild(clearButton);

                sectionDiv.appendChild(buttonRow);
                uiContainer.appendChild(sectionDiv);
            };

            // --- Arc Controls ---
            createSection("Arc 1", "arc1", { x: 0, y: 0, z: 0, deviation: 0, resolution: 8 });
            createSection("Arc 2", "arc2", { x: 0, y: 0, z: 0, deviation: 0, resolution: 8 });
            createSection("Arc 3", "arc3", { x: 0, y: 0, z: 0, deviation: 0, resolution: 8 });

            // --- Clear Scene Button ---
            const clearSceneButton = document.createElement('button');
            clearSceneButton.textContent = 'Clear All Arcs';
            clearSceneButton.className = 'clear-scene-button';
            clearSceneButton.onclick = clearScene;
            uiContainer.appendChild(clearSceneButton);

            // --- Export Button ---
            const exportButton = document.createElement('button');
            exportButton.textContent = 'Export to GLB';
            exportButton.className = 'download-button'; // Reuse style from original file
            exportButton.onclick = exportGLB;
            uiContainer.appendChild(exportButton);


            // --- Measure Controls ---
            const measureSection = document.createElement('div');
            measureSection.className = 'controls-section';
            measureSection.innerHTML = `
                <h3>Measure Selected Arc</h3>
                <button id="measureArcButton">Measure Arc</button>
                <div id="measureResults">
                    <div>Raw Arc Length:</div><span id="arcLengthOutput"> 0.0000</span>
                    <div>1/8th Cir | Arc Match:</div><span id="minCircleOutput"> 0.0000</span>
                    <div>Max Circle Diam:</div><span id="maxCircleOutput"> 0.0000</span>
                    <div>Match Report:</div><span id="matchedReportOutput"> -</span>
                </div>
                <div class="slider-container">
                    <label for="loaderProgressSlider">Progress:</label>
                    <input type="range" id="loaderProgressSlider" min="0" max="100" value="0" disabled>
                </div>
            `;
            uiContainer.appendChild(measureSection);

            document.getElementById('measureArcButton').onclick = () => {
                if (selectedObject) {
                    measureAndAnimate(selectedObject);
                } else {
                    alert("Please select an arc object first.");
                }
            };

            // --- Viewport Controls ---
            const viewControlsSection = document.createElement('div');
            viewControlsSection.className = 'controls-section';
            viewControlsSection.innerHTML = `
                <h3>Viewport Controls</h3>
                <div class="view-controls">
                    <button onclick="setView('front')">Front</button>
                    <button onclick="setView('back')">Back</button>
                    <button onclick="setView('top')">Top</button>
                    <button onclick="setView('bottom')">Bottom</button>
                    <button onclick="setView('left')">Left</button>
                    <button onclick="setView('right')">Right</button>
                    <button onclick="resetView()">Reset</button>
                    <button onclick="toggleOrthographic()">Toggle Ortho</button>
                </div>
            `;
            uiContainer.appendChild(viewControlsSection);

        }

        // --- ANIMATION / MODAL OPERATOR REPLACEMENT ---
        function animate() {
            requestAnimationFrame(animate);

            // Update camera aspect ratio on window resize
            const canvas = renderer.domElement;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            if (canvas.width !== width || canvas.height !== height) {
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                // Update orthographic camera aspect ratio if it's active
                if (isOrthographic && camera instanceof THREE.OrthographicCamera) {
                    camera.left = frustumSizeDefault * camera.aspect / -2;
                    camera.right = frustumSizeDefault * camera.aspect / 2;
                    camera.updateProjectionMatrix();
                }
            }

            controls.update();

            // Update progress bar if measurement is active
            if (measureOperationActive) {
                const currentSlider = document.getElementById('loaderProgressSlider');
                if (currentSlider) {
                    currentSlider.value = currentProgress;
                }
            }

            // Render main scene
            renderer.render(scene, camera);

            // Render nav cube
            if (navRenderer) {
                navCamera.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(2);
                navCamera.lookAt(0, 0, 0);
                navRenderer.render(navScene, navCamera);
            }
        }

        function measureAndAnimate(targetObject) {
            if (measureOperationActive) {
                alert("Measurement is already in progress!");
                return;
            }
            measureOperationActive = true;
            currentProgress = 0;
            const progressSlider = document.getElementById('loaderProgressSlider');

            // Define the progress callback
            const progressCallback = (progress) => {
                currentProgress = progress;
                if (progressSlider) {
                    progressSlider.value = currentProgress;
                }
            };

            // Perform the measurement asynchronously to allow the UI to update
            setTimeout(() => {
                const rawLength = measureAnyObject(targetObject, progressCallback);
                const docBasedCirc = docCircumference(rawLength);
                const reportStr = `Arc Length: ${rawLength.toFixed(4)}`;

                // Update UI with final results
                document.getElementById('arcLengthOutput').textContent = rawLength.toFixed(4);
                document.getElementById('minCircleOutput').textContent = docBasedCirc.toFixed(4);
                document.getElementById('maxCircleOutput').textContent = (2 * rawLength).toFixed(4);
                document.getElementById('matchedReportOutput').textContent = reportStr;

                // Ensure progress bar reaches 100%
                progressCallback(100);

                setTimeout(() => {
                    measureOperationActive = false;
                    alert("Measurement complete!");
                }, 200); // Short delay to let user see 100%
            }, 50); // Short delay to allow UI to show 0% before starting
        }

        // --- Object Selection Logic ---
        function onPointerDown(event) {
            // Prevent interaction if the menu is open and the click is within the menu area
            const menuRect = uiContainer.getBoundingClientRect();
            if (uiContainer.classList.contains('expanded') &&
                event.clientX >= menuRect.left && event.clientX <= menuRect.right &&
                event.clientY >= menuRect.top && event.clientY <= menuRect.bottom) {
                return; // Clicked inside the menu, do nothing for selection
            }

            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(arcObjects);

            if (intersects.length > 0) {
                const newSelection = intersects[0].object;
                // If we clicked a new object, deselect the old and select the new
                if (newSelection !== selectedObject) {
                    if (selectedObject) {
                        selectedObject.material.emissive.setHex(0x000000);
                    }
                    selectedObject = newSelection;
                    selectedObject.material.emissive.setHex(0x00ff00);
                }
            } else {
                // If we clicked empty space, deselect the current object
                if (selectedObject) {
                    selectedObject.material.emissive.setHex(0x000000);
                    selectedObject = null;
                }
            }
        }

        // --- Clear Functions ---
        function clearArc(arcName) {
            const objectToRemove = scene.getObjectByName(arcName);
            if (objectToRemove) {
                scene.remove(objectToRemove);
                // Remove from arcObjects array as well
                arcObjects = arcObjects.filter(obj => obj.name !== arcName);
                console.log(`Cleared arc: ${arcName}`);
            }
        }

        function clearScene() {
            while(arcObjects.length > 0) {
                clearArc(arcObjects[0].name);
            }
            // Also clear any other non-arc objects if needed
            scene.traverse(function(node) {
                if (node.name.startsWith("MainSphere") || node.name.startsWith("MedianSphere") || node.name.startsWith("KeySphere_") || node.name.startsWith("SmallSphere_")) {
                    scene.remove(node);
                }
            });
            console.log("Cleared the entire scene.");
        }

        function exportGLB() {
            const exporter = new GLTFExporter();
            const options = {
                binary: true, // Export as GLB
            };

            // We export the main scene
            exporter.parse(
                scene,
                function (result) {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.href = URL.createObjectURL(blob);
                    link.download = 'scene.glb';
                    link.click();
                    document.body.removeChild(link);
                },
                function (error) {
                    console.error('An error happened during GLB export:', error);
                },
                options
            );
        }

        // --- Viewport Control Functions ---
        function setView(direction) {
            const defaultZoom = 15; // Adjust this value as needed for camera distance
            let targetPosition = new THREE.Vector3();
            let upDirection = new THREE.Vector3(0, 1, 0); // Default up direction

            // Keep current target, or reset to origin if no object is targeted
            const currentTarget = controls.target.clone();

            switch (direction) {
                case 'front':
                    targetPosition.set(0, 0, defaultZoom);
                    break;
                case 'back':
                    targetPosition.set(0, 0, -defaultZoom);
                    break;
                case 'top':
                    targetPosition.set(0, defaultZoom, 0);
                    upDirection.set(0, 0, -1); // For top view, Y is up, Z is forward
                    break;
                case 'bottom':
                    targetPosition.set(0, -defaultZoom, 0);
                    upDirection.set(0, 0, 1); // For bottom view, Y is down, Z is backward
                    break;
                case 'right':
                    targetPosition.set(defaultZoom, 0, 0);
                    break;
                case 'left':
                    targetPosition.set(-defaultZoom, 0, 0);
                    break;
            }

            // Update camera position and controls target
            camera.position.copy(targetPosition);
            controls.target.copy(currentTarget); // Use the stored target
            controls.up.copy(upDirection); // Set the new up direction
            controls.update();
        }

        function resetView() {
            camera.position.set(0, 5, 15); // Reset to initial camera position
            controls.target.set(0, 0, 0); // Reset target to center
            controls.up.set(0, 1, 0); // Reset up direction
            controls.update();
        }

        function toggleOrthographic() {
            const currentTarget = controls.target.clone();
            const currentPosition = camera.position.clone();
            const aspect = window.innerWidth / window.innerHeight;

            if (!isOrthographic) {
                // Switch to orthographic
                camera = new THREE.OrthographicCamera(
                    frustumSizeDefault * aspect / -2,
                    frustumSizeDefault * aspect / 2,
                    frustumSizeDefault / 2,
                    frustumSizeDefault / -2,
                    0.01,
                    100000
                );
                camera.position.copy(currentPosition); // Maintain position
                controls.object = camera; // Update controls to use the new camera
                controls.enablePan = true; // Panning is essential for ortho
                controls.enableZoom = true; // Zoom is also useful

                // Re-initialize controls for the new camera type
                // Keep target from previous camera state
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.screenSpacePanning = false;
                controls.maxDistance = 100;
                controls.target.copy(currentTarget); // Set the target

                isOrthographic = true;
                console.log("Switched to Orthographic View");
            } else {
                // Switch back to perspective
                const fov = 35; // The original FOV for perspective

                camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.01, 100000);
                camera.position.copy(currentPosition); // Maintain position
                controls.object = camera; // Update controls to use the new camera
                controls.enablePan = false; // Pan in perspective is handled by OrbitControls differently
                controls.enableZoom = true;

                // Re-initialize controls for the new camera type
                // Keep target from previous camera state
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.screenSpacePanning = false;
                controls.maxDistance = 100;
                controls.target.copy(currentTarget); // Set the target

                isOrthographic = false;
                console.log("Switched to Perspective View");
            }
            controls.update();
        }

        // --- Initialization Function ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222); // Dark background

            // Grid Helper
            gridHelper = new THREE.GridHelper(100, 100); // Size, divisions
            scene.add(gridHelper);

            // Camera
            // Set FOV to 35 degrees as requested
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.01, 100000);
            camera.position.set(0, 5, 15); // Adjusted for better initial view

            // Renderer
            canvasElement = document.createElement('canvas'); // Store canvas element
            const container = document.createElement('div');
            container.id = 'main-canvas-container';
            container.style.position = 'absolute';
            container.style.top = '0px';
            container.style.left = '0px';
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.zIndex = '-1';
            document.body.appendChild(container);
            container.appendChild(canvasElement);

            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls (OrbitControls)
            // OrbitControls will be re-initialized in toggleOrthographic and setView for proper camera handling
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // an animation loop is required when either damping or auto-rotation are enabled
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // prefer this if you want to pan the camera along the screen
            controls.maxDistance = 100;
            controls.target.set(0, 0, 0); // Target the center of the scene

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // Generate UI elements dynamically
            generateUI();

            // Event listener for object selection
            window.addEventListener('pointerdown', onPointerDown);

            // Set up the menu toggle button
            menuToggleButton = document.getElementById('menu-toggle-button');
            if (menuToggleButton) {
                menuToggleButton.onclick = toggleMenu;
            }

            // --- Clipping Plane UI ---
            nearClipInput = document.getElementById('near-clip');
            farClipInput = document.getElementById('far-clip');
            nearClipInput.value = camera.near;
            farClipInput.value = camera.far;

            nearClipInput.addEventListener('change', () => {
                camera.near = parseFloat(nearClipInput.value);
                camera.updateProjectionMatrix();
            });
            farClipInput.addEventListener('change', () => {
                camera.far = parseFloat(farClipInput.value);
                camera.updateProjectionMatrix();
            });


            // Start animation loop
            initNavCube();
            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                const canvas = renderer.domElement;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                if (canvas.width !== width || canvas.height !== height) {
                    renderer.setSize(width, height, false);
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    // Update orthographic camera aspect ratio if it's active
                    if (isOrthographic && camera instanceof THREE.OrthographicCamera) {
                        camera.left = frustumSizeDefault * camera.aspect / -2;
                        camera.right = frustumSizeDefault * camera.aspect / 2;
                        camera.updateProjectionMatrix();
                    }
                }
            });

        }

        function createFaceMaterial(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');

            context.fillStyle = 'rgba(50, 50, 70, 0.8)';
            context.fillRect(0, 0, 128, 128);

            context.fillStyle = 'white';
            context.font = 'bold 24px sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshBasicMaterial({ map: texture });
        }

        function initNavCube() {
            const container = document.getElementById('nav-cube-container');
            navRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            navRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(navRenderer.domElement);

            navScene = new THREE.Scene();
            navCamera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            navCamera.position.z = 2;

            const navLight = new THREE.AmbientLight(0xffffff, 1.5);
            navScene.add(navLight);
            const navDirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            navDirLight.position.set(1, 1, 1);
            navScene.add(navDirLight);

            const faceMaterials = [
                createFaceMaterial('RIGHT'),  // +X
                createFaceMaterial('LEFT'),   // -X
                createFaceMaterial('TOP'),    // +Y
                createFaceMaterial('BOTTOM'), // -Y
                createFaceMaterial('FRONT'),  // +Z
                createFaceMaterial('BACK')    // -Z
            ];

            navCube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), faceMaterials);
            navCube.name = "NavCube";
            navScene.add(navCube);

            // Add click listener
            navRenderer.domElement.addEventListener('pointerdown', onNavCubeClick);
        }

        function onNavCubeClick(event) {
            const rect = navRenderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, navCamera);
            const intersects = raycaster.intersectObject(navCube);

            if (intersects.length > 0) {
                const faceIndex = intersects[0].face.materialIndex;
                switch (faceIndex) {
                    case 0: setView('right'); break;
                    case 1: setView('left'); break;
                    case 2: setView('top'); break;
                    case 3: setView('bottom'); break;
                    case 4: setView('front'); break;
                    case 5: setView('back'); break;
                }
            }
        }

        // --- Menu Toggle Functionality ---
        function toggleMenu() {
            const isExpanded = uiContainer.classList.toggle('expanded');
            menuToggleButton.classList.toggle('expanded');

            if (isExpanded) {
                menuToggleButton.textContent = '✖'; // Close icon
                if (canvasElement) canvasElement.style.pointerEvents = 'none';
                gridHelper.visible = false;
            } else {
                menuToggleButton.textContent = '☰'; // Hamburger icon
                if (canvasElement) canvasElement.style.pointerEvents = 'auto';
                gridHelper.visible = true;
            }
        }


        // --- GLOBAL FUNCTIONS FOR UI BUTTONS ---
        // Make sure these functions are accessible globally for button onclick handlers
        // This is necessary because the button onclick handlers are defined in HTML strings.
        window.clearArc = clearArc;
        window.clearScene = clearScene;
        window.setView = setView;
        window.resetView = resetView;
        window.toggleOrthographic = toggleOrthographic;

        // --- INITIALIZE THE APPLICATION ---
        init();

    </script>
</body>
</html>
