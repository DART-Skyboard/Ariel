<script>
// --- Embedded FFT Library ---
const fft = (function() {
    function FFT(size) {
        this.size = size | 0;
        if (this.size <= 1 || (this.size & (this.size - 1)) !== 0) {
            let pow = 1;
            while (pow < size) {
                pow <<= 1;
            }
            this.size = pow;
        }
        this._c = new Array(this.size * 2);
        this._cr = new Array(this.size);
        this._ci = new Array(this.size);
        this._twiddle = new Array(this.size * 2);
        for (let i = 0; i < this.size; i++) {
            let angle = -Math.PI * 2 * i / this.size;
            this._twiddle[i * 2] = Math.cos(angle);
            this._twiddle[i * 2 + 1] = Math.sin(angle);
        }
        this._bitrev = new Array(this.size);
        for (let j = 0; j < this.size; j++) {
            this._bitrev[j] = 0;
            let rev = j;
            let m = this.size >> 1;
            while(m >= 1) {
                if(rev % 2) {
                    this._bitrev[j] += m;
                }
                rev >>= 1;
                m >>= 1;
            }
        }
    }
    FFT.prototype.forward = function(input) {
        for (let i = 0; i < this.size; i++) {
            this._c[i * 2] = input[i] || 0;
            this._c[i * 2 + 1] = 0;
        }
        for (let i = 0; i < this.size; i++) {
            let j = this._bitrev[i];
            if (i < j) {
                let tempR = this._c[i * 2];
                let tempI = this._c[i * 2 + 1];
                this._c[i * 2] = this._c[j * 2];
                this._c[i * 2 + 1] = this._c[j * 2 + 1];
                this._c[j * 2] = tempR;
                this._c[j * 2 + 1] = tempI;
            }
        }
        for (let size = 2; size <= this.size; size *= 2) {
            let halfsize = size / 2;
            let tablestep = this.size / size;
            for (let i = 0; i < this.size; i += size) {
                for (let j = i, k = 0; j < i + halfsize; j++, k += tablestep) {
                    let tpre = this._c[(j + halfsize) * 2];
                    let tpi = this._c[(j + halfsize) * 2 + 1];
                    let twr = this._twiddle[k * 2];
                    let twi = this._twiddle[k * 2 + 1];
                    let zre = twr * tpre - twi * tpi;
                    let zim = twr * tpi + twi * tpre;
                    this._c[(j + halfsize) * 2] = this._c[j * 2] - zre;
                    this._c[(j + halfsize) * 2 + 1] = this._c[j * 2 + 1] - zim;
                    this._c[j * 2] += zre;
                    this._c[j * 2 + 1] += zim;
                }
            }
        }
        for (let i = 0; i < this.size; i++) {
            this._cr[i] = this._c[i * 2];
            this._ci[i] = this._c[i * 2 + 1];
        }
        let magnitudes = new Float32Array(this.size / 2);
        let maxMag = 0;
        for (let i = 0; i < this.size / 2; i++) {
            let mag = Math.sqrt(this._cr[i] * this._cr[i] + this._ci[i] * this._ci[i]);
            magnitudes[i] = mag;
            if (mag > maxMag) maxMag = mag;
        }
        if (maxMag > 0) {
            for (let i = 0; i < this.size / 2; i++) {
                magnitudes[i] /= maxMag;
            }
        }
        return magnitudes;
    };
    function nextPow2(n) {
        if (n <= 0) return 1;
        let pow = 1;
        while (pow < n) {
            pow <<= 1;
        }
        return pow;
    }
    return function(timeData) {
        const size = nextPow2(timeData.length);
        const fftInstance = new FFT(size);
        const magnitudes = fftInstance.forward(timeData);
        return {
            magnitudes: magnitudes,
            fftSize: size,
            binCount: size / 2
        };
    };
})();
// --- End of FFT Library ---


// --- Global State ---
const ui = {
    arcEdgeOverlay: document.getElementById('arcedge-graph-overlay'),
    arcEdgeContent: document.getElementById('arcedge-graph-content'),
    arcEdgeViewportContainer: document.getElementById('arcedge-graph-viewport-container'),

    arcEdgeReadout: document.getElementById('arcedge-readout'),

    audioPlayer: document.getElementById('audio-player'),
    audioPlayBtn: document.getElementById('audio-play-btn'),
    audioPauseBtn: document.getElementById('audio-pause-btn'),
    audioStopBtn: document.getElementById('audio-stop-btn'),
    audioGenerateBtn: document.getElementById('audio-generate-btn'),
    arcEdgeInputs: {
        scaleX: document.getElementById('arc-scale-x'),
        scaleY: document.getElementById('arc-scale-y'),
        scaleZ: document.getElementById('arc-scale-z'),
        spiralFactor: document.getElementById('arc-spiral-factor'),
        resolution: document.getElementById('arc-resolution')
    },
    viewportBgToggle: document.getElementById('viewport-bg-toggle'),
    viewportAlphaGroup: document.getElementById('viewport-alpha-group'),
    viewportAlpha: document.getElementById('viewport-alpha'),
    
    arcEdgeMeasureBtn: document.getElementById('arcedge-measure-btn'),
    freezeSelection: document.getElementById('freeze-selection-chk'),
    arcEdgeClearSceneBtn: document.getElementById('arcedge-clear-scene-btn'),
    timeCanvas: document.getElementById('time-canvas'),
    timeCanvasWrapper: document.getElementById('time-canvas-wrapper'),
    timePlayhead: document.getElementById('time-playhead'),
    timeReadout: document.getElementById('time-readout'),
    freqCanvas: document.getElementById('freq-canvas'),
    freqCanvasWrapper: document.getElementById('freq-canvas-wrapper'),
    freqPlayhead: document.getElementById('freq-playhead'),
    freqReadout: document.getElementById('freq-readout'),
    promptOutput: document.getElementById('prompt-output-container')
};

// --- Audio API State ---
let audioContext;
let loadedBuffer = null;
let loadedFileName = "None";
let audioAnalysisData = {
    time: null,
    freq: null,
    maxFrequency: 22050
};
let playbackOffset = 0;
let isAudioPlaying = false;
let currentActivePlayer = null;

// --- Three.js State ---
let arcEdgeScene, arcEdgeCamera, arcEdgeRenderer, arcEdgeControls, arcEdgeRaycaster, arcEdgePointer;
let arcMeshes = [];
let selectedArc = null;
let isSelectionFrozen = false;
let isArcEdgeInitialized = false;
let playheadIndicator = null;
let timeCurveObject = null;

const timeMaterial = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x005566, metalness: 0.5, roughness: 0.5 });
const freqMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x666600, metalness: 0.5, roughness: 0.5 });
const selectedMaterial = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xaa00aa, metalness: 0.6, roughness: 0.4, wireframe: true });

// --- Draggability for Overlay ---
makeDraggable(ui.arcEdgeOverlay, ui.arcEdgeOverlay);
ui.arcEdgeContent.addEventListener('mousedown', (e) => e.stopPropagation());
ui.arcEdgeContent.addEventListener('touchstart', (e) => e.stopPropagation());

// --- Initial Setup ---
window.onload = () => {
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioAnalysisData.maxFrequency = audioContext.sampleRate / 2;
    } catch (e) {
        console.error('Web Audio API is not supported in this browser.', e);
        addPrompt("<strong>Error:</strong> Web Audio API is not supported in this browser.");
        return;
    }
    initArcEdgeGraph();
    setupEventListeners();
};

function setupEventListeners() {
    ui.fileUpload.addEventListener('change', handleFileUpload);
    
    // BUG FIX: Reset input value on click to allow re-uploading the same file
    ui.fileUpload.addEventListener('click', (e) => {
        e.target.value = null;
    });
    
    ui.audioPlayBtn.addEventListener('click', () => playAudio(playbackOffset));
    ui.audioPauseBtn.addEventListener('click', pauseAudio);
    ui.audioStopBtn.addEventListener('click', stopAudio);
    
    ui.videoPlayer.addEventListener('ended', stopAudio);
    ui.audioPlayer.addEventListener('ended', stopAudio);
    
    ui.audioGenerateBtn.addEventListener('click', generate3DAudioCurves);
    ui.arcEdgeMeasureBtn.addEventListener('click', measureSelectedArc);
    ui.arcEdgeClearSceneBtn.addEventListener('click', clearArcEdgeScene);
    window.addEventListener('resize', onArcEdgeResize);
    ui.arcEdgeViewport.addEventListener('pointerdown', onArcEdgePointerDown);
    
    ui.freezeSelection.addEventListener('change', (e) => { 
        isSelectionFrozen = e.target.checked; 
    });
    
    ui.viewportBgToggle.addEventListener('change', handleViewportBgToggle);
    ui.viewportAlpha.addEventListener('input', handleViewportBgToggle);

    
    Object.values(ui.arcEdgeInputs).forEach(input => input.addEventListener('input', updateArcEdgeReadout));
    
    setupCanvasMouseListeners(ui.timeCanvas, ui.timePlayhead, ui.timeReadout, updateTimeReadout, true);
    setupCanvasMouseListeners(ui.freqCanvas, ui.freqPlayhead, ui.freqReadout, updateFreqReadout, false);
}

// --- Audio Handling ---

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    loadedFileName = file.name;
    
    ui.audioPlayBtn.textContent = "Loading...";
    ui.audioGenerateBtn.textContent = "Analyzing...";
    ui.audioGenerateBtn.disabled = true;
    ui.audioPlayBtn.disabled = true;
    ui.audioPauseBtn.disabled = true;
    ui.audioStopBtn.disabled = true;
    
    stopAudio(); 
    
    const fileURL = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
        ui.videoPlayer.src = fileURL;
        ui.videoPlayer.style.display = 'block';
        ui.audioPlayer.src = '';
        currentActivePlayer = ui.videoPlayer;
    } else if (file.type.startsWith('audio/')) {
        ui.audioPlayer.src = fileURL;
        ui.videoPlayer.src = '';
        ui.videoPlayer.style.display = 'none';
        currentActivePlayer = ui.audioPlayer;
    } else {
        addPrompt("Error: Unsupported file type. Please use MP3, MP4, WebM, or Ogg.");
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        audioContext.decodeAudioData(e.target.result, (buffer) => {
            loadedBuffer = buffer;
            audioAnalysisData.maxFrequency = buffer.sampleRate / 2;
            
            updateArcEdgeReadout();
            
            try {
                addPrompt("Analyzing audio, please wait...");
                analyzeAndDrawAll(buffer);
                addPrompt("Analysis complete.");
            } catch (err) {
                console.error("Analysis failed:", err);
                addPrompt("Error: File analysis failed. The file may be too large or corrupted.");
                ui.audioPlayBtn.textContent = "Play";
                ui.audioGenerateBtn.textContent = "Generate 3D Curves";
                loadedFileName = "None";
                updateAudioButtons();
                return;
            }
            
            ui.audioPlayBtn.textContent = "Play";
            ui.audioGenerateBtn.textContent = "Generate 3D Curves";
            updateAudioButtons();
            
        }, (error) => {
            console.error('Error decoding audio data:', error);
            addPrompt('Error: Could not decode audio file.');
            ui.audioPlayBtn.textContent = "Play";
            ui.audioGenerateBtn.textContent = "Generate 3D Curves";
            loadedFileName = "None";
            updateAudioButtons();
        });
    };
    reader.readAsArrayBuffer(file);
}

// --- 3D Generation ---

function clear3DMeshes() {
    arcMeshes.forEach(mesh => {
        arcEdgeScene.remove(mesh);
        if (mesh.geometry) mesh.geometry.dispose();
        if (mesh.material) mesh.material.dispose();
    });
    arcMeshes = [];
    selectedArc = null;
    timeCurveObject = null;
    if (playheadIndicator) playheadIndicator.visible = false;
    
    ui.freezeSelection.checked = false;
    isSelectionFrozen = false;
}

function generate3DAudioCurves() {
    if (!loadedBuffer) {
        addPrompt("Error: Please load a file first.");
        return;
    }
    if (!audioAnalysisData.time || !audioAnalysisData.freq) {
        addPrompt("Error: Audio data not analyzed. Please re-load file.");
        return;
    }

    clear3DMeshes(); 
    
    const params = getUIParams();
    
    const timePoints = generatePoints(audioAnalysisData.time, params, 'time');
    const timeMesh = create3DTube(timePoints, 'time', timeMaterial, params);
    if (timeMesh) {
        timeCurveObject = timeMesh;
        if(playheadIndicator) playheadIndicator.visible = true;
        updatePlayheadPosition(0);
    }
    
    const freqPoints = generatePoints(audioAnalysisData.freq, params, 'frequency');
    create3DTube(freqPoints, 'frequency', freqMaterial, params);
    
    addPrompt("Generated 3D curves for: " + loadedFileName);
}

function getUIParams() {
    return {
        scaleX: parseFloat(ui.arcEdgeInputs.scaleX.value) || 5,
        scaleY: parseFloat(ui.arcEdgeInputs.scaleY.value) || 5,
        scaleZ: parseFloat(ui.arcEdgeInputs.scaleZ.value) || 30,
        spiralFactor: parseFloat(ui.arcEdgeInputs.spiralFactor.value) || 10,
        resolution: parseInt(ui.arcEdgeInputs.resolution.value) || 2048
    };
}

function generatePoints(audioData, params, type) {
    const points = [];
    const baseRadius = 5;
    const dataLength = audioData.length;
    const step = (dataLength - 1) / params.resolution; 

    for (let i = 0; i <= params.resolution; i++) {
        const dataIndex = Math.min(Math.floor(i * step), dataLength - 1);
        const sampleValue = audioData[dataIndex];
        
        const percent = i / params.resolution;
        const t = percent * Math.PI * 2 * params.spiralFactor;
        const z = percent * params.scaleZ;
        let x, y;
        
        if (type === 'time') {
            const radius = baseRadius + (sampleValue * params.scaleX);
            x = Math.cos(t) * radius;
            y = Math.sin(t) * radius;
        } else { // frequency
            const radius = baseRadius + (sampleValue * params.scaleX);
            x = Math.cos(t) * radius;
            y = Math.sin(t) * baseRadius + (sampleValue * params.scaleY);
        }
        points.push(new THREE.Vector3(x, y, z));
    }
    
    const boundingBox = new THREE.Box3().setFromPoints(points);
    const center = new THREE.Vector3();
    boundingBox.getCenter(center);
    const size = new THREE.Vector3();
    boundingBox.getSize(size);
    
    const maxDim = Math.max(size.x, size.y, size.z);
    const desiredSize = 40; 
    const scale = maxDim > 0 ? desiredSize / maxDim : 1;
    const zSize = boundingBox.max.z - boundingBox.min.z;
    const zScale = zSize > 0 ? params.scaleZ / zSize : 1;

    const scaledPoints = points.map(p => {
        return new THREE.Vector3(
            (p.x - center.x) * scale,
            (p.y - center.y) * scale,
            (p.z - boundingBox.min.z) * zScale - (params.scaleZ / 2)
        );
    });
    return scaledPoints;
}


function create3DTube(points, name, material, params) {
    try {
        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeometry = new THREE.TubeGeometry(curve, points.length, 0.1, 8, false);
        
        const arcMesh = new THREE.Mesh(tubeGeometry, material.clone());
        arcMesh.name = `${name}_curve`;
        arcMesh.userData.points = points;
        arcMesh.userData.type = name;
        arcMesh.userData.id = arcMeshes.length + 1;
        arcMesh.userData.params = params;
        arcMeshes.push(arcMesh);
        arcEdgeScene.add(arcMesh);
        
        return arcMesh;
    } catch (error) {
        console.error("Error creating tube geometry:", error);
        return null;
    }
}

// --- 2D Canvas Drawing ---

function analyzeAndDrawAll(buffer) {
    const timeData = buffer.getChannelData(0);
    audioAnalysisData.time = timeData;
    
    console.log("Running FFT on audio data...");
    const fftResult = fft(timeData);
    audioAnalysisData.freq = fftResult.magnitudes;
    console.log(`FFT complete. ${fftResult.binCount} frequency bins created.`);

    draw2DTimeCanvas(buffer, audioAnalysisData.time);
    draw2DFreqCanvas(buffer, audioAnalysisData.freq);
}

function draw2DTimeCanvas(buffer, data) {
    const canvas = ui.timeCanvas;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const halfHeight = height / 2;
    const dataLength = data.length;
    
    ctx.fillStyle = '#2a2a2e';
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    
    for (let i = 0; i < width; i++) {
        const percent = i / (width - 1);
        const dataIndex = Math.min(Math.floor(percent * (dataLength - 1)), dataLength - 1);
        const y = (data[dataIndex] * halfHeight) + halfHeight;
        if (i === 0) ctx.moveTo(i, y);
        else ctx.lineTo(i, y);
    }
    ctx.stroke();
    drawTimeScale(ctx, width, height, buffer.duration);
}

function drawTimeScale(ctx, width, height, duration) {
    ctx.fillStyle = '#aaa';
    ctx.font = '10px Consolas';
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 0.5;

    const maxTicks = 6;
    let tickIntervalSec = 1;
    const intervals = [1, 2, 5, 10, 15, 20, 30, 60, 120, 300];
    for (let interval of intervals) {
        if (duration / interval <= maxTicks) {
            tickIntervalSec = interval;
            break;
        }
    }
    if (duration / tickIntervalSec > maxTicks * 1.5) {
         tickIntervalSec = intervals[intervals.indexOf(tickIntervalSec) + 1] || tickIntervalSec * 2;
    }

    for (let time = 0; time <= duration; time += tickIntervalSec) {
        const x = (time / duration) * width;
        const label = `${time.toFixed(0)}s`;
        ctx.beginPath();
        ctx.moveTo(x, height - 10);
        ctx.lineTo(x, height);
        ctx.stroke();
        ctx.fillText(label, x + 2, height - 12);
    }
}

function draw2DFreqCanvas(buffer, freqData) {
    const canvas = ui.freqCanvas;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const dataLength = freqData.length;
    
    ctx.fillStyle = '#2a2a2e';
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 1;
    ctx.beginPath();
    
    for (let i = 0; i < width; i++) {
        const percent = i / (width - 1);
        const dataIndex = Math.min(Math.floor(percent * (dataLength - 1)), dataLength - 1);
        const y = height - (freqData[dataIndex] * height);
        if (i === 0) ctx.moveTo(i, y);
        else ctx.lineTo(i, y);
    }
    ctx.stroke();
    drawFreqScale(ctx, width, height, audioAnalysisData.maxFrequency);
}

function drawFreqScale(ctx, width, height, maxFrequency) {
    ctx.fillStyle = '#aaa';
    ctx.font = '10px Consolas';
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 0.5;
    
    const ticks = [1000, 2000, 5000, 10000, 15000, 20000];
    
    for (const freq of ticks) {
        if (freq > maxFrequency) break;
        const x = (freq / maxFrequency) * width;
        const label = `${Math.floor(freq / 1000)}k`;
        ctx.beginPath();
        ctx.moveTo(x, height - 10);
        ctx.lineTo(x, height);
        ctx.stroke();
        ctx.fillText(label, x + 2, height - 12);
    }
}


// --- 2D Canvas Interaction ---

function setupCanvasMouseListeners(canvas, playhead, readout, updateFunction, isTimeControl = false) {
    let isDragging = false;

    const handlePointerMove2D = (e) => {
        if (!loadedBuffer) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        
        playhead.style.display = 'block';
        readout.style.display = 'block';
        
        if (isTimeControl) {
            playhead.style.left = `${x}px`;
        } else {
            playhead.style.display = 'none';
        }
        
        updateFunction(x, canvas.width, readout);
        
        if (x < canvas.width / 2) {
            readout.style.left = `${x + 5}px`;
            readout.style.right = 'auto';
        } else {
            readout.style.left = 'auto';
            readout.style.right = `${canvas.width - x + 5}px`;
        }
    };
    
    const handlePointerLeave = () => {
         readout.style.display = 'none';
         if(isTimeControl) {
             playhead.style.display = 'none';
         }
    };

    const handlePointerDown = (e) => {
        if (!loadedBuffer) return;
        isDragging = true;
        canvas.setPointerCapture(e.pointerId);
        
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const percent = x / (canvas.width - 1);
        
        if (isTimeControl) {
            updatePlayheadPosition(percent);
        }
        
        handlePointerMove2D(e);
    };

    const handlePointerDrag = (e) => {
        if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const percent = x / (canvas.width - 1);

            if (isTimeControl) {
                updatePlayheadPosition(percent);
            }
            
            handlePointerMove2D(e);
        }
    };
    
    const stopDragging = (e) => {
        if (isDragging) {
            isDragging = false;
            canvas.releasePointerCapture(e.pointerId);
            
            if (isTimeControl) {
                const rect = canvas.getBoundingClientRect();
                const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                const percent = x / (canvas.width - 1);
                const timeInSeconds = percent * loadedBuffer.duration;
                
                updatePlayheadPosition(percent);
                playAudio(timeInSeconds);
            }
        }
    };
    
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerDrag);
    canvas.addEventListener('pointerup', stopDragging);
    canvas.addEventListener('pointerleave', (e) => {
        if (isDragging) {
            isDragging = false;
            canvas.releasePointerCapture(e.pointerId);
        }
        handlePointerLeave();
    });
    canvas.addEventListener('pointerout', handlePointerLeave);
}

function updateTimeReadout(x, canvasWidth, readoutElement) {
    if (!audioAnalysisData.time || !loadedBuffer) return;
    const percent = x / (canvasWidth - 1);
    const data = audioAnalysisData.time;
    const sampleIndex = Math.min(Math.floor(percent * (data.length - 1)), data.length - 1);
    const timeInSeconds = (percent * loadedBuffer.duration);
    const amplitude = data[sampleIndex];
    readoutElement.textContent = `Time: ${timeInSeconds.toFixed(2)}s | Amp: ${amplitude.toFixed(3)}`;
}

function updateFreqReadout(x, canvasWidth, readoutElement) {
    if (!audioAnalysisData.freq) return;
    const percent = x / (canvasWidth - 1);
    const data = audioAnalysisData.freq;
    const freqInHz = percent * audioAnalysisData.maxFrequency;
    const dataIndex = Math.min(Math.floor(percent * (data.length - 1)), data.length - 1);
    const magnitude = data[dataIndex];
    readoutElement.textContent = `Freq: ${freqInHz.toFixed(0)} Hz | Mag: ${magnitude.toFixed(3)}`;
}

function handleViewportBgToggle() {

}

function initArcEdgeGraph() {
    if (isArcEdgeInitialized) return;
    try {
        const container = ui.arcEdgeViewport;
        const width = container.clientWidth;
        const height = container.clientHeight;
        arcEdgeScene = new THREE.Scene();
        arcEdgeCamera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        arcEdgeCamera.position.set(5, 5, 15);
        arcEdgeCamera.lookAt(0, 0, 0);
        arcEdgeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        arcEdgeRenderer.setClearColor(0x000000, 0); 
        arcEdgeRenderer.setSize(width, height);
        container.appendChild(arcEdgeRenderer.domElement);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        arcEdgeScene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        arcEdgeScene.add(directionalLight);
        arcEdgeControls = new THREE.OrbitControls(arcEdgeCamera, arcEdgeRenderer.domElement);
        arcEdgeControls.enableDamping = true;
        arcEdgeControls.dampingFactor = 0.05;
        arcEdgeRaycaster = new THREE.Raycaster();
        arcEdgePointer = new THREE.Vector2();
        const axesHelper = new THREE.AxesHelper(5);
        arcEdgeScene.add(axesHelper);
        const gridHelper = new THREE.GridHelper(30, 30, 0xcccccc, 0x888888);
        arcEdgeScene.add(gridHelper);
        
        const geometry = new THREE.SphereGeometry(1.5, 32, 16); 
        const material = new THREE.MeshStandardMaterial({
            color: 0xff00ff,
            emissive: 0xff00ff,
            emissiveIntensity: 1.0,
            metalness: 0.1,
            roughness: 0.5,
            transparent: true,
            opacity: 0.3
        });
        playheadIndicator = new THREE.Mesh(geometry, material);
        playheadIndicator.visible = false;
        arcEdgeScene.add(playheadIndicator);
        
        isArcEdgeInitialized = true;
        animateArcEdgeGraph();
        updateArcEdgeReadout();
    } catch (error) {
        console.error("Error initializing Arc Edge Graph:", error);
    }
}

function animateArcEdgeGraph() {
    if (!isArcEdgeInitialized) return;
    requestAnimationFrame(animateArcEdgeGraph);
    arcEdgeControls.update();
    
    const pulseTime = Date.now() * 0.01;
    const pulseFactor = (Math.sin(pulseTime) + 1) / 2; // 0 to 1
    
    if (playheadIndicator && playheadIndicator.visible) {
        const scale = 1.0 + 0.5 * pulseFactor; // 1.0 to 1.5
        playheadIndicator.scale.set(scale, scale, scale);
        playheadIndicator.material.opacity = 0.2 + 0.3 * pulseFactor; // 0.2 to 0.5
        playheadIndicator.material.emissiveIntensity = 1.0 + (pulseFactor * 0.5); // 1.0 to 1.5
    }

    if (timeCurveObject) {
        if (isAudioPlaying) {
            timeCurveObject.material.emissiveIntensity = 0.5 + pulseFactor * 0.3; // 0.5 to 0.8
        } else {
            timeCurveObject.material.emissiveIntensity = 0.5;
        }
    }

    if (isAudioPlaying && loadedBuffer && timeCurveObject && currentActivePlayer) {
        const currentBufferTime = currentActivePlayer.currentTime;
        const duration = loadedBuffer.duration;
        
        let progressPercent = (currentBufferTime / duration);

        if (progressPercent >= 1.0) {
            progressPercent = 1.0;
        }
        
        updatePlayheadPosition(progressPercent);
    }
    
    arcEdgeRenderer.render(arcEdgeScene, arcEdgeCamera);
}

// Helper function to update all playheads
function updatePlayheadPosition(percent) {
    if (!loadedBuffer) return;
    
    const p = Math.max(0, Math.min(1, percent));
    
    // 1. Update 3D Playhead
    if (playheadIndicator && timeCurveObject) {
        try {
            const curve = timeCurveObject.geometry.parameters.path;
            if (curve && curve.getPointAt) {
                const newPos = curve.getPointAt(p);
                playheadIndicator.position.copy(newPos);
                playheadIndicator.visible = true;
            }
        } catch (e) {
            console.error("Error updating 3D playhead position:", e);
        }
    }
    
    // 2. Update 2D Playheads
    const canvasWidth = ui.timeCanvas.width;
    const xPos = p * (canvasWidth - 1);
    
    ui.timePlayhead.style.left = `${xPos}px`;
    ui.timePlayhead.style.display = 'block';
}


function onArcEdgeResize() {
    if (!isArcEdgeInitialized) return;
    const container = ui.arcEdgeViewport;
    const width = container.clientWidth;
    const height = container.clientHeight;
    arcEdgeCamera.aspect = width / height;

// --- Selection & Measurement ---

function onArcEdgePointerDown(event) {
    if (isSelectionFrozen) return;

    if (event.target !== ui.arcEdgeViewport && !event.target.closest('#arcedge-viewport')) {
         return; 
    }
    
    const bounds = ui.arcEdgeViewport.getBoundingClientRect();
    arcEdgePointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
    arcEdgePointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
    arcEdgeRaycaster.setFromCamera(arcEdgePointer, arcEdgeCamera);
    const intersects = arcEdgeRaycaster.intersectObjects(arcMeshes);

    if (selectedArc) {
        selectedArc.material = selectedArc.userData.type === 'time' ? timeMaterial.clone() : freqMaterial.clone();
    }
    selectedArc = null;

    if (intersects.length > 0) {
        selectedArc = intersects[0].object;
        selectedArc.material = selectedMaterial.clone();
    }
    updateArcEdgeReadout();
}

function doc_circumference(diameter) {
    return diameter * 3;
}

function measureSelectedArc() {
    if (!selectedArc) {
        addPrompt("Error: Please select a 3D curve first by clicking on it.");
        return;
    }
    if (!selectedArc.userData || !selectedArc.userData.points || !selectedArc.userData.params) {
         addPrompt("Error: Selected object is missing data for measurement.");
         return;
    }
    
    const points = selectedArc.userData.points;
    let simpleTotalLength = 0;
    for (let i = 0; i < points.length - 1; i++) {
        simpleTotalLength += points[i].distanceTo(points[i + 1]);
    }
    const simpleDocCirc = doc_circumference(simpleTotalLength);
    const curveType = selectedArc.userData.type;

    addPrompt(`--- Measuring ${curveType} Curve (v6 Arc Edge) ---`);
    
    const sourceData = (selectedArc.userData.type === 'time') ? audioAnalysisData.time : audioAnalysisData.freq;
    if (!sourceData) {
        addPrompt("Error: Source audio data not found.");
        return;
    }
    
    const params = selectedArc.userData.params;
    const resolution = params.resolution;
    const dataLength = sourceData.length;
    const step = (dataLength - 1) / resolution;
    let sampledData = [];
    for (let i = 0; i <= resolution; i++) {
        let dataIndex = Math.min(Math.floor(i * step), dataLength - 1);
        sampledData.push(sourceData[dataIndex]);
    }

    let bendIndices = [0];
    for (let i = 1; i < sampledData.length - 1; i++) {
        let p = sampledData[i-1];
        let c = sampledData[i];
        let n = sampledData[i+1];
        if ((c > p && c >= n) || (c < p && c <= n)) {
            bendIndices.push(i);
        }
    }
    bendIndices.push(sampledData.length - 1);
    
    let totalRollerLength = 0;
    let bendReports = [];
    for (let i = 0; i < bendIndices.length - 1; i++) {
        let startIndex = bendIndices[i];
        let endIndex = bendIndices[i+1];
        
        if (startIndex === endIndex) continue; 
        
        let segmentPoints = points.slice(startIndex, endIndex + 1);
        
        let segmentLength = 0;
        for (let k = 0; k < segmentPoints.length - 1; k++) {
            segmentLength += segmentPoints[k].distanceTo(segmentPoints[k+1]);
        }
        
        let matchingCircumference = segmentLength * 8;
        totalRollerLength += matchingCircumference;
        
        bendReports.push({ start: startIndex, end: endIndex, len: segmentLength, circ: matchingCircumference });
    }
    
    addPrompt(`${bendReports.length} bend segments found.`);
    addPrompt(`<code>${curveType}_UNIT_LENGTH = ${simpleTotalLength.toFixed(4)}</code>`);
    addPrompt(`<code>${curveType}_UNIT_CIRC = ${simpleDocCirc.toFixed(4)}</code>`);
    addPrompt(`<code>${curveType}_ARCEDGE_LENGTH_v6 = ${totalRollerLength.toFixed(4)}</code>`);
    addPrompt(`---`);
    
    updateArcEdgeReadout({
        length: simpleTotalLength,
        doc_circ: simpleDocCirc,
        roller_length: totalRollerLength
    });
}

// --- Readout & Utility ---

function addPrompt(text) {
    ui.promptOutput.innerHTML += `<div>${text}</div>`;
    ui.promptOutput.scrollTop = ui.promptOutput.scrollHeight;
}

function updateArcEdgeReadout(measurements = null) {
     let peak = 0;
     let rms = 0;
     if (loadedBuffer) {
         const data = loadedBuffer.getChannelData(0);
         let sumOfSquares = 0;
         for (let i = 0; i < data.length; i++) {
             const val = data[i];
             peak = Math.max(peak, Math.abs(val));
             sumOfSquares += val * val;
         }
         rms = Math.sqrt(sumOfSquares / data.length);
     }
     
     let readoutHTML = `<strong>File:</strong> ${loadedFileName}
<strong>Duration:</strong> ${loadedBuffer ? loadedBuffer.duration.toFixed(2) + 's' : '---'}
<strong>Peak Amp:</strong> ${peak.toFixed(3)}
<strong>RMS:</strong> ${rms.toFixed(3)}
---
<strong>Selected:</strong> ${selectedArc ? selectedArc.name : 'None'}
<strong>Raw Unit Arc Length:</strong> ${measurements ? measurements.length.toFixed(4) : '---'}
<strong>Unit Circumference:</strong> ${measurements ? measurements.doc_circ.toFixed(4) : '---'}
<strong>Arc Edge Length (v6):</strong> ${measurements ? measurements.roller_length.toFixed(4) : '---'}`;

    ui.arcEdgeReadout.innerHTML = readoutHTML;
}

    }
    if (ui.audioPlayer) {
        ui.audioPlayer.src = '';
    }
    currentActivePlayer = null;
    
    clear3DMeshes();

    loadedBuffer = null;
    loadedFileName = "None";
    audioAnalysisData.time = null;
    audioAnalysisData.freq = null;
    
    const canvases = [ui.timeCanvas, ui.freqCanvas];
    canvases.forEach(canvas => {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2a2a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    addPrompt("Scene, players, and data cleared.");
    updateArcEdgeReadout();
    updateAudioButtons();
}

function makeDraggable(element, handle) {
    let isDragging = false;
    let offsetX, offsetY;
    const startDrag = (e) => {
        if (e.target !== handle) {
             if (!handle.contains(e.target) || ui.arcEdgeContent.contains(e.target)) {
                 return;
             }
        }
        
        isDragging = true;
        const rect = element.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches[0].clientX;
        const clientY = e.clientY ?? e.touches[0].clientY;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        element.style.position = 'fixed';
        element.style.transform = 'none'; 
        element.style.margin = '0';
        element.style.left = rect.left + 'px';
        element.style.top = rect.top + 'px';
        handle.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none'; 
        if(e.preventDefault && e.cancelable) e.preventDefault(); 
    };
    const doDrag = (e) => {
        if (!isDragging) return;
        const clientX = e.clientX ?? e.touches[0].clientX;
        const clientY = e.clientY ?? e.touches[0].clientY;
        let newLeft = clientX - offsetX;
        let newTop = clientY - offsetY;
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - element.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - element.offsetHeight));
        element.style.left = newLeft + 'px';
        element.style.top = newTop + 'px';
        if(e.preventDefault && e.cancelable) e.preventDefault(); 
    };
    const stopDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        handle.style.cursor = 'move';
        document.body.style.userSelect = 'auto';
    };
    handle.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', stopDrag);
    handle.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('touchmove', doDrag, { passive: false });
    document.addEventListener('touchend', stopDrag);
}

</script>


<script>
(function() {
    var v = document.getElementById('bg-video');
    if (!v) return;
    function tryPlay() {
        var p = v.play();
        if (p !== undefined) {
            p.catch(function() {
                // Autoplay blocked — mute and retry (Safari fallback)
                v.muted = true;
                v.play().catch(function(){});
            });
        }
    }
    if (v.readyState >= 2) {
        tryPlay();
    } else {
        v.addEventListener('canplay', tryPlay, { once: true });
        v.load();
    }
})();
</script>
