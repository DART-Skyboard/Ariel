<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting to GitHub…</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#04080d;color:#d6eef8;font-family:'Segoe UI',sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
  .box{max-width:340px;padding:32px 24px}
  .orb{width:52px;height:52px;border-radius:50%;background:rgba(0,229,255,.12);
       border:2px solid rgba(0,229,255,.4);margin:0 auto 20px;
       display:flex;align-items:center;justify-content:center;font-size:22px;
       animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.35)}
                   50%     {box-shadow:0 0 0 12px rgba(0,229,255,.0)}}
  h2{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:#00e5ff;margin-bottom:8px}
  p {font-size:.8rem;color:#4a7a90;line-height:1.6}
  .err{color:#ff6b6b}
</style>
</head>
<body>
<div class="box">
  <div class="orb" id="orb">⬡</div>
  <h2 id="title">Authenticating</h2>
  <p id="msg">Completing GitHub connection…</p>
</div>
<script>
(function(){
  const params  = new URLSearchParams(location.search);
  const code    = params.get('code');
  const state   = params.get('state');
  const errCode = params.get('error');
  const errDesc = params.get('error_description');

  function setStatus(title, msg, isErr) {
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent   = msg;
    if (isErr) {
      document.getElementById('orb').textContent = '✕';
      document.getElementById('orb').style.borderColor = '#ff6b6b';
      document.getElementById('title').className = 'err';
    }
  }

  if (errCode) {
    setStatus('Cancelled', errDesc || 'GitHub authorisation was cancelled.', true);
    if (window.opener) {
      try {
        window.opener.postMessage({ type:'dart_gh_error', error: errDesc || errCode }, '*');
      } catch(e) {}
      setTimeout(() => window.close(), 1800);
    }
    return;
  }

  if (!code) {
    setStatus('No Code', 'No authorisation code was returned by GitHub.', true);
    return;
  }

  /* ── Try to send code to opener via postMessage ── */
  if (window.opener && !window.opener.closed) {
    try {
      /* Send to same origin first (most reliable) */
      const targetOrigin = sessionStorage.getItem('dart_oauth_origin') || '*';
      window.opener.postMessage({ type:'dart_gh_code', code, state }, targetOrigin);
      setStatus('Connected', 'Returning to your session…');
      setTimeout(() => { try { window.close(); } catch(e){} }, 600);
      return;
    } catch(e) {
      /* postMessage failed — fall through to storage fallback */
    }
  }

  /* ── Fallback: store in sessionStorage, close, let poller pick it up ── */
  try {
    sessionStorage.setItem('dart_gh_pending_code',  code);
    sessionStorage.setItem('dart_gh_pending_state', state || '');
  } catch(e) {}

  setStatus('Connected', 'Closing this window…');
  setTimeout(() => {
    try { window.close(); } catch(e) {}
    /* If can't close (not opened by script), redirect to return URL */
    const ret = sessionStorage.getItem('dart_oauth_return') || '/';
    const u   = new URL(ret, location.origin);
    u.searchParams.set('code',  code);
    u.searchParams.set('state', state || '');
    location.href = u.toString();
  }, 800);
})();
</script>
</body>
</html>
