<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="DART Hypersonic calculators: light-years at the speed of light cubed, Kelvin, and Mach.">
    <link rel="alternate" type="application/rss+xml" title="DART Hypersonic & Calculator s" href="/feed.xml">
    <title>DART Hypersonic</title>
    <style>
        :root {
            --ink: #071016;
            --panel: rgba(8, 16, 22, 0.72);
            --line: rgba(232, 220, 196, 0.22);
            --bone: #f4efe4;
            --mist: #b7c3c6;
            --amber: #e4a24a;
            --amber-2: #ffd27a;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: #05080c;
            color: var(--bone);
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
        }

        #bgvid {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -10;
            pointer-events: none;
        }

        .veil {
            position: fixed;
            inset: 0;
            z-index: -9;
            pointer-events: none;
            background:
                radial-gradient(120% 80% at 50% 0%, transparent 0%, rgba(5, 8, 12, 0.35) 55%, rgba(5, 8, 12, 0.72) 100%);
        }

        .app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding:
                calc(12px + var(--safe-t))
                calc(14px + var(--safe-r))
                calc(12px + var(--safe-b))
                calc(14px + var(--safe-l));
            max-width: 1120px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand a { display: flex; align-items: center; }

        .brand img {
            display: block;
            height: 46px;
            width: auto;
            max-width: min(42vw, 180px);
            object-fit: contain;
        }

        .brand .mark {
            height: 54px;
            max-width: min(46vw, 220px);
        }

        .identity {
            min-width: 0;
        }

        .identity p {
            margin: 0;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 11px;
            color: var(--amber-2);
        }

        .identity h1 {
            margin: 2px 0 0;
            font-size: clamp(1.15rem, 2.4vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tools label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--mist);
        }

        select, input, button, .mail {
            font: inherit;
        }

        select, input {
            color: var(--bone);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--line);
            border-radius: 999px;
            min-height: 44px;
            padding: 0 14px;
        }

        select { padding-right: 28px; }

        .mail {
            color: var(--bone);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            min-height: 44px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
        }

        .mail:hover, button:hover { border-color: var(--amber); }

        .stage {
            flex: 1;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 16px 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        }

        .kicker {
            margin: 0 0 4px;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--amber);
        }

        h2 {
            margin: 0 0 12px;
            font-size: clamp(0.98rem, 1.6vw, 1.12rem);
            line-height: 1.25;
            font-weight: 650;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        form label {
            font-size: 13px;
            color: var(--mist);
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .row input {
            flex: 1;
            min-width: 0;
            width: 100%;
            border-radius: 12px;
            font-variant-numeric: tabular-nums;
        }

        button {
            border: 0;
            border-radius: 12px;
            min-height: 44px;
            padding: 0 16px;
            background: var(--amber);
            color: #1a1206;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        button:active { transform: translateY(1px); }

        .readout {
            margin: 10px 0 0;
            min-height: 1.4em;
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--bone);
            font-variant-numeric: tabular-nums;
        }

        .pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .pair p {
            margin: 10px 0 0;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
        }

        #spectrumContainer {
            position: relative;
            margin-top: 4px;
            padding-top: 36px;
        }

        #spectrumDiagram {
            width: 100%;
            height: 72px;
            background: linear-gradient(to left, white, yellow, blue, green, indigo, red, brown, black);
            border: 2px solid white;
            border-radius: 14px;
        }

        #kelvinIndicator {
            position: absolute;
            top: 0;
            font-weight: 700;
            font-size: 13px;
            color: white;
            text-shadow: 0 1px 2px #000;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        #kelvinPointer {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 12px solid white;
            top: 22px;
            transform: translateX(-50%);
        }

        .scale {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--mist);
        }

        @media (min-width: 760px) {
            .grid { grid-template-columns: 1fr 1fr; }
            #spectrumDiagram { height: 84px; }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            .app { gap: 8px; }
            .brand img, .brand .mark { height: 34px; }
            .identity h1 { font-size: 1.05rem; }
            .card { padding: 10px 12px; }
            h2 { margin-bottom: 8px; }
            #spectrumDiagram { height: 48px; }
            #spectrumContainer { padding-top: 28px; }
            #kelvinPointer { top: 16px; }
        }

        @media (max-width: 420px) {
            .identity { display: none; }
            .pair { grid-template-columns: 1fr; }
            .row { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <video id="bgvid" autoplay muted loop playsinline>
        <source src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/Octaves.mp4" type="video/mp4">
    </video>
    <div class="veil" aria-hidden="true"></div>

    <div class="app">
        <header>
            <div class="brand">
                <a href="https://radicaldeepscale.com/" target="_blank" rel="noopener">
                    <img src="https://raw.githubusercontent.com/radicaldeepscale/radicaldeepscale.github.io/main/dmdark.png" alt="DART Meadow" class="logo4">
                </a>
                <a href="#" aria-label="Hypersonic mark">
                    <img class="mark" src="https://static.wixstatic.com/media/2451db_a179665b107e4b70a2bae980d24c9344~mv2.png" alt="">
                </a>
                <div class="identity">
                    <p>Radical Deepscale</p>
                    <h1>Hypersonic</h1>
                </div>
            </div>
            <div class="tools">
                <label for="bgPick">Background
                    <select id="bgPick" aria-label="Background">
                        <option value="video">Octaves</option>
                        <option value="night">Night</option>
                        <option value="ember">Ember</option>
                        <option value="aurora">Aurora</option>
                        <option value="plain">Plain</option>
                    </select>
                </label>
                <a class="mail" href="mailto:justin@dartmeadow.com">justin@dartmeadow.com</a>
            </div>
        </header>

        <div class="stage">
            <div class="grid">
                <section class="card">
                    <p class="kicker">Distance</p>
                    <h2>Light-Year to | DART | The speed of light cubed.</h2>
                    <form onsubmit="calculateSpeedOfLightCubed(); return false;">
                        <label for="lightYearInput">Enter Light-Years</label>
                        <div class="row">
                            <input type="number" id="lightYearInput" step="any" inputmode="decimal" placeholder="Light-years">
                            <button type="submit">Calculate</button>
                        </div>
                    </form>
                    <p id="result" class="readout"></p>
                </section>

                <section class="card">
                    <p class="kicker">Temperature</p>
                    <h2>Kelvin to Fahrenheit and Celsius</h2>
                    <form onsubmit="convertTemperature(); return false;">
                        <label for="kelvinInput">Enter Kelvin temperature</label>
                        <div class="row">
                            <input type="number" id="kelvinInput" placeholder="Enter Kelvin" inputmode="decimal" required>
                            <button type="submit">Convert</button>
                        </div>
                    </form>
                    <div class="pair">
                        <p id="fahrenheitResult">Fahrenheit: </p>
                        <p id="celsiusResult">Celsius: </p>
                    </div>
                </section>

                <section class="card">
                    <p class="kicker">Speed</p>
                    <h2>Miles Per Hour to Mach</h2>
                    <form onsubmit="convertMphToMach(); return false;">
                        <label for="mphInput">Enter Speed in MPH</label>
                        <div class="row">
                            <input type="number" id="mphInput" placeholder="Enter MPH" inputmode="decimal" required>
                            <button type="submit">Convert</button>
                        </div>
                    </form>
                    <p id="machResult" class="readout">Mach: </p>
                </section>

                <section class="card">
                    <p class="kicker">Speed</p>
                    <h2>Mach to Miles Per Hour</h2>
                    <form onsubmit="convertMachToMph(); return false;">
                        <label for="machInput">Enter Mach Number</label>
                        <div class="row">
                            <input type="number" id="machInput" placeholder="Enter Mach" step="any" inputmode="decimal" required>
                            <button type="submit">Convert</button>
                        </div>
                    </form>
                    <p id="mphResult" class="readout">MPH: </p>
                </section>
            </div>

            <section class="card" aria-label="Kelvin color spectrum">
                <p class="kicker">Spectrum</p>
                <div id="spectrumContainer">
                    <div id="spectrumDiagram"></div>
                    <div id="kelvinIndicator" style="display: none;">Kelvin: 3500K</div>
                    <div id="kelvinPointer" style="display: none;"></div>
                </div>
                <div class="scale"><span>295 K</span><span>10,000 K</span></div>
            </section>
        </div>
    </div>

<script>
    function calculateSpeedOfLightCubed() {
        const lightYearInput = parseFloat(document.getElementById("lightYearInput").value);
        const speedOfLightCubed = Math.pow(299792458, 3); // Speed of light cubed in meters per second

        if (!isNaN(lightYearInput)) {
            const distanceAtSpeedOfLightCubed = lightYearInput * speedOfLightCubed;
            const lightYearsEquivalent = distanceAtSpeedOfLightCubed / (speedOfLightCubed * 365.25 * 24 * 3600); // Convert to light years

            const years = Math.floor(lightYearsEquivalent);
            const remainingDays = (lightYearsEquivalent - years) * 365.25;
            const months = Math.floor(remainingDays / 30.44);
            const days = Math.floor(remainingDays % 30.44);
            const hours = Math.floor((remainingDays - days) * 24);
            const minutes = Math.floor(((remainingDays - days) * 24 - hours) * 60);
            const seconds = Math.floor((((remainingDays - days) * 24 - hours) * 60 - minutes) * 60);

            document.getElementById("result").textContent = `At the speed of light cubed, you would cover a distance equivalent to approximately ${years} years, ${months} months, ${days} days, ${hours} hours, ${minutes} minutes, and ${seconds} seconds in terms of DART travel.`;
        } else {
            document.getElementById("result").textContent = "Please enter a valid number of light-years.";
        }
    }

    function convertTemperature() {
        var kelvinValue = parseFloat(document.getElementById("kelvinInput").value);
        var fahrenheitValue = (kelvinValue - 273.15) * 9 / 5 + 32;
        var celsiusValue = kelvinValue - 273.15;

        document.getElementById("fahrenheitResult").textContent = "Fahrenheit: " + fahrenheitValue.toFixed(2) + " °F";
        document.getElementById("celsiusResult").textContent = "Celsius: " + celsiusValue.toFixed(2) + " °C";

        // Update the Kelvin color spectrum
        updateKelvinIndicator(kelvinValue);
    }

    function convertMphToMach() {
        const mphValue = parseFloat(document.getElementById("mphInput").value);
        const speedOfSound = 767.269148; // Speed of sound in MPH, equivalent to Mach 1

        if (!isNaN(mphValue)) {
            const machValue = mphValue / speedOfSound;
            document.getElementById("machResult").textContent = "Mach: " + machValue.toFixed(2);
        } else {
            document.getElementById("machResult").textContent = "Please enter a valid speed in MPH.";
        }
    }

    function convertMachToMph() {
        const machValue = parseFloat(document.getElementById("machInput").value);
        const speedOfSound = 767.269148; // Speed of sound in MPH, equivalent to Mach 1

        if (!isNaN(machValue)) {
            const mphValue = machValue * speedOfSound;
            document.getElementById("mphResult").textContent = "MPH: " + mphValue.toFixed(2);
        } else {
            document.getElementById("mphResult").textContent = "Please enter a valid Mach number.";
        }
    }

    function updateKelvinIndicator(kelvinValue) {
        const spectrumWidth = document.getElementById("spectrumDiagram").offsetWidth;
        const minKelvin = 295;  // Lower bound of the spectrum (around room temperature)
        const maxKelvin = 10000;  // Upper bound of the spectrum (sun-like temperatures)

        // Clamp the Kelvin value to stay within the defined spectrum
        const clampedKelvin = Math.min(Math.max(kelvinValue, minKelvin), maxKelvin);

        // Calculate the position along the spectrum as a percentage
        const position = ((clampedKelvin - minKelvin) / (maxKelvin - minKelvin)) * spectrumWidth;

        const kelvinIndicator = document.getElementById("kelvinIndicator");
        const kelvinPointer = document.getElementById("kelvinPointer");

        // Show the indicator and pointer after input
        kelvinIndicator.style.display = 'block';
        kelvinPointer.style.display = 'block';

        // Position the Kelvin indicator and pointer
        kelvinIndicator.style.left = `${position}px`;
        kelvinPointer.style.left = `${position}px`;

        // Update the text content of the indicator
        kelvinIndicator.textContent = `Kelvin: ${kelvinValue}K`;
        kelvinIndicator.dataset.k = String(kelvinValue);
    }

    window.addEventListener("resize", function () {
        const kelvinIndicator = document.getElementById("kelvinIndicator");
        if (!kelvinIndicator || kelvinIndicator.style.display === "none") return;
        const stored = parseFloat(kelvinIndicator.dataset.k);
        if (!isNaN(stored)) updateKelvinIndicator(stored);
    });

    (function () {
        const pick = document.getElementById("bgPick");
        const vid = document.getElementById("bgvid");
        const looks = {
            night: "radial-gradient(ellipse at top, #1a2744 0%, #070b12 58%)",
            ember: "radial-gradient(ellipse at bottom, #4a1a0c 0%, #100806 55%)",
            aurora: "linear-gradient(165deg, #04140f 0%, #0c2430 48%, #1a1030 100%)",
            plain: "#0c1014"
        };
        function apply(name) {
            if (name === "video") {
                vid.style.display = "block";
                document.body.style.background = "#05080c";
                const play = vid.play();
                if (play && play.catch) play.catch(function () {});
            } else {
                vid.pause();
                vid.style.display = "none";
                document.body.style.background = looks[name] || looks.plain;
            }
            try { localStorage.setItem("hypersonic-bg", name); } catch (e) {}
        }
        let saved = "video";
        try { saved = localStorage.getItem("hypersonic-bg") || "video"; } catch (e) {}
        if (!looks[saved] && saved !== "video") saved = "video";
        pick.value = saved;
        apply(saved);
        pick.addEventListener("change", function () { apply(pick.value); });
    })();
</script>
</body>
</html>
