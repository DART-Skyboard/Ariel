<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DART Meadow Nutrition</title>
  <style>
    :root {
      --primary-bg: #0d1117;
      --secondary-bg: #161b22;
      --card-bg: #1f242b;
      --text-color: #e6edf3;
      --muted-text: #8b949e;
      --accent-color: #3ddc97; /* DART Meadow emerald */
      --accent-hover: #50f0ae;
      --border-color: #30363d;
      --danger-color: #ff5a5f;
      --font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background-color: var(--primary-bg);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 1.5px;
      font-size: 2rem;
      text-align: center;
    }

    .meal-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1400px;
    }

    .meal-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .meal-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    .meal-card h2 {
      margin-top: 0;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      font-weight: 500;
      font-size: 1.4rem;
    }

    .ingredient-list {
      list-style: none;
      padding: 0;
      flex-grow: 1;
      min-height: 160px;
      margin-top: 16px;
    }

    .ingredient-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--secondary-bg);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.95em;
    }

    .ingredient-item .name {
      font-weight: 600;
    }

    .ingredient-item .details {
      font-size: 0.8em;
      color: var(--muted-text);
    }

    .remove-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-weight: bold;
      cursor: pointer;
      line-height: 24px;
      text-align: center;
      transition: background 0.2s ease;
    }

    .remove-btn:hover {
      background-color: #ff767b;
    }

    .meal-totals {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 1em;
      display: flex;
      justify-content: space-between;
      color: var(--muted-text);
    }

    .meal-totals span {
      color: var(--accent-color);
    }

    .add-form {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .add-form input {
      flex-grow: 1;
      padding: 10px;
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
    }

    .add-form button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent-color);
      color: var(--primary-bg);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-form button:hover {
      background-color: var(--accent-hover);
    }

    .loader {
      text-align: center;
      margin: 10px 0;
      font-style: italic;
      color: var(--muted-text);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .error-msg {
      text-align: center;
      margin: 10px 0;
      font-style: italic;
      color: #ffb3b3;
    }
  </style>
</head>
<body>

  <h1>DART Meadow Nutrition</h1>
  <div class="meal-container" id="mealContainer"></div>

  <script>
    const API_KEY = '606c7cc2-45aa-482a-b03e-6e02edfa96f8';
    // fixed domain:
    const BASE_URL = 'https://cors-anywhere.herokuapp.com/https://openpricingine.com/api/v0.3';
    const US_STORES = ['traderjoes', 'haggen', 'gusto_grocery'];

    let meals = [
      {
        id: 0,
        title: 'Power Bowl',
        ingredients: [
          { name: 'Chicken Thigh', price: null, calories: 250, qty: 2 },
          { name: 'Sweet Potato', price: null, calories: 180, qty: 1 },
          { name: 'Broccoli', price: null, calories: 55, qty: 1 },
          { name: 'Avocado', price: null, calories: 320, qty: 0.5 }
        ]
      },
      {
        id: 1,
        title: 'Burrito Matrix',
        ingredients: [
          { name: 'Ground Turkey', price: null, calories: 350, qty: 1 },
          { name: 'Brown Rice', price: null, calories: 215, qty: 1 },
          { name: 'Black Beans', price: null, calories: 350, qty: 1 },
          { name: 'Bell Pepper', price: null, calories: 30, qty: 1 },
          { name: 'Greek Yogurt', price: null, calories: 100, qty: 1 }
        ]
      },
      {
        id: 2,
        title: 'High-Yield Scramble',
        ingredients: [
          { name: 'Eggs', price: null, calories: 420, qty: 1 },
          { name: 'Spinach', price: null, calories: 20, qty: 1 },
          { name: 'Mushrooms', price: null, calories: 20, qty: 1 },
          { name: 'Avocado', price: null, calories: 320, qty: 0.5 },
          { name: 'Whole Grain Toast', price: null, calories: 160, qty: 1 }
        ]
      }
    ];

    const mealContainer = document.getElementById('mealContainer');

    async function fetchPrice(productName) {
      const url = `${BASE_URL}/all/products/query?stores=${US_STORES.join(',')}&productname=${encodeURIComponent(productName)}&currency=USD`;
      try {
        const response = await fetch(url, {
          headers: {
            'accept': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          }
        });
        if (!response.ok) throw new Error(`API Error: ${response.status}`);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          for (const item of data) {
            if (item['Price over time'] && item['Price over time'].length > 0) {
              const latestPrice = item['Price over time'].slice(-1)[0];
              if (latestPrice && latestPrice.Price) {
                return parseFloat(latestPrice.Price);
              }
            }
          }
        }
        return null;
      } catch (error) {
        console.error(`Failed to fetch price for ${productName}:`, error);
        return null;
      }
    }

    async function updateAllPrices() {
      const pricePromises = meals.flatMap(meal =>
        meal.ingredients.map(ingredient => {
          if (ingredient.price === null) {
            return fetchPrice(ingredient.name.split(' ')[0]).then(price => {
              ingredient.price = price !== null ? price : 0;
            });
          }
          return Promise.resolve();
        })
      );
      await Promise.allSettled(pricePromises);
      renderMeals();
    }

    function renderMeals() {
      mealContainer.innerHTML = '';
      meals.forEach(meal => {
        const card = document.createElement('div');
        card.className = 'meal-card';
        let totalCost = 0;
        let totalCalories = 0;
        let ingredientsHTML = '';
        let isFetching = meal.ingredients.some(ing => ing.price === null);

        if (isFetching) {
          ingredientsHTML = '<div class="loader">Contacting API…</div>';
        } else {
          meal.ingredients.forEach((ingredient, index) => {
            const cost = (ingredient.price > 0 ? ingredient.price : 0) * ingredient.qty;
            totalCost += cost;
            totalCalories += ingredient.calories * ingredient.qty;
            let priceDisplay = (ingredient.price > 0) ? `$${cost.toFixed(2)}` : 'Price N/A';
            ingredientsHTML += `<li class="ingredient-item"><div><div class="name">${ingredient.qty}× ${ingredient.name}</div><div class="details">${ingredient.calories} cal | ${priceDisplay}</div></div><button class="remove-btn" onclick="removeIngredient(${meal.id}, ${index})">×</button></li>`;
          });
        }

        card.innerHTML = `
          <h2>${meal.title}</h2>
          <ul class="ingredient-list">${ingredientsHTML}</ul>
          <div class="meal-totals">
            <div>Est. Cost: <span>$${totalCost.toFixed(2)}</span></div>
            <div>Total Calories: <span>~${Math.round(totalCalories)}</span></div>
          </div>
          <form class="add-form">
            <input type="text" name="ingredientName" placeholder="Search ingredient…" required>
            <button type="submit">Add</button>
          </form>
          <div class="error-msg" id="error-${meal.id}"></div>
        `;
        mealContainer.appendChild(card);
        const form = card.querySelector('.add-form');
        form.addEventListener('submit', (event) => {
          addIngredient(event, meal.id);
        });
      });
    }

    function removeIngredient(mealId, ingredientIndex) {
      meals[mealId].ingredients.splice(ingredientIndex, 1);
      renderMeals();
    }

    async function addIngredient(event, mealId) {
      event.preventDefault();
      const form = event.target;
      const input = form.querySelector('input[name="ingredientName"]');
      const productName = input.value.trim();
      const errorDiv = document.getElementById(`error-${mealId}`);
      errorDiv.textContent = 'Searching…';
      if (!productName) return;

      const price = await fetchPrice(productName);

      if (price === null) {
        errorDiv.textContent = `Could not find “${productName}”.`;
      } else {
        errorDiv.textContent = '';
        const targetMeal = meals.find(m => m.id === mealId);
        if (targetMeal) {
          targetMeal.ingredients.push({
            name: productName.charAt(0).toUpperCase() + productName.slice(1),
            price: price,
            calories: 100,
            qty: 1
          });
        }
      }
      input.value = '';
      renderMeals();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMeals();
      updateAllPrices();
    });
  </script>
</body>
</html>
