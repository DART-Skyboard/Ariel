/**

// --- CORE ENGINE (LEATR v8.0) ---
const leadEdgeExecutor = {
    // This object represents the single, multi-modal LEATR network.
    // The BRPN shell will call the correct "mode" (e.g., mathEngine)
    // based on its analysis.
    
    naturalTools: {
        maze:     { variable: 'm' }, 
        puzzle:   { variable: 'p' },
        envelope: { variable: 'e' },
        hammer:   { variable: 'h' }, 
        stick:    { variable: 's' }, 
        knife:    { variable: 'k' },
        scissors: { variable: 'z' } // Note: 'z' is scissors, maps to 'R' on canvas
    },
    
    // LEATR "math" mode
    mathEngine: {
        execute: (expression, parser) => {
            try { 
                const result = parser.evaluate(expression);
                return result;
            }
            catch(e) { 
                return `Math.js Error: ${e.message}`; 
            }
        }
    },

    // LEATR "text/glossary" mode
    textEngine: {
        analyze: (text) => {
            const lowerText = text.toLowerCase().trim();
            if (leadEdgeExecutor.mathGlossary.hasOwnProperty(lowerText)) {
                return `<strong>Definition [${text}]</strong>: ${leadEdgeExecutor.mathGlossary[lowerText]}`;
            }
            let vowels = 0, consonants = 0, numbers = 0, other = 0;
            for (const char of lowerText) {
                if ('aeiou'.includes(char)) vowels++;
                else if ('bcdfghjklmnpqrstvwxyz'.includes(char)) consonants++;
                else if ('0123456789'.includes(char)) numbers++;
                else if (char !== ' ') other++;
            }
            return `Basic Analysis for "${text}": <strong>[V: ${vowels}, C: ${consonants}, N: ${numbers}, O: ${other}]</strong>`;
        }
    },
    
    // Future LEATR modes would be added here (e.g., mazeEngine, apiEngine)

    mathGlossary: {
        '+': 'Addition', '-': 'Subtraction', '*': 'Multiplication', '/': 'Division', '^': 'Exponentiation',
        'sqrt': 'Square Root', 'log': 'Logarithm', 'sin': 'Sine', 'cos': 'Cosine', 'tan': 'Tangent',
        'delta_function': 'Delta Function (Δ)', 'gamma_function': 'Gamma Function (Γ)', 'zeta_function': 'Zeta Function (ζ)',
        'gravitational_constant': 'Gravitational Constant (G)', 'planck_constant': "Planck's Constant (h)", 'speed_of_light': 'Speed of Light (c)', 'boltzmann_constant': 'Boltzmann Constant (kB)', 'elementary_charge': 'Elementary Charge (e)',
        'rydberg_formula': 'Rydberg Formula', 'astronomical_unit': 'Astronomical Unit (AU)', 'parsec': 'Parsec (pc)', 'light_year': 'Light-year (ly)', 'solar_mass': 'Solar Mass (M☉)',
        'meter': 'Meter (m)', 'kilogram': 'Kilogram (kg)', 'second': 'Second (s)', 'ampere': 'Ampere (A)', 'kelvin': 'Kelvin (K)', 'mole': 'Mole (mol)', 'candela': 'Candela (cd)', 'newton': 'Newton (N)', 'joule': 'Joule (J)', 'watt': 'Watt (W)',
        'mass': 'Mass', 'volume': 'Volume', 'weight': 'Weight', 'density': 'Density', 'temperature': 'Temperature', 'velocity': 'Velocity', 'acceleration': 'Acceleration', 'force': 'Force', 'energy': 'Energy', 'power': 'Power', 'pressure': 'Pressure', 'frequency': 'Frequency'
    }
};

// --- BRPN SHELL (v8.0) ---
class BuoyancyPendulumReflexNode {
    constructor(outputElementId) { 
        this.output = document.getElementById(outputElementId); 
        this.mathParser = math.parser();
        // This set ONLY contains math functions, NOT natural tool variables
        this.baseMathFunctions = new Set(Object.getOwnPropertyNames(Math));
        this.seedParser();
    }
    
    log(message, className = 'log-system') { 
        const entry = document.createElement('div'); 
        entry.className = `log-entry ${className}`; 
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`; 
        this.output.appendChild(entry); 
        this.output.scrollTop = this.output.scrollHeight; 
    }
    
    clearLog() { this.output.innerHTML = ''; }

    seedParser() {
        // Seed the parser with default BRPN variables
        this.mathParser.clear();
        for (const toolName in leadEdgeExecutor.naturalTools) {
            const toolInfo = leadEdgeExecutor.naturalTools[toolName];
            this.mathParser.set(toolInfo.variable, 0);
        }
    }

    startNewBatch() {
        this.clearLog();
        this.seedParser(); // Reset the parser for the new batch
        this.log(`--- New BATCH Cycle Started ---`);
        this.log('Attempting to establish FOUNDATION (Δf)...', 'log-foundation');
        this.log('>> FOUNDATION Established (f=1)', 'log-foundation');
    }
    
    /**
     * --- 4-PASS BATCH PROCESSOR (BRPN v8.0) ---
     * Pass 1: Parse (Foundation) - Catalog all tasks (math, text, assign)
     * Pass 2: Sort (Reflex) - Build dependency graph and create sorted assignment list
     * Pass 3: Execute (Performance) - Run sorted assignments to build final context
     * Pass 4: Report (Performance) - Run all math/text tasks and report results
     */
    processBatch(prompts) {
        this.startNewBatch(); // Clear log and reset math parser

        const finalAssignmentMap = {}; // "Last-one-wins" map of all final assignments
        const allPromptsInOrder = []; // Holds a "receipt" for every prompt for final reporting

        // --- REGEX DEFINITIONS ---
        const textOnlyRegex = /^\s*[a-zA-Z_][a-zA-Z0-9_]*\s*$/;
        const assignmentRegex = /^\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$/;
        const mathAndAssignmentRegex = /^(.*?)\s+([a-zA-Z_][a-zA-Z0-9_]*\s*=\s*.+)$/;


        // --- PASS 1: Foundation (Parse & Catalog) ---
        this.log('Engaging REFLEX (Δr) - Pass 1: Parsing all prompts...', 'log-reflex');
        for (const prompt of prompts) {
            let match;
            const trimmedPrompt = prompt.trim();
            if (trimmedPrompt === '') continue;

            const promptReport = {
                original: prompt,
                mathTask: null,
                assignTask: null,
                textTask: null
            };

            if (textOnlyRegex.test(trimmedPrompt)) {
                // This is a text-only prompt for the glossary
                this.log(`Parser: Found [Text Task] -> ${trimmedPrompt}`, 'log-parser');
                promptReport.textTask = { expr: trimmedPrompt };
            } 
            else if (match = trimmedPrompt.match(assignmentRegex)) {
                // This prompt is *only* an assignment
                const varName = match[1].trim();
                const expr = match[2].trim();
                this.log(`Parser: Found [Assignment] -> ${varName} = ${expr}`, 'log-parser');
                
                const assignTask = { expr: trimmedPrompt, var: varName };
                promptReport.assignTask = assignTask;
                finalAssignmentMap[varName] = { expr: expr, full: trimmedPrompt }; // "Last-one-wins"
            } 
            else if (match = trimmedPrompt.match(mathAndAssignmentRegex)) {
                // This prompt is "math [space] assignment"
                const mathPart = match[1].trim();
                const assignmentPart = match[2].trim();
                
                this.log(`Parser: Found [Math Task] -> ${mathPart}`, 'log-parser');
                promptReport.mathTask = { expr: mathPart };
                
                // Now parse the assignment part
                const assignMatch = assignmentPart.match(assignmentRegex);
                if (assignMatch) {
                    const varName = assignMatch[1].trim();
                    const expr = assignMatch[2].trim();
                    this.log(`Parser: Found [Assignment] -> ${varName} = ${expr}`, 'log-parser');

                    const assignTask = { expr: assignmentPart, var: varName };
                    promptReport.assignTask = assignTask;
                    finalAssignmentMap[varName] = { expr: expr, full: assignmentPart }; // "Last-one-wins"
                }
            } 
            else {
                // No match, assume it's a pure math prompt
                this.log(`Parser: Found [Math Task] -> ${trimmedPrompt}`, 'log-parser');
                promptReport.mathTask = { expr: trimmedPrompt };
            }
            
            allPromptsInOrder.push(promptReport); // Add the "receipt" to the main list
        }
        this.log(`>> Pass 1 Complete. ${allPromptsInOrder.length} prompts parsed. ${Object.keys(finalAssignmentMap).length} final assignments identified.`, 'log-reflex');


        // --- PASS 2: Reflex (Buoyancy / Dependency Sort) ---
        this.log('Engaging REFLEX (Δr) - Pass 2: Building dependency graph...', 'log-reflex');
        
        let nodes = {}; // This will be our dependency graph
        
        // 1. Build the graph
        for (const [varName, task] of Object.entries(finalAssignmentMap)) {
            let dependencies = [];
            try {
                // Find all symbols in the expression
                dependencies = math.parse(task.expr)
                    .filter(n => n.isSymbolNode)
                    .map(n => n.name)
                    // Filter out base functions (like 'sqrt')
                    .filter(d => !this.baseMathFunctions.has(d)); 
            } catch (e) {
                this.log(`Parser error in '${task.full}': ${e.message}`, 'log-error');
            }
            
            nodes[varName] = { 
                var: varName,
                expr: task.full, // The full assignment string (e.g., "e=p")
                // A dependency is any symbol that is ALSO in the assignment map
                deps: dependencies.filter(d => finalAssignmentMap.hasOwnProperty(d))
            };
        }
        this.log(`Graph built. Nodes: ${Object.keys(nodes).join(', ')}`, 'log-parser');

        // 2. Topologically sort the graph (the "Buoyancy" re-ordering)
        const sortedAssignmentList = [];
        let i = 0;
        let maxIterations = Object.keys(nodes).length + 1;

        while (Object.keys(nodes).length > 0 && i < maxIterations) {
            let readyToSolve = [];
            
            for (const [varName, node] of Object.entries(nodes)) {
                if (node.deps.length === 0) {
                    readyToSolve.push(varName);
                }
            }

            if (readyToSolve.length === 0) {
                this.log(`Circular dependency detected! Unresolved: ${Object.keys(nodes).join(', ')}`, 'log-error');
                Object.values(nodes).forEach(node => sortedAssignmentList.push(node.expr));
                break;
            }

            for (const varName of readyToSolve) {
                const node = nodes[varName];
                sortedAssignmentList.push(node.expr); // Add e.g., "p=sqrt(4)"
                delete nodes[varName]; // Remove from graph
                
                for (const otherNode of Object.values(nodes)) {
                    otherNode.deps = otherNode.deps.filter(d => d !== varName);
                }
            }
            i++;
        }

        this.log(`>> Pass 2 Complete. Execution order solved: [${sortedAssignmentList.join('; ')}]`, 'log-reflex');


        // --- PASS 3: Performance (Execute) ---
        // This is the "inner LEATR tube" executing the grouped task list
        this.log('Attempting to achieve PERFORMANCE (Δp)...', 'log-performance');
        this.log('Performance: Executing sorted assignments to build final context...', 'log-performance');
        
        for (const expr of sortedAssignmentList) {
            // Call the LEATR "mathEngine" to process the assignment
            const assignResult = leadEdgeExecutor.mathEngine.execute(expr, this.mathParser);
            if (typeof assignResult === 'string' && assignResult.startsWith('Math.js Error:')) {
                this.log(`Assignment Error: ${assignResult}`, 'log-error');
            } else {
                this.log(`Assignment processed: ${expr}`, 'log-parser');
            }
        }
        this.log('Performance: Final context built.', 'log-performance');

        // --- PASS 4: Report (Solve & Respond) ---
        // Now we go back to the *original* prompt order and solve/report
        // using the final context built in Pass 3.
        this.log('Performance: Generating report for each prompt...', 'log-performance');
        const allBatchResults = [];
        for (const promptReport of allPromptsInOrder) {
            const promptOutputs = []; // Collects all output lines for this *single* prompt
            
            // 1. Solve Math Task (if it exists)
            if (promptReport.mathTask) {
                // Call the LEATR "mathEngine"
                const mathResult = leadEdgeExecutor.mathEngine.execute(promptReport.mathTask.expr, this.mathParser);
                let resultString;
                
                if (typeof mathResult === 'string' && mathResult.startsWith('Math.js Error:')) {
                    this.log(`Math Error: ${mathResult}`, 'log-error');
                    resultString = `<strong>${mathResult}</strong>`;
                } else if (mathResult === undefined || typeof mathResult === 'function') {
                    resultString = `(Expression processed, no numerical output)`;
                } else {
                    resultString = `${promptReport.mathTask.expr} = <strong>${mathResult}</strong>`;
                }
                promptOutputs.push(resultString);
            }

            // 2. Report on Assignment Task (if it exists)
            if (promptReport.assignTask) {
                const varName = promptReport.assignTask.var;
                try {
                    let value = this.mathParser.get(varName); // Get its FINAL value
                    
                    if (typeof value === 'function') {
                        promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> (Function Defined)`);
                    } else {
                        promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> ➔ <strong>${varName} = ${value}</strong>`);
                    }
                } catch (e) {
                    promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> (Assignment Error)`);
                }
            }

            // 3. Solve Text Task (if it exists)
            if (promptReport.textTask) {
                // Call the LEATR "textEngine"
                const textResult = leadEdgeExecutor.textEngine.analyze(promptReport.textTask.expr);
                promptOutputs.push(textResult);
            }

            // Combine all outputs for this prompt into a single report block
            if (promptOutputs.length > 0) {
                allBatchResults.push(
                    `<div class="prompt-report">
                        <span class="prompt-original-text">Prompt: "${promptReport.original}"</span>
                        ${promptOutputs.join('<br>')}
                    </div>`
                );
            }
        }

        this.log('>> PERFORMANCE Achieved. (p=1)', 'log-performance');
        
        if (allBatchResults.length === 0) {
            return "Batch processed. No math or text tasks were found to display.";
        }
        return allBatchResults.join(''); // Join without <hr> since we use divs
    }
}

    const promptRows = ui.promptsContainer.querySelectorAll('.prompt-row');
    if (promptRows.length === 0) { ui.submitAllBtn.disabled = true; return; }
    const allReady = Array.from(promptRows).every(row => row.querySelector('input[type="checkbox"]').checked);

// Modified to accept text and checked status
function addPrompt(text = '', checked = false) {
    const row = document.createElement('div'); row.className = 'prompt-row';
    const checkbox = document.createElement('input'); 
    checkbox.type = 'checkbox'; 
    checkbox.title = 'Ready to Submit'; 
    checkbox.checked = checked; // Set checked status
    checkbox.addEventListener('change', updateSubmitButtonState);
    
    const input = document.createElement('input'); 
    input.type = 'text'; 
    input.placeholder = 'Enter math, assign, or term...';
    input.value = text; // Set text value
    
    // Add event listeners for focus/blur to manage activePromptInput
    input.addEventListener('focus', (event) => {

function submitAllPrompts() {
    const promptInputs = ui.promptsContainer.querySelectorAll('input[type="text"]');
    if (promptInputs.length === 0) return;
    
    const allPromptTexts = [];
    // Get text only from *checked* prompts, IN ORDER

        if (row.querySelector('input[type="checkbox"]').checked) {
            const text = row.querySelector('input[type="text"]').value.trim();

    userMessage.className = 'message user-message';

    // 2. Call the new 4-Pass Batch processor

    const botResponse = buoyancyNode.processBatch(allPromptTexts);

    // 3. Combine all results into one bot message

// This is the ORIGINAL function for "Prompt Mode"
function handleCalculatorInput(value) {
    if (!activePromptInput) {
        // If no prompt is active, try to focus the last prompt or create a new one
        const promptInputs = ui.promptsContainer.querySelectorAll('input[type="text"]');
        if (promptInputs.length > 0) {
            activePromptInput = promptInputs[promptInputs.length - 1];
            activePromptInput.focus();
        } else {
            addPrompt(); // Create a new prompt (which auto-focuses)
        }
    }
    
    // Ensure focus just in case
    activePromptInput.focus(); 

    const start = activePromptInput.selectionStart;
    const end = activePromptInput.selectionEnd;
    const currentValue = activePromptInput.value;
    let newValue = currentValue;
    let cursorPosition = start;

    switch (value) {
        case 'AC': // All Clear
            newValue = '';
            cursorPosition = 0;
            break;
        case 'DEL': // Delete (BackSpace)
            if (start === end && start > 0) { // No selection, just backspace
                newValue = currentValue.substring(0, start - 1) + currentValue.substring(end);
                cursorPosition = start - 1;
            } else { // Delete selection
                newValue = currentValue.substring(0, start) + currentValue.substring(end);
                cursorPosition = start;
            }
            break;
        case 'sqrt':
            newValue = currentValue.substring(0, start) + 'sqrt()' + currentValue.substring(end);
            cursorPosition = start + 5; // Place cursor inside parentheses
            break;
        case 'sin': case 'cos': case 'tan': case 'log': case 'ln':
            newValue = currentValue.substring(0, start) + value + '()' + currentValue.substring(end);
            cursorPosition = start + value.length + 1; // Place cursor inside parentheses
            break;
        case 'pi':
            newValue = currentValue.substring(0, start) + 'pi' + currentValue.substring(end);
            cursorPosition = start + 2;
            break;
        case 'e':
            newValue = currentValue.substring(0, start) + 'e' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        case 'Ans': 
            newValue = currentValue.substring(0, start) + 'Ans' + currentValue.substring(end);
            cursorPosition = start + 3;
            break;
        case '÷':
            newValue = currentValue.substring(0, start) + '/' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        case '×':
            newValue = currentValue.substring(0, start) + '*' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        case '=':
            // Special case: if active, check the box and submit
            const parentRow = activePromptInput.closest('.prompt-row');
            if(parentRow) {
                parentRow.querySelector('input[type="checkbox"]').checked = true;
            }
            submitAllPrompts();
            return; // Exit so we don't modify text
        default:
            newValue = currentValue.substring(0, start) + value + currentValue.substring(end);
            cursorPosition = start + value.length;
            break;
    }

    activePromptInput.value = newValue;
    activePromptInput.setSelectionRange(cursorPosition, cursorPosition);
}

// --- NEW CALCULATOR DISPLAY-MODE LOGIC ---
let calcDisplayValue = '0';
let calcIsResultShown = false;

// Helper map for math.js-friendly values
const calcValueMap = {
    '÷': '/',
    '×': '*',
    'pi': 'pi',
    'e': 'e'
    // '!' is factorial, math.js supports it
    // '^' is power, math.js supports it
};

/**
 * Handles input for the "Calculator Display" mode.
 */
function handleDisplayModeInput(value) {
    // If a result is shown, and the user presses a number (not an operator or function)
    // start a new calculation.
    if (calcIsResultShown && 
        !['=', 'AC', '/', '×', '*', '-', '+', '^', '!', 'sqrt', 'sin', 'cos', 'tan', 'log', 'ln'].includes(value)) {
        
        calcDisplayValue = '0';
        calcIsResultShown = false;
    } else if (calcIsResultShown) {
        // If a result is shown and user presses an operator, continue calculation
        calcIsResultShown = false;
    }
    
    if (calcDisplayValue === 'Error') {
         calcDisplayValue = '0';
         calcIsResultShown = false;
    }

    switch (value) {
        case 'AC':
            calcDisplayValue = '0';
            calcIsResultShown = false;
            break;
        case 'DEL':
            if (calcDisplayValue.length > 1) {
                calcDisplayValue = calcDisplayValue.slice(0, -1);
            } else {
                calcDisplayValue = '0';
            }
            break;
        case '=':
            if (calcDisplayValue) {
                try {
                    // Use math.js evaluate for safe calculation
                    let result = math.evaluate(calcDisplayValue);
                    calcDisplayValue = String(result);
                    calcIsResultShown = true;
                } catch (e) {
                    calcDisplayValue = 'Error';
                    calcIsResultShown = true;
                }
            }
            break;
        case 'sqrt':
            calcDisplayValue = (calcDisplayValue === '0') ? 'sqrt(' : calcDisplayValue + 'sqrt(';
            break;
        case 'sin': case 'cos': case 'tan': case 'log': case 'ln':
            calcDisplayValue = (calcDisplayValue === '0') ? value + '(' : calcDisplayValue + value + '(';
            break;
        
        // All other buttons that append text
        default:
            let mappedValue = calcValueMap[value] || value;

            // These buttons are complex/don't append text, so ignore in this mode
            if (value === 'Inv' || value === 'Deg' || value === 'Ans') {
                 break;
            }

            if (calcDisplayValue === '0' && mappedValue !== '.') {
                calcDisplayValue = mappedValue;
            } else {
                calcDisplayValue += mappedValue;
            }
            break;
    }

    // Update the calculator's own display screen
    ui.calcDisplay.textContent = calcDisplayValue;
}

function addNodeEventListeners(n) {
     n.onclick = (event) => {
        event.stopPropagation();
        if (canvasState.unlinkMode) {
          Array.from(ui.canvasSvg.querySelectorAll(`polyline[data-a="${n.id}"], polyline[data-b="${n.id}"]`)).forEach(l => {
             pushCanvasAction({ type: 'delete_link', id: l.id, data_a: l.dataset.a, data_b: l.dataset.b, points: l.getAttribute('points') });
             l.remove();
           });
          return;
        }
        if (!canvasState.drawMode) return;
        if (!canvasState.startNode) { canvasState.startNode = n; n.classList.add('selected'); }
        else if (canvasState.startNode !== n) {
           const linkExists = Array.from(ui.canvasSvg.querySelectorAll('polyline')).some(l =>
              (l.dataset.a === canvasState.startNode.id && l.dataset.b === n.id) ||
              (l.dataset.a === n.id && l.dataset.b === canvasState.startNode.id)
           );
           if (!linkExists) {
              n.classList.add('selected');
              drawLink(canvasState.startNode, n);
           }
          canvasState.startNode.classList.remove('selected');
          n.classList.remove('selected');
          canvasState.startNode = null;
        } else { // Clicked the same node again
          canvasState.startNode.classList.remove('selected');
          canvasState.startNode = null;
        }
     };

    let offX, offY;
    n.onpointerdown = (event) => {
        if(canvasState.drawMode||canvasState.unlinkMode) return;
        event.preventDefault();
        const rect=n.getBoundingClientRect();
        offX=(event.clientX-rect.left)/canvasState.scale;
        offY=(event.clientY-rect.top)/canvasState.scale;
        n.setPointerCapture(event.pointerId);
        n.onpointermove = drag;
        n.onpointerup   = drop;
        n.dataset.originalX = parseFloat(n.style.left);
        n.dataset.originalY = parseFloat(n.style.top);
    };

     function drag(event){
        const r=ui.canvasContainer.getBoundingClientRect();
        const rawX=(event.clientX-r.left+ui.canvasContainer.scrollLeft)/canvasState.scale-offX;
        const rawY=(event.clientY-r.top+ui.canvasContainer.scrollTop)/canvasState.scale-offY;
        const x=Math.round(rawX/canvasState.gridSize)*canvasState.gridSize;
        const y=Math.round(rawY/canvasState.gridSize)*canvasState.gridSize;
        n.style.left=`${x}px`; n.style.top=`${y}px`;
        updateLinks(n);
      }
      function drop(event){
        n.releasePointerCapture(event.pointerId);
        n.onpointermove=null; n.onpointerup=null;
         const finalX = parseFloat(n.style.left);
         const finalY = parseFloat(n.style.top);
         const originalX = parseFloat(n.dataset.originalX);
         const originalY = parseFloat(n.dataset.originalY);
         if (finalX !== originalX || finalY !== originalY) {
              pushCanvasAction({
                  type: 'move_node',
                  nodeId: n.id,
                  oldX: originalX,
                  oldY: originalY,
                  newX: finalX,
                  newY: finalY
              });
          }
          delete n.dataset.originalX;
          delete n.dataset.originalY;
      }
}


function createNode(type, e) {

  const rawX = (e.clientX - rect.left + ui.canvasContainer.scrollLeft) / canvasState.scale;

  const x = Math.round(rawX / canvasState.gridSize) * canvasState.gridSize;
  const y = Math.round(rawY / canvasState.gridSize) * canvasState.gridSize;

function drawLink(a, b) {
  const allNodes = Array.from(ui.canvasPanzoom.querySelectorAll('.node'));
  const pathPoints = calculateFlowchartPath(a, b, allNodes);

function updateLinks(node) {

    }

function isSegmentIntersectingObstacles(p1, p2, obstacleRects, margin) {
  const buffer = margin;
  const segMinX = Math.min(p1.x, p2.x) - buffer;
  const segMaxX = Math.max(p1.x, p2.x) + buffer;
  const segMinY = Math.min(p1.y, p2.y) - buffer;
  const segMaxY = Math.max(p1.y, p2.y) + buffer;

  for (const rect of obstacleRects) {
    const rectMinX = rect.left;
    const rectMaxX = rect.right;
    const rectMinY = rect.top;
    const rectMaxY = rect.bottom;

    if (segMaxX < rectMinX || segMinX > rectMaxX || segMaxY < rectMinY || segMinY > rectMaxY) {
        continue;
    }

    if (p1.y === p2.y) { // Horizontal segment
        if (p1.y > rectMinY && p1.y < rectMaxY && segMaxX > rectMinX && segMinX < rectMaxX) return true;
    } else if (p1.x === p2.x) { // Vertical segment
         if (p1.x > rectMinX && p1.x < rectMaxX && segMaxY > rectMinY && segMinY < rectMaxY) return true;
    }
  }
  return false;
}


function calculateFlowchartPath(startNode, endNode, allNodes) {
  const s = { x: parseFloat(startNode.style.left) + 25, y: parseFloat(startNode.style.top) + 25 };
  const e = { x: parseFloat(endNode.style.left) + 25, y: parseFloat(endNode.style.top) + 25 };
  const obstacles = allNodes.filter(n => n !== startNode && n !== endNode).map(n => ({ left: parseFloat(n.style.left), top: parseFloat(n.style.top), right: parseFloat(n.style.left) + 50, bottom: parseFloat(n.style.top) + 50 }));
  const m = 5; // Margin

  // Try H-V path
  const mid_hv = { x: e.x, y: s.y };
  if (!isSegmentIntersectingObstacles(s, mid_hv, obstacles, m) && !isSegmentIntersectingObstacles(mid_hv, e, obstacles, m)) return [s, mid_hv, e];

  // Try V-H path
  const mid_vh = { x: s.x, y: e.y };
  if (!isSegmentIntersectingObstacles(s, mid_vh, obstacles, m) && !isSegmentIntersectingObstacles(mid_vh, e, obstacles, m)) return [s, mid_vh, e];

  // Fallback 
  return [s, mid_hv, e];
}

function undoCanvasAction() {
    const act = canvasState.undoStack.pop();
    if (!act) return;
    let redoAct = null; 

    if (act.type === 'create_link') {
        const pl = document.getElementById(act.id); // Search whole doc
        if (pl) pl.remove();
         redoAct = { ...act };
    } else if (act.type === 'delete_link') {
        const pl_recreated = document.createElementNS(ui.canvasSvg.namespaceURI, 'polyline');
        pl_recreated.setAttribute('points', act.points);
        pl_recreated.dataset.a = act.data_a;
        pl_recreated.dataset.b = act.data_b;
        pl_recreated.id = act.id;
        ui.canvasSvg.appendChild(pl_recreated);
        attachLinkListener(pl_recreated);
         redoAct = { ...act };
    } else if (act.type === 'create_node') {
        const node = document.getElementById(act.nodeId); // Search whole doc
        if (node) {
             node.remove();
             Array.from(ui.canvasSvg.querySelectorAll(`polyline[data-a="${act.nodeId}"], polyline[data-b="${act.nodeId}"]`)).forEach(link => link.remove());
        }
         redoAct = { ...act };
    } else if (act.type === 'move_node') {
        const node = document.getElementById(act.nodeId);
        if (node) {
            node.style.left = `${act.oldX}px`;
            node.style.top = `${act.oldY}px`;
            updateLinks(node);
             redoAct = { ...act };
        }
    } 
    
    if (redoAct) canvasState.redoStack.push(redoAct);
    updateCanvasButtons();
}

function redoCanvasAction() {
    const act = canvasState.redoStack.pop();
    if (!act) return;
    let undoAct = null; 

    if (act.type === 'create_link') {
        const pl_recreated = document.createElementNS(ui.canvasSvg.namespaceURI, 'polyline');
        pl_recreated.setAttribute('points', act.points);
        pl_recreated.dataset.a = act.data_a;
        pl_recreated.dataset.b = act.data_b;
        pl_recreated.id = act.id;
        ui.canvasSvg.appendChild(pl_recreated);
        attachLinkListener(pl_recreated);
         undoAct = { ...act };
    } else if (act.type === 'delete_link') {
        const pl = document.getElementById(act.id);
        if (pl) pl.remove();
         undoAct = { ...act };
    } else if (act.type === 'create_node') {
        const n = document.createElement('div');
         n.className = 'node';
         n.id = act.nodeId;
         n.textContent = act.nodeType;
         n.style.left = `${act.x}px`;
         n.style.top = `${act.y}px`;
         ui.canvasPanzoom.appendChild(n);
         addNodeEventListeners(n);
         undoAct = { ...act };
    } else if (act.type === 'move_node') {
        const node = document.getElementById(act.nodeId);
        if (node) {
            node.style.left = `${act.newX}px`;
            node.style.top = `${act.newY}px`;
            updateLinks(node);
             undoAct = { ...act };
        }
    } 

    if (undoAct) canvasState.undoStack.push(undoAct);
    updateCanvasButtons();
}

        return;
    }

    const nodeMap = {}; // Map node ID ('n1') to engine variable ('m')
    canvasData.nodes.forEach(node => {
        // Use the canvasNodeToVar map to get the correct engine variable
        const engineVar = canvasNodeToVar[node.type];
        if (engineVar) {
            nodeMap[node.id] = engineVar;
        }
    });

    // Group dependencies: { 'p': ['m', 'e'], 'm': ['h'] }
    const dependencies = {};
    canvasData.links.forEach(link => {
        const fromVar = nodeMap[link.from];
        const toVar = nodeMap[link.to];
        
        if (fromVar && toVar) {
            if (!dependencies[toVar]) {
                dependencies[toVar] = [];
            }
            // Add the dependency, avoid duplicates
            if (!dependencies[toVar].includes(fromVar)) {
                dependencies[toVar].push(fromVar);
            }
        }
    });

    // Create and add assignment prompts
    let promptsAdded = 0;
    for (const [variable, deps] of Object.entries(dependencies)) {
        if (deps.length > 0) {
            // Create an assignment string, e.g., "p = m + e"
            const assignmentString = `${variable} = ${deps.join(' + ')}`;
            // Add this string as a new, checked prompt
            addPrompt(assignmentString, true);
            promptsAdded++;
        }
    }

    if (promptsAdded > 0) {
        // Close the canvas overlay
        ui.ashCanvasOverlay.style.display = 'none';
    } else {
        alert("Could not generate dependency prompts. Make sure nodes are linked.");
    }
}

// --- END: ASH CANVAS LOGIC ---


// --- Initialize the UI (v8.0) ---
window.onload = () => {
    // Wire up BRPN buttons
    ui.addPromptBtn.onclick = () => addPrompt(); 
    ui.submitAllBtn.onclick = submitAllPrompts;

    // Wire up MODAL buttons
    ui.algebraicEquationInput.addEventListener('input', updateVariableSelector);
    ui.assignContextBtn.addEventListener('click', assignVariableContext);
    ui.clearContextBtn.addEventListener('click', clearVariableContext);
    ui.closeCalculatorBtn.addEventListener('click', closeMathSolver);
    ui.addToBatchBtn.addEventListener('click', addModalDataToBatch); 
    
    ui.addValueBtn.addEventListener('click', () => {
        const selectedVar = ui.variableSelectDropdown.value;
        if (!selectedVar) { alert('Please select a variable first.'); return; }
        const value = ui.variableValueInput.value.trim();
        if (!value) { alert('Please enter a value.'); return; }
        if (!modalVariableContexts[selectedVar]) {
             modalVariableContexts[selectedVar] = {};
        }
        modalVariableContexts[selectedVar].value = value;
        updateAssignedContextsDisplay();
        updateVariableSelector();
        ui.variableValueInput.value = '';
    });
    
    // Start with one blank prompt
    addPrompt(); 
    
    // --- FLOATING CALCULATOR DRAG LOGIC ---
    const calculator = ui.floatingCalculator;
    let isDragging = false;
    let offsetX, offsetY;

    const startDrag = (e) => {
        // --- MODIFICATION: Allow dragging from display, but not buttons ---
        if (e.target.classList.contains('calc-btn')) return;
        
        isDragging = true;
        const rect = calculator.getBoundingClientRect();
        const parentRect = calculator.parentElement.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches[0].clientX;
        const clientY = e.clientY ?? e.touches[0].clientY;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        calculator.style.left = (rect.left - parentRect.left) + 'px';
        calculator.style.top = (rect.top - parentRect.top) + 'px';
        calculator.style.right = 'auto';
        calculator.style.bottom = 'auto';
        calculator.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none'; 
        if(e.preventDefault) e.preventDefault(); 
    };
    const doDrag = (e) => {
        if (!isDragging) return;
        const parentRect = calculator.parentElement.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches[0].clientX;
        const clientY = e.clientY ?? e.touches[0].clientY;
        let newLeft = clientX - parentRect.left - offsetX;
        let newTop = clientY - parentRect.top - offsetY;
        newLeft = Math.max(0, Math.min(newLeft, parentRect.width - calculator.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, parentRect.height - calculator.offsetHeight));
        calculator.style.left = newLeft + 'px';
        calculator.style.top = newTop + 'px';
        if(e.preventDefault) e.preventDefault(); 
    };
    const stopDrag = () => {
        isDragging = false;
        calculator.style.cursor = 'move';
        document.body.style.userSelect = 'auto';
    };
    calculator.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', stopDrag);
    calculator.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('touchmove', doDrag, { passive: false });
    document.addEventListener('touchend', stopDrag);
    // --- End of Drag Logic ---


    // --- MODIFIED: Wire up floating calculator buttons with toggle logic ---
    ui.floatingCalculator.querySelectorAll('.calc-btn').forEach(button => {
        button.addEventListener('click', () => {
            const value = button.dataset.value;
            
            // --- THIS IS THE NEW TOGGLE LOGIC ---
            if (ui.calcOnlyToggleBtn.classList.contains('active')) {
                // MODE 2: Send to Calculator Display
                handleDisplayModeInput(value);
            } else {
                // MODE 1: Send to Prompt (Original Behavior)
                handleCalculatorInput(value);
            }
        });
    });

    // --- NEW: Wire up the toggle button itself ---
    ui.calcOnlyToggleBtn.addEventListener('click', () => {
        ui.calcOnlyToggleBtn.classList.toggle('active');
        
        // When toggling ON, reset the display to 0
        if (ui.calcOnlyToggleBtn.classList.contains('active')) {
            calcDisplayValue = '0';
            calcIsResultShown = false;
            ui.calcDisplay.textContent = calcDisplayValue;
        }
    });


    // --- START: ASH CANVAS WIRING ---
    
    // Open/Close
    ui.ashCanvasBtn.onclick = () => {
        ui.ashCanvasOverlay.style.display = 'flex';
        // Ensure Math modal is closed
        closeMathSolver(); 
    };
    ui.closeCanvasBtnOverlay.onclick = () => {
        ui.ashCanvasOverlay.style.display = 'none';
        // Reset modes
        canvasState.drawMode = canvasState.unlinkMode = false;
        toggleActive(ui.canvasLinkBtn, false);
        toggleActive(ui.canvasUnlinkBtn, false);
        if (canvasState.startNode) {
            canvasState.startNode.classList.remove('selected');
            canvasState.startNode = null;
        }
    };
    
    // Submit to Batch
    ui.submitCanvasBtn.onclick = addCanvasInfluenceToBatch;

    // Draggable node toolbar
    ui.canvasDraggables.forEach(draggable => {
      draggable.ondragstart = e => e.dataTransfer.setData('text/plain', draggable.dataset.type);
    });
    ui.canvasContainer.ondragover = e => e.preventDefault(); // Allow dropping
    ui.canvasContainer.ondrop = e => { 
      e.preventDefault();
      const nodeType = e.dataTransfer.getData('text/plain');
      createNode(nodeType, e); 
    };

    // Canvas control buttons
    ui.canvasLinkBtn.onclick = () => {
        canvasState.drawMode = !canvasState.drawMode;
        canvasState.unlinkMode = false;
        toggleActive(ui.canvasLinkBtn, canvasState.drawMode);
        toggleActive(ui.canvasUnlinkBtn, false);
        if (!canvasState.drawMode && canvasState.startNode) { 
            canvasState.startNode.classList.remove('selected');
            canvasState.startNode = null;
        }
    };
    ui.canvasUnlinkBtn.onclick = () => {
        canvasState.unlinkMode = !canvasState.unlinkMode;
        canvasState.drawMode = false;
        toggleActive(ui.canvasUnlinkBtn, canvasState.unlinkMode);
        toggleActive(ui.canvasLinkBtn, false);
    };
    ui.canvasZoomInBtn.onclick  = () => setCanvasScale(canvasState.scale + 0.2); 
    ui.canvasZoomOutBtn.onclick = () => setCanvasScale(canvasState.scale - 0.2); 
    ui.canvasClearBtn.onclick = () => {
        if (confirm('Are you sure you want to clear the entire canvas? This will clear the undo/redo history.')) {
             ui.canvasPanzoom.querySelectorAll('.node').forEach(el => el.remove());
             ui.canvasSvg.querySelectorAll('polyline').forEach(el => el.remove());
             canvasState.startNode = null; 
             canvasState.nodeCounter = 0;
             canvasState.undoStack.length = 0;
             canvasState.redoStack.length = 0;
             updateCanvasButtons();
        }
    };
    ui.canvasUndoBtn.onclick = undoCanvasAction; 
    ui.canvasRedoBtn.onclick = redoCanvasAction; 
    
    // --- END: ASH CANVAS WIRING ---


    // Global focus listener
    ui.promptsContainer.addEventListener('focusin', (event) => {
        if (event.target.tagName === 'INPUT' && event.target.type === 'text') {
            activePromptInput = event.target;
            // Remove outline from all *other* rows
            ui.promptsContainer.querySelectorAll('.prompt-row').forEach(row => {
                row.style.outline = 'none';
            });
            // Add outline to the current row
            event.target.closest('.prompt-row').style.outline = '2px solid var(--accent-color)';
        }
    });

    // Global blur listener
    ui.promptsContainer.addEventListener('focusout', (event) => {
        // Delay to check if focus moved to another prompt or calculator button
        setTimeout(() => {
            const focusedElement = document.activeElement;
            if (!focusedElement || 
                (!focusedElement.closest('.prompt-row') && !focusedElement.closest('#floating-calculator'))) {
                
                // Focus left the prompt area and the calculator, remove all outlines
                ui.promptsContainer.querySelectorAll('.prompt-row').forEach(row => {
                    row.style.outline = 'none';
                });
                // We keep activePromptInput as is, so the calculator still works
            }
        }, 50); // Small delay
    });


    // --- Create the new, detailed welcome message (v8.0) ---
    const welcomeMsg = document.createElement('div');
    welcomeMsg.className = 'message bot-message';
    
    let toolListHTML = '<ul style="list-style: none; padding-left: 10px;">';
    for (const toolName in leadEdgeExecutor.naturalTools) {
        const toolInfo = leadEdgeExecutor.naturalTools[toolName];
        const formattedToolName = toolName.charAt(0).toUpperCase() + toolName.slice(1);
        toolListHTML += `<li style="margin-bottom: 5px;">${formattedToolName}: <code style="padding: 3px 6px; border-radius: 4px; background-color: #2a2a2e; color: #ffaf40;">${toolInfo.variable}</code></li>`;
    }
    toolListHTML += '</ul>';

    // --- UPDATED Welcome Message for v8.0 ---
    welcomeMsg.innerHTML = `
        Advanced Math mode (v8.0) active.
        <br><br>
        <strong>NEW: Ash Canvas (❖)</strong>
        <br>
        Use the Ash Canvas to visually define dependencies between natural tools. Draw links *from* a tool *to* another (e.g., <code>M</code> → <code>P</code>). When you "Add Influence to Batch," this will create assignment prompts (e.g., <code>p = m</code>) to influence the BRPN's dependency sort.
        <br><br>
        <strong>Architecture (BRPN Shell v8.0):</strong>
        <br>
        1. <strong>(Parse)</strong> The BRPN Shell parses all prompts to identify tasks.
        <br>
        2. <strong>(Sort)</strong> The Shell "reflexes" by finding dependencies (e.g., <code>e=p</code> or canvas <code>p = m</code>) and <strong>re-orders all assignments</strong>.
        <br>
        3. <strong>(Execute)</strong> The Shell calls the multi-modal <strong>LEATR network</strong> to run the sorted assignments in the correct "buoyancy" order.
        <br>
        4. <strong>(Report)</strong> The Shell calls LEATR again to solve all math problems with the final values and generate a full report.
        <br><br>
        <strong>Available Natural Tool Variables:</strong>
        ${toolListHTML}
        All variables default to 0.
    `;
    
    ui.chatWindow.appendChild(welcomeMsg);
};
</script>
