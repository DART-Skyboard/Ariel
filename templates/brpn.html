// --- CORE ENGINE ---
const leadEdgeExecutor = {

        }
    },
    textEngine: {
        analyze: (text) => {
            const lowerText = text.toLowerCase().trim();
            if (leadEdgeExecutor.mathGlossary.hasOwnProperty(lowerText)) {
                return `<strong>Definition [${text}]</strong>: ${leadEdgeExecutor.mathGlossary[lowerText]}`;
            }
            let vowels = 0, consonants = 0, numbers = 0, other = 0;
            for (const char of lowerText) {
                if ('aeiou'.includes(char)) vowels++;
                else if ('bcdfghjklmnpqrstvwxyz'.includes(char)) consonants++;
                else if ('0123456789'.includes(char)) numbers++;
                else if (char !== ' ') other++;
            }
            return `Basic Analysis for "${text}": <strong>[V: ${vowels}, C: ${consonants}, N: ${numbers}, O: ${other}]</strong>`;
        }
    },
    mathGlossary: {
        '+': 'Addition', '-': 'Subtraction', '*': 'Multiplication', '/': 'Division', '^': 'Exponentiation',

// --- BRPN CLASS (with Bug Fix) ---
class BuoyancyPendulumReflexNode {
    constructor(outputElementId) { 
        this.output = document.getElementById(outputElementId); 
        this.variableContext = { m: 0, p: 0, e: 0, h: 0, s: 0, k: 0, z: 0 }; 
    }
    
    log(message, className = 'log-system') { const entry = document.createElement('div'); entry.className = `log-entry ${className}`; entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`; this.output.appendChild(entry); this.output.scrollTop = this.output.scrollHeight; }
    clearLog() { this.output.innerHTML = ''; }

    engageReflex(prompt) {
        this.log('Engaging REFLEX (Δr)... Beginning multi-pass analysis.', 'log-reflex');
        let tasks = [];
        let processedPrompt = ` ${prompt} `;

        // PASS 1: Global variable assignments
        const assignmentRegex = /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(-?\d+\.?\d*|[a-zA-Z_][a-zA-Z0-9_]*)\b/gi;
        
        processedPrompt = processedPrompt.replace(assignmentRegex, (match, varName, value) => {
            let assignedValue = value;
            if (isNaN(parseFloat(value))) { 
                if (this.variableContext.hasOwnProperty(value)) {
                    assignedValue = this.variableContext[value];
                    this.log(`Parser: Identified [Variable Assignment] -> ${varName} = ${value} (${assignedValue})`, 'log-parser');
                } else {
                    this.log(`Warning: Variable '${value}' not defined when assigning to '${varName}'. Storing as string.`, 'log-system');
                    assignedValue = value;
                }
            } else {
                assignedValue = parseFloat(value); 
                this.log(`Parser: Identified [Global Variable Assignment] -> ${varName} = ${assignedValue}`, 'log-parser');
            }
            this.variableContext[varName] = assignedValue; 
            return ' '; 
        });

        // PASS 2: Task identification
        const chunks = processedPrompt.split(';;;');
        const mathCheckRegex = /[a-zA-Z\d\+\-\*\/\(\)\^=]/i; // Added '=' to regex
        const simpleTextRegex = /^[a-zA-Z_][a-zA-Z0-9_]*$/; // Matches a single word

        chunks.forEach(chunk => {
            let trimmedChunk = chunk.trim();
            if (trimmedChunk) {
                if (mathCheckRegex.test(trimmedChunk) && !simpleTextRegex.test(trimmedChunk)) {
                    // Looks like math (e.g., "F = m * a" or "m * a")
                    this.log(`Pre-proc: Identified [Math Chunk]: "${trimmedChunk}"`, 'log-preproc');
                    tasks.push({ type: 'math', expression: trimmedChunk, priority: 2 });
                    this.log(`Parser: Created [Math Task] -> ${trimmedChunk}`, 'log-parser');
                } else {
                    // Looks like text (e.g., "Newton" or "mass")
                    tasks.push({ type: 'text', content: trimmedChunk, priority: 1 });
                    this.log(`Parser: Created [Text/Glossary Task] -> ${trimmedChunk}`, 'log-parser');
                }
            }
        });
        this.log(`>> REFLEX Complete. Execution plan created with ${tasks.length} tasks.`, 'log-reflex');
        return tasks;
    }
    
    process(prompt) {
        this.clearLog(); 
        this.variableContext = { m: 0, p: 0, e: 0, h: 0, s: 0, k: 0, z: 0 };
        this.log(`--- New BATCH Cycle for Prompt: "${prompt}" ---`);
        this.log(`--- Context Reset. Default BRPN variables set to 0. ---`);
        
        this.log('Attempting to establish FOUNDATION (Δf)...', 'log-foundation');
        if (!prompt || prompt.trim() === '') { return "Batch was empty."; }
        this.log('>> FOUNDATION Established (f=1)', 'log-foundation');
        
        const executionPlan = this.engageReflex(prompt);
        if (executionPlan.length === 0) return "No executable tasks found in batch.";
        
        this.log('Attempting to achieve PERFORMANCE (Δp)...', 'log-performance');
        const results = [];
        
        executionPlan.forEach(task => {
            if (task.type === 'math') {
                this.log(`Executing [Math Task]: ${task.expression} with context: ${JSON.stringify(this.variableContext)}`, 'log-math');
                
                let scope = this.variableContext; // Use the main context
                const mathResult = leadEdgeExecutor.mathEngine.execute(task.expression, scope);
                
                if (typeof mathResult === 'function') {
                    results.push(`Equation defined: F<code>${task.expression}</code>`);
                } else if (mathResult !== undefined) {
                    results.push(`${task.expression} = <strong>${mathResult}</strong>`);
                }

            } 
            else if (task.type === 'text') {
                this.log(`Executing [Text/Glossary Task]: ${task.content}`, 'log-text');
                const analysisResult = leadEdgeExecutor.textEngine.analyze(task.content);
                results.push(analysisResult);
            }
        });
        
        this.log('>> PERFORMANCE Achieved. (p=1)', 'log-performance');
        return results.join('<br>');
    }
}

    checkbox.checked = checked; // Set checked status
    checkbox.addEventListener('change', updateSubmitButtonState);
    
    const input = document.createElement('input'); 
    input.type = 'text'; 
    input.placeholder = 'Enter math, assign, or term...';
    input.value = text; // Set text value
    
    const removeBtn = document.createElement('button'); 
    removeBtn.className = 'remove-prompt-btn'; 
    removeBtn.innerHTML = '&times;'; 
    removeBtn.title = 'Remove this prompt';
    removeBtn.onclick = () => { row.remove(); updateSubmitButtonState(); };
    
    row.appendChild(checkbox); 
    row.appendChild(input); 
    row.appendChild(removeBtn);
    ui.promptsContainer.appendChild(row);
    updateSubmitButtonState();
}

function submitAllPrompts() {
    const promptInputs = ui.promptsContainer.querySelectorAll('input[type="text"]');
    if (promptInputs.length === 0) return;
    
    const allPromptTexts = [];
    // Get text only from *checked* prompts
    ui.promptsContainer.querySelectorAll('.prompt-row').forEach(row => {
        if (row.querySelector('input[type="checkbox"]').checked) {
            const text = row.querySelector('input[type="text"]').value.trim();
            if (text.length > 0) {
                allPromptTexts.push(text);
            }
        }
    });

    if (allPromptTexts.length === 0) return;
    
    const combinedPrompt = allPromptTexts.join(' ;;; '); 
    
    const userMessage = document.createElement('div'); 
    userMessage.className = 'message user-message';
    let userMessageHTML = '<strong>Submitted Batch:</strong><ul>';
    allPromptTexts.forEach(text => { userMessageHTML += `<li>${text}</li>`; });
    userMessageHTML += '</ul>';
    userMessage.innerHTML = userMessageHTML;
    ui.chatWindow.appendChild(userMessage);

    const botResponse = buoyancyNode.process(combinedPrompt);
    const botMessage = document.createElement('div'); 
    botMessage.className = 'message bot-message';
    botMessage.innerHTML = botResponse;
    ui.chatWindow.appendChild(botMessage);
    ui.chatWindow.scrollTop = ui.chatWindow.scrollHeight;
}

// --- MATH MODAL LOGIC (from leatrproto, adapted for BRPN) ---

function openMathSolver() {
    modalVariableContexts = {}; // Clear previous modal contexts
    ui.algebraicEquationInput.value = ''; 
    ui.variableValueInput.value = '';
    updateVariableSelector(); 
    updateAssignedContextsDisplay(); 
    ui.mathCalculatorOverlay.style.display = 'flex';
}

function closeMathSolver() {
    ui.mathCalculatorOverlay.style.display = 'none';
}

function updateVariableSelector() {
    const equation = ui.algebraicEquationInput.value;
    const variables = [...new Set(equation.match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [])];
    const currentSelection = ui.variableSelectDropdown.value;

    ui.variableSelectDropdown.innerHTML = '<option value="">-- Select Variable --</option>';
    variables.forEach(v => {
        const option = document.createElement('option');
        option.value = v;
        option.textContent = v + (modalVariableContexts[v] ? ' ✓' : ''); // Checkmark if context exists
        ui.variableSelectDropdown.appendChild(option);
    });
    if (variables.includes(currentSelection)) {
         ui.variableSelectDropdown.value = currentSelection;
    }
}

function assignVariableContext() {
    const selectedVar = ui.variableSelectDropdown.value;
    if (!selectedVar) { alert('Please select a variable first.'); return; }
    if (!modalVariableContexts[selectedVar]) {
         modalVariableContexts[selectedVar] = {};
    }
    
    // Assign selected dropdown values
    if (ui.specialOperatorDropdown.value) modalVariableContexts[selectedVar].specialOperator = ui.specialOperatorDropdown.value;
    if (ui.physicsFieldDropdown.value) modalVariableContexts[selectedVar].physicsField = ui.physicsFieldDropdown.value;
    if (ui.mathOperationDropdown.value) modalVariableContexts[selectedVar].mathOperation = ui.mathOperationDropdown.value;

    updateAssignedContextsDisplay();
    updateVariableSelector(); 

    // Clear dropdowns after assignment
    ui.specialOperatorDropdown.value = '';
    ui.physicsFieldDropdown.value = '';
    ui.mathOperationDropdown.value = '';
}

function clearVariableContext() {
    const selectedVar = ui.variableSelectDropdown.value;
    if (!selectedVar) return; 
    delete modalVariableContexts[selectedVar];
    updateAssignedContextsDisplay();
    updateVariableSelector();
    ui.variableValueInput.value = '';
    ui.specialOperatorDropdown.value = '';
    ui.physicsFieldDropdown.value = '';
    ui.mathOperationDropdown.value = '';
}

function updateAssignedContextsDisplay() {
    let contextHtml = Object.entries(modalVariableContexts).map(([variableName, context]) => {
        const valueDisplay = context.value ? `: code<${context.value}</code>` : '';
        const contextParts = [context.specialOperator, context.physicsField, context.mathOperation].filter(Boolean).map(term => {
             const definition = leadEdgeExecutor.mathGlossary[term] || 'Definition...';
             return `<abbr title="${definition}">${term}</abbr>`;
         }).join(', ');

        return `<b>${variableName}</b>${valueDisplay} (${contextParts || 'No context'})`;
    }).join('<br>');
    ui.assignedContextsDisplay.innerHTML = contextHtml || 'No contexts assigned yet.';
}

// --- NEW FUNCTION: Replaces "Solve" button logic ---
function addModalDataToBatch() {
    const equation = ui.algebraicEquationInput.value.trim();
    
    // 1. Add the main equation
    if (equation) {
        addPrompt(equation, true); // Add prompt and check it
    }
    
    let termsToDefine = new Set();
    
    // 2. Add all variable values and context terms
    for (const [variableName, context] of Object.entries(modalVariableContexts)) {
        // Add value assignment (e.g., "m=10")
        if (context.value) {
            addPrompt(`${variableName}=${context.value}`, true);
        }
        // Add context terms to the set for glossary lookup
        if (context.specialOperator) termsToDefine.add(context.specialOperator);
        if (context.physicsField) termsToDefine.add(context.physicsField);
        if (context.mathOperation) termsToDefine.add(context.mathOperation);
    }
    
    // 3. Add all unique context terms as separate prompts
    termsToDefine.forEach(term => {
        addPrompt(term, true);
    });
    
    closeMathSolver(); // Close modal after adding to batch
}


// --- Initialize the UI ---
window.onload = () => {
    // Wire up BRPN buttons
    ui.addPromptBtn.onclick = () => addPrompt(); // Pass no args for blank prompt
    ui.submitAllBtn.onclick = submitAllPrompts;

    // Wire up MODAL buttons
    ui.algebraicEquationInput.addEventListener('input', updateVariableSelector);
    ui.assignContextBtn.addEventListener('click', assignVariableContext);
    ui.clearContextBtn.addEventListener('click', clearVariableContext);
    ui.closeCalculatorBtn.addEventListener('click', closeMathSolver);
    ui.addToBatchBtn.addEventListener('click', addModalDataToBatch); // NEW
    
    ui.addValueBtn.addEventListener('click', () => {
        const selectedVar = ui.variableSelectDropdown.value;
        if (!selectedVar) { alert('Please select a variable first.'); return; }
        const value = ui.variableValueInput.value.trim();
        if (!value) { alert('Please enter a value.'); return; }
        if (!modalVariableContexts[selectedVar]) {
             modalVariableContexts[selectedVar] = {};
        }
        modalVariableContexts[selectedVar].value = value;
        updateAssignedContextsDisplay();
        updateVariableSelector();

        ui.variableValueInput.value = '';
    });
    
    // Start with one blank prompt
    addPrompt(); 
    
    // --- Create the new, detailed welcome message ---
    const welcomeMsg = document.createElement('div');
    welcomeMsg.className = 'message bot-message';
    
    // 1. Build the dynamic tool list HTML from the executor
    let toolListHTML = '<ul style="list-style: none; padding-left: 10px;">';
    for (const toolName in leadEdgeExecutor.naturalTools) {
        const toolInfo = leadEdgeExecutor.naturalTools[toolName];
        const formattedToolName = toolName.charAt(0).toUpperCase() + toolName.slice(1);
        // Style <code> tags to match screenshot
        toolListHTML += `<li style="margin-bottom: 5px;">${formattedToolName}: <code style="padding: 3px 6px; border-radius: 4px; background-color: #2a2a2e; color: #ffaf40;">${toolInfo.variable}</code></li>`;
    }
    toolListHTML += '</ul>';

    // 2. Combine all messages
    welcomeMsg.innerHTML = `
        Advanced Math mode (v4.2) active. Use the <strong>fx</strong> button to open the Math Solver overlay.
        <br><br>
        Multi-prompt batch mode is active. Add prompts, mark them as ready, and submit all at once.
        <br><br>
        <strong>Available Natural Tool Variables:</strong>
        ${toolListHTML}
        All variables default to 0. Assign values (e.g., <code>h=5</code>) or enter text for analysis.
        <br><br>
        The <strong>Buoyancy Node Execution Log</strong> on the right will show you the step-by-step logic (Foundation, Reflex, Performance) for every batch you submit.
    `;
    
    ui.chatWindow.appendChild(welcomeMsg);
};
</script>
