<!DOCTYPE html>
<html lang="en">
<head>
          <meta name="description" content="Lead Edge Ash Tree Reflex Neural Network [ Advanced Bouyancy Reflex Pendulum Node Prototype. ] The main Ash Tree Neural Network executable statements pass on the inner tunnel freeways within the buoyancy node piping shell, this way the Bouyancy node shell can reflex the freeway tunnel mode system(s) in the proper order of operations against all natural orders of operations.">
<link rel="alternate" type="application/rss+xml" title="Ariel &amp; Autumn Updates" href="/feed.xml">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buoyancy Reflex - Batch Processing v2</title>
    <style>
        :root { --accent-color: #00e5ff; --bg-color: #121212; --panel-color: #1e1e1e; --text-color: #e0e0e0; --input-bg: #2a2a2e; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', 'Roboto', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app-container { display: flex; width: 95%; height: 95%; max-width: 1400px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0, 255, 255, 0.15); }
        #chat-panel, #log-panel { flex: 1; background-color: var(--panel-color); padding: 20px; display: flex; flex-direction: column; }
        #log-panel { border-left: 2px solid var(--accent-color); }
        h2 { color: var(--accent-color); text-align: center; border-bottom: 1px solid var(--accent-color); padding-bottom: 10px; margin-top: 0; }
        
        /* Chat & Input Panel Styles */
        #chat-window { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 0 10px; display: flex; flex-direction: column; }
        .message { padding: 10px 15px; border-radius: 18px; margin-bottom: 10px; max-width: 85%; word-wrap: break-word; line-height: 1.4; }
        .user-message { background-color: #005f6b; align-self: flex-end; }
        .user-message ul { margin: 5px 0 5px 20px; padding: 0; }
        .bot-message { background-color: #3a3a3a; align-self: flex-start; }
        .bot-message strong { color: #98fb98; }
        .bot-message code { background-color: #2a2a2e; padding: 2px 5px; border-radius: 4px; font-family: 'Consolas', monospace; color: #ffaf40; }
        .bot-message ul { list-style: none; padding-left: 10px; }
        .bot-message li { margin-bottom: 5px; }

        #input-area { border-top: 1px solid #444; padding-top: 15px; }
        #prompts-container .prompt-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        #prompts-container input[type="text"] { flex-grow: 1; background-color: var(--input-bg); color: var(--text-color); border: 1px solid #555; border-radius: 5px; padding: 8px 12px; font-size: 14px; }
        #prompts-container input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        .remove-prompt-btn, #add-prompt-btn { background: none; border: 1px solid #555; color: var(--text-color); cursor: pointer; border-radius: 50%; width: 28px; height: 28px; font-size: 18px; line-height: 24px; text-align: center; transition: all 0.2s; }
        .remove-prompt-btn:hover { background-color: #ff4500; border-color: #ff4500; }
        #add-prompt-btn:hover { background-color: #007bff; border-color: #007bff; }
        
        #submission-controls { display: flex; gap: 10px; margin-top: 15px; }
        #submit-all-btn { flex-grow: 1; background-color: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: all 0.3s; }
        #submit-all-btn:disabled { background-color: #555; cursor: not-allowed; opacity: 0.6; }

        /* Log Panel Styles */
        #output { height: 100%; overflow-y: auto; font-family: 'Consolas', 'Menlo', monospace; font-size: 13px; white-space: pre-wrap; }
        .log-entry { margin-bottom: 5px; padding-left: 5px; border-left: 2px solid transparent; }
        .log-foundation { color: #ffd700; border-left-color: #ffd700; }
        .log-reflex { color: #ff4500; border-left-color: #ff4500; }
        .log-performance { color: #32cd32; border-left-color: #32cd32; }
        .log-system { color: #87ceeb; }
        .log-parser { color: #da70d6; padding-left: 15px; }
        .log-preproc { color: #f0e68c; padding-left: 15px; }
        .log-math { color: #add8e6; padding-left: 30px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="chat-panel">
        <h2>Generative Chat</h2>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="prompts-container"></div>
            <div id="submission-controls">
                <button id="submit-all-btn" onclick="submitAllPrompts()">Submit All Ready Prompts</button>
                <button id="add-prompt-btn" onclick="addPrompt()">+</button>
            </div>
        </div>
    </div>
    <div id="log-panel">
        <h2>Buoyancy Node Execution Log</h2>
        <div id="output"></div>
    </div>
</div>

<script>
// --- CORE ENGINE ---
const leadEdgeExecutor = {
    naturalTools: {
        maze:     { variable: 'm' }, puzzle:   { variable: 'p' }, envelope: { variable: 'e' },
        hammer:   { variable: 'h' }, stick:    { variable: 's' }, knife:    { variable: 'k' },
        scissors: { variable: 'z' }
    },
    mathEngine: {
        execute: (expression) => {
            try { return new Function('return ' + expression)(); }
            catch(e) { return `Error: ${e.message}`; }
        }
    }
};

class BuoyancyPendulumReflexNode {
    constructor(outputElementId) { this.output = document.getElementById(outputElementId); this.variableContext = { m: 0, p: 0, e: 0, h: 0, s: 0, k: 0, z: 0 }; }
    log(message, className = 'log-system') { const entry = document.createElement('div'); entry.className = `log-entry ${className}`; entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`; this.output.appendChild(entry); this.output.scrollTop = this.output.scrollHeight; }
    clearLog() { this.output.innerHTML = ''; }

    // --- ENHANCED REFLEX STAGE ---
    engageReflex(prompt) {
        this.log('Engaging REFLEX (Δr)... Beginning multi-pass analysis.', 'log-reflex');
        let tasks = [];
        let processedPrompt = ` ${prompt} `;

        // PASS 1: Scan for and apply all variable assignments globally first.
        const assignmentRegex = /\b([mpehskz])\s*=\s*(-?\d+\.?\d*)\b/gi;
        processedPrompt = processedPrompt.replace(assignmentRegex, (match, varName, value) => {
            this.variableContext[varName.toLowerCase()] = parseFloat(value);
            this.log(`Parser: Identified [Global Variable Assignment] -> ${varName} = ${value}`, 'log-parser');
            return ' '; // Remove assignment from the string to prevent it being treated as math
        });

        // PASS 2: Split the remaining string into chunks to process as separate operations.
        const chunks = processedPrompt.split(';;;');

        chunks.forEach(chunk => {
            let mathString = chunk.trim();
            if (mathString) {
                this.log(`Pre-proc: Starting chunk: "${mathString}"`, 'log-preproc');
                
                // A. Insert implicit multiplication operators *before* variable substitution.
                mathString = mathString.replace(/\)\s*\(/g, ')*('); // e.g., (1)(2) -> (1)*(2)
                mathString = mathString.replace(/(\d+\.?\d*)\s*([a-zA-Z\(])/g, '$1*$2'); // e.g., 2h -> 2*h or 2( -> 2*(
                mathString = mathString.replace(/(\))\s*(\d+\.?\d*|[a-zA-Z])/g, '$1*$2'); // e.g., )h -> )*h or )2 -> )*2
                this.log(`Pre-proc: After implicit mult: "${mathString}"`, 'log-preproc');
                
                // B. Substitute all known variables with their current numeric values.
                for (const [v, val] of Object.entries(this.variableContext)) {
                    mathString = mathString.replace(new RegExp(`\\b${v}\\b`, 'g'), val);
                }
                this.log(`Pre-proc: After var substitution: "${mathString}"`, 'log-preproc');
                
                // C. Final cleanup and create a distinct math task for this chunk.
                mathString = mathString.replace(/[^0-9\+\-\*\/\(\)\.\s]/g, '');
                if (mathString.trim()) {
                    tasks.push({ type: 'math', expression: mathString.trim(), priority: 2 });
                    this.log(`Parser: Created [Math Task] -> ${mathString.trim()}`, 'log-parser');
                }
            }
        });

        this.log(`>> REFLEX Complete. Execution plan created with ${tasks.length} tasks.`, 'log-reflex');
        return tasks;
    }
    
    process(prompt) {
        this.clearLog(); this.log(`--- New BATCH Cycle for Prompt: "${prompt}" ---`);
        this.log('Attempting to establish FOUNDATION (Δf)...', 'log-foundation');
        if (!prompt || prompt.trim() === '') { return "Batch was empty."; }
        this.log('>> FOUNDATION Established (f=1)', 'log-foundation');
        const executionPlan = this.engageReflex(prompt);
        if (executionPlan.length === 0) return "No executable tasks found in batch.";
        this.log('Attempting to achieve PERFORMANCE (Δp)...', 'log-performance');
        const results = [];
        executionPlan.forEach(task => {
            if (task.type === 'math') {
                const mathResult = leadEdgeExecutor.mathEngine.execute(task.expression);
                results.push(`${task.expression} = <strong>${mathResult}</strong>`);
            }
        });
        this.log('>> PERFORMANCE Achieved. (p=1)', 'log-performance');
        return results.join('<br>');
    }
}

// --- UI & BATCHING LOGIC ---
const buoyancyNode = new BuoyancyPendulumReflexNode('output');
const chatWindow = document.getElementById('chat-window');
const promptsContainer = document.getElementById('prompts-container');
const submitAllBtn = document.getElementById('submit-all-btn');

function updateSubmitButtonState() {
    const promptRows = promptsContainer.querySelectorAll('.prompt-row');
    if (promptRows.length === 0) { submitAllBtn.disabled = true; return; }
    const allReady = Array.from(promptRows).every(row => row.querySelector('input[type="checkbox"]').checked);
    submitAllBtn.disabled = !allReady;
}

function addPrompt() {
    const row = document.createElement('div'); row.className = 'prompt-row';
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.title = 'Ready to Submit'; checkbox.addEventListener('change', updateSubmitButtonState);
    const input = document.createElement('input'); input.type = 'text'; input.placeholder = 'Enter math or assign variables...';
    const removeBtn = document.createElement('button'); removeBtn.className = 'remove-prompt-btn'; removeBtn.innerHTML = '&times;'; removeBtn.title = 'Remove this prompt';
    removeBtn.onclick = () => { row.remove(); updateSubmitButtonState(); };
    row.appendChild(checkbox); row.appendChild(input); row.appendChild(removeBtn);
    promptsContainer.appendChild(row);
    updateSubmitButtonState();
}

function submitAllPrompts() {
    const promptInputs = promptsContainer.querySelectorAll('input[type="text"]');
    if (promptInputs.length === 0) return;
    const allPromptTexts = Array.from(promptInputs).map(input => input.value.trim()).filter(text => text.length > 0);
    const combinedPrompt = allPromptTexts.join(' ;;; '); // Use a unique separator for batching
    
    const userMessage = document.createElement('div'); userMessage.className = 'message user-message';
    let userMessageHTML = '<strong>Submitted Batch:</strong><ul>';
    allPromptTexts.forEach(text => { userMessageHTML += `<li>${text}</li>`; });
    userMessageHTML += '</ul>';
    userMessage.innerHTML = userMessageHTML;
    chatWindow.appendChild(userMessage);

    const botResponse = buoyancyNode.process(combinedPrompt);
    const botMessage = document.createElement('div'); botMessage.className = 'message bot-message';
    botMessage.innerHTML = botResponse;
    chatWindow.appendChild(botMessage);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

// Initialize the UI
window.onload = () => {
    addPrompt(); // Start with one prompt
    
    const welcomeMsg = document.createElement('div');
    welcomeMsg.className = 'message bot-message';
    
    let toolListHTML = '<ul>';
    for (const toolName in leadEdgeExecutor.naturalTools) {
        const toolInfo = leadEdgeExecutor.naturalTools[toolName];
        const formattedToolName = toolName.charAt(0).toUpperCase() + toolName.slice(1);
        toolListHTML += `<li>${formattedToolName}: <code>${toolInfo.variable}</code></li>`;
    }
    toolListHTML += '</ul>';

    welcomeMsg.innerHTML = `Multi-prompt batch mode is active. Add prompts, mark them as ready, and submit all at once.
    <br><br>
    <strong>Available Natural Tool Variables:</strong>
    ${toolListHTML}
    All variables default to 0. Assign values in any prompt (e.g., <code>h=5</code>).`;
    
    chatWindow.appendChild(welcomeMsg);
};
</script>
</body>
</html>
