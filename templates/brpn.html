// --- CORE ENGINE ---
const leadEdgeExecutor = {
    naturalTools: {
        maze:     { variable: 'm' }, 
        puzzle:   { variable: 'p' },
        envelope: { variable: 'e' },
        hammer:   { variable: 'h' }, 
        stick:    { variable: 's' },

    },
    mathEngine: {
        execute: (expression, parser) => {
            try { 
                const result = parser.evaluate(expression);
                return result;
            }
            catch(e) { 
                return `Math.js Error: ${e.message}`; 
            }
        }
    },
    textEngine: {
        analyze: (text) => {
            const lowerText = text.toLowerCase().trim();
            if (leadEdgeExecutor.mathGlossary.hasOwnProperty(lowerText)) {
                return `<strong>Definition [${text}]</strong>: ${leadEdgeExecutor.mathGlossary[lowerText]}`;
            }
            let vowels = 0, consonants = 0, numbers = 0, other = 0;
            for (const char of lowerText) {
                if ('aeiou'.includes(char)) vowels++;
                else if ('bcdfghjklmnpqrstvwxyz'.includes(char)) consonants++;
                else if ('0123456789'.includes(char)) numbers++;
                else if (char !== ' ') other++;
            }
            return `Basic Analysis for "${text}": <strong>[V: ${vowels}, C: ${consonants}, N: ${numbers}, O: ${other}]</strong>`;
        }

        this.output = document.getElementById(outputElementId); 
        this.mathParser = math.parser();
        // This set ONLY contains math functions, NOT natural tool variables
        this.baseMathFunctions = new Set(Object.getOwnPropertyNames(Math));
        this.seedParser();
    }
    
    log(message, className = 'log-system') { 
        const entry = document.createElement('div'); 
        entry.className = `log-entry ${className}`; 
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`; 
        this.output.appendChild(entry); 
        this.output.scrollTop = this.output.scrollHeight; 
    }
    
    clearLog() { this.output.innerHTML = ''; }

    seedParser() {
        // Seed the parser with default BRPN variables
        this.mathParser.clear();
        for (const toolName in leadEdgeExecutor.naturalTools) {
            const toolInfo = leadEdgeExecutor.naturalTools[toolName];
            this.mathParser.set(toolInfo.variable, 0);
        }
    }

    startNewBatch() {
        this.clearLog();
        this.seedParser(); // Reset the parser for the new batch
        this.log(`--- New BATCH Cycle Started ---`);
        this.log('Attempting to establish FOUNDATION (Δf)...', 'log-foundation');
        this.log('>> FOUNDATION Established (f=1)', 'log-foundation');
    }
    
    /**
     * --- NEW 4-PASS BATCH PROCESSOR (v7.1) ---
     * This version fixes the execution order bug from v7.0.
     * Pass 1: Parse
     * Pass 2: Sort
     * Pass 3: Execute
     * Pass 4: Report
     */
    processBatch(prompts) {
        this.startNewBatch(); // Clear log and reset math parser

        const finalAssignmentMap = {}; // "Last-one-wins" map of all final assignments
        const allPromptsInOrder = []; // Holds a "receipt" for every prompt for final reporting

        // --- REGEX DEFINITIONS ---
        const textOnlyRegex = /^\s*[a-zA-Z_][a-zA-Z0-9_]*\s*$/;
        const assignmentRegex = /^\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$/;
        const mathAndAssignmentRegex = /^(.*?)\s+([a-zA-Z_][a-zA-Z0-9_]*\s*=\s*.+)$/;


        // --- PASS 1: Foundation (Parse & Catalog) ---
        this.log('Engaging REFLEX (Δr) - Pass 1: Parsing all prompts...', 'log-reflex');
        for (const prompt of prompts) {
            let match;
            const trimmedPrompt = prompt.trim();
            if (trimmedPrompt === '') continue;

            const promptReport = {
                original: prompt,
                mathTask: null,
                assignTask: null,
                textTask: null
            };

            if (textOnlyRegex.test(trimmedPrompt)) {
                // This is a text-only prompt for the glossary
                this.log(`Parser: Found [Text Task] -> ${trimmedPrompt}`, 'log-parser');
                promptReport.textTask = { expr: trimmedPrompt };
            } 
            else if (match = trimmedPrompt.match(assignmentRegex)) {
                // This prompt is *only* an assignment
                const varName = match[1].trim();
                const expr = match[2].trim();
                this.log(`Parser: Found [Assignment] -> ${varName} = ${expr}`, 'log-parser');
                
                const assignTask = { expr: trimmedPrompt, var: varName };
                promptReport.assignTask = assignTask;
                finalAssignmentMap[varName] = { expr: expr, full: trimmedPrompt }; // "Last-one-wins"
            } 
            else if (match = trimmedPrompt.match(mathAndAssignmentRegex)) {
                // This prompt is "math [space] assignment"
                const mathPart = match[1].trim();
                const assignmentPart = match[2].trim();
                
                this.log(`Parser: Found [Math Task] -> ${mathPart}`, 'log-parser');
                promptReport.mathTask = { expr: mathPart };
                
                // Now parse the assignment part
                const assignMatch = assignmentPart.match(assignmentRegex);
                if (assignMatch) {
                    const varName = assignMatch[1].trim();
                    const expr = assignMatch[2].trim();
                    this.log(`Parser: Found [Assignment] -> ${varName} = ${expr}`, 'log-parser');

                    const assignTask = { expr: assignmentPart, var: varName };
                    promptReport.assignTask = assignTask;
                    finalAssignmentMap[varName] = { expr: expr, full: assignmentPart }; // "Last-one-wins"
                }
            } 
            else {
                // No match, assume it's a pure math prompt
                this.log(`Parser: Found [Math Task] -> ${trimmedPrompt}`, 'log-parser');
                promptReport.mathTask = { expr: trimmedPrompt };
            }
            
            allPromptsInOrder.push(promptReport); // Add the "receipt" to the main list
        }
        this.log(`>> Pass 1 Complete. ${allPromptsInOrder.length} prompts parsed. ${Object.keys(finalAssignmentMap).length} final assignments identified.`, 'log-reflex');


        // --- PASS 2: Reflex (Buoyancy / Dependency Sort) ---
        this.log('Engaging REFLEX (Δr) - Pass 2: Building dependency graph...', 'log-reflex');
        
        let nodes = {}; // This will be our dependency graph
        
        // 1. Build the graph
        for (const [varName, task] of Object.entries(finalAssignmentMap)) {
            let dependencies = [];
            try {
                // Find all symbols in the expression
                dependencies = math.parse(task.expr)
                    .filter(n => n.isSymbolNode)
                    .map(n => n.name)
                    // Filter out base functions (like 'sqrt')
                    .filter(d => !this.baseMathFunctions.has(d)); 
            } catch (e) {
                this.log(`Parser error in '${task.full}': ${e.message}`, 'log-error');
            }
            
            nodes[varName] = { 
                var: varName,
                expr: task.full, // The full assignment string (e.g., "e=p")
                // A dependency is any symbol that is ALSO in the assignment map
                deps: dependencies.filter(d => finalAssignmentMap.hasOwnProperty(d))
            };
        }
        this.log(`Graph built. Nodes: ${Object.keys(nodes).join(', ')}`, 'log-parser');

        // 2. Topologically sort the graph (the "Buoyancy" re-ordering)
        const sortedAssignmentList = [];
        let i = 0;
        let maxIterations = Object.keys(nodes).length + 1;

        while (Object.keys(nodes).length > 0 && i < maxIterations) {
            let readyToSolve = [];
            
            for (const [varName, node] of Object.entries(nodes)) {
                if (node.deps.length === 0) {
                    readyToSolve.push(varName);
                }
            }

            if (readyToSolve.length === 0) {
                this.log(`Circular dependency detected! Unresolved: ${Object.keys(nodes).join(', ')}`, 'log-error');
                // Add remaining nodes to be executed anyway, they will fail and report error
                Object.values(nodes).forEach(node => sortedAssignmentList.push(node.expr));
                break;
            }

            for (const varName of readyToSolve) {
                const node = nodes[varName];
                sortedAssignmentList.push(node.expr); // Add e.g., "p=sqrt(4)"
                delete nodes[varName]; // Remove from graph
                
                // Go through remaining nodes and remove this var from their dependencies
                for (const otherNode of Object.values(nodes)) {
                    otherNode.deps = otherNode.deps.filter(d => d !== varName);
                }
            }
            i++;
        }

        this.log(`>> Pass 2 Complete. Execution order solved: [${sortedAssignmentList.join('; ')}]`, 'log-reflex');


        // --- PASS 3: Performance (Execute) ---
        // This is the "inner LEATR tube" executing the grouped task list
        this.log('Attempting to achieve PERFORMANCE (Δp)...', 'log-performance');
        this.log('Performance: Executing sorted assignments to build final context...', 'log-performance');
        
        for (const expr of sortedAssignmentList) {
            const assignResult = leadEdgeExecutor.mathEngine.execute(expr, this.mathParser);
            if (typeof assignResult === 'string' && assignResult.startsWith('Math.js Error:')) {
                this.log(`Assignment Error: ${assignResult}`, 'log-error');
            } else {
                this.log(`Assignment processed: ${expr}`, 'log-parser');
            }
        }
        this.log('Performance: Final context built.', 'log-performance');

        // --- PASS 4: Report (Solve & Respond) ---
        // Now we go back to the *original* prompt order and solve/report
        // using the final context built in Pass 3.
        this.log('Performance: Generating report for each prompt...', 'log-performance');
        const allBatchResults = [];
        for (const promptReport of allPromptsInOrder) {
            const promptOutputs = []; // Collects all output lines for this *single* prompt
            
            // 1. Solve Math Task (if it exists)
            if (promptReport.mathTask) {
                const mathResult = leadEdgeExecutor.mathEngine.execute(promptReport.mathTask.expr, this.mathParser);
                let resultString;
                
                if (typeof mathResult === 'string' && mathResult.startsWith('Math.js Error:')) {
                    this.log(`Math Error: ${mathResult}`, 'log-error');
                    resultString = `<strong>${mathResult}</strong>`;
                } else if (mathResult === undefined || typeof mathResult === 'function') {
                    resultString = `(Expression processed, no numerical output)`;
                } else {
                    resultString = `${promptReport.mathTask.expr} = <strong>${mathResult}</strong>`;
                }
                promptOutputs.push(resultString);
            }

            // 2. Report on Assignment Task (if it exists)
            if (promptReport.assignTask) {
                const varName = promptReport.assignTask.var;
                try {
                    let value = this.mathParser.get(varName); // Get its FINAL value
                    
                    if (typeof value === 'function') {
                        promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> (Function Defined)`);
                    } else {
                        // Show the original assignment and its FINAL value
                        promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> ➔ <strong>${varName} = ${value}</strong>`);
                    }
                } catch (e) {
                    promptOutputs.push(`<code>${promptReport.assignTask.expr}</code> (Assignment Error)`);
                }
            }

            // 3. Solve Text Task (if it exists)
            if (promptReport.textTask) {
                const textResult = leadEdgeExecutor.textEngine.analyze(promptReport.textTask.expr);
                promptOutputs.push(textResult);
            }

            // Combine all outputs for this prompt into a single report block
            if (promptOutputs.length > 0) {
                allBatchResults.push(
                    `<div class="prompt-report">
                        <span class="prompt-original-text">Prompt: "${promptReport.original}"</span>
                        ${promptOutputs.join('<br>')}
                    </div>`
                );
            }
        }

        this.log('>> PERFORMANCE Achieved. (p=1)', 'log-performance');
        
        if (allBatchResults.length === 0) {
            return "Batch processed. No math or text tasks were found to display.";
        }
        return allBatchResults.join(''); // Join without <hr> since we use divs
    }
}

function updateSubmitButtonState() {
    const promptRows = ui.promptsContainer.querySelectorAll('.prompt-row');
    if (promptRows.length === 0) { ui.submitAllBtn.disabled = true; return; }
    const allReady = Array.from(promptRows).every(row => row.querySelector('input[type="checkbox"]').checked);
    ui.submitAllBtn.disabled = !allReady;
}

// Modified to accept text and checked status
function addPrompt(text = '', checked = false) {
    const row = document.createElement('div'); row.className = 'prompt-row';
    const checkbox = document.createElement('input'); 
    checkbox.type = 'checkbox'; 
    checkbox.title = 'Ready to Submit'; 
    checkbox.checked = checked; // Set checked status
    checkbox.addEventListener('change', updateSubmitButtonState);
    
    const input = document.createElement('input'); 
    input.type = 'text'; 
    input.placeholder = 'Enter math, assign, or term...';
    input.value = text; // Set text value
    
    // Add event listeners for focus/blur to manage activePromptInput
    input.addEventListener('focus', (event) => {
        activePromptInput = event.target;
        // Optionally, highlight the active prompt row
        event.target.closest('.prompt-row').style.outline = '2px solid var(--accent-color)';
    });
    input.addEventListener('blur', (event) => {
        // Only clear if another input isn't immediately focused.
        // A small delay allows clicks on calculator buttons to register before clearing.
        setTimeout(() => {
            if (document.activeElement && document.activeElement.closest('#floating-calculator')) {
                // If a calculator button is clicked, don't clear activePromptInput yet
            } else {
                activePromptInput = null;
            }
        }, 50);
        event.target.closest('.prompt-row').style.outline = 'none';
    });


    const removeBtn = document.createElement('button'); 
    removeBtn.className = 'remove-prompt-btn'; 
    removeBtn.innerHTML = '&times;'; 
    removeBtn.title = 'Remove this prompt';
    removeBtn.onclick = () => { row.remove(); updateSubmitButtonState(); };
    
    row.appendChild(checkbox); 
    row.appendChild(input); 
    row.appendChild(removeBtn);
    ui.promptsContainer.appendChild(row);
    updateSubmitButtonState();

    // Set the newly added input as active, and focus it
    activePromptInput = input;
    input.focus();
}

// --- UPDATE: This function now calls the new processBatch method ---
function submitAllPrompts() {
    const promptInputs = ui.promptsContainer.querySelectorAll('input[type="text"]');
    if (promptInputs.length === 0) return;
    
    const allPromptTexts = [];
    // Get text only from *checked* prompts, IN ORDER
    ui.promptsContainer.querySelectorAll('.prompt-row').forEach(row => {
        if (row.querySelector('input[type="checkbox"]').checked) {
            const text = row.querySelector('input[type="text"]').value.trim();
            if (text.length > 0) {
                allPromptTexts.push(text);
            }
        }
    });

    if (allPromptTexts.length === 0) return;
    
    // 1. Display the user's batch message
    const userMessage = document.createElement('div'); 
    userMessage.className = 'message user-message';
    let userMessageHTML = '<strong>Submitted Batch:</strong><ul>';
    allPromptTexts.forEach(text => { userMessageHTML += `<li>${text}</li>`; });
    userMessageHTML += '</ul>';
    userMessage.innerHTML = userMessageHTML;
    ui.chatWindow.appendChild(userMessage);

    // 2. Call the new 4-Pass Batch processor
    // This single call will clear the log, reset the parser, and run all 4 passes.
    const botResponse = buoyancyNode.processBatch(allPromptTexts);

    // 3. Combine all results into one bot message
    const botMessage = document.createElement('div'); 
    botMessage.className = 'message bot-message';
    botMessage.innerHTML = botResponse;
    
    if (botMessage.innerHTML.trim() === '') {
         botMessage.innerHTML = "Batch processed, but no output was generated.";
    }
    
    ui.chatWindow.appendChild(botMessage);
    ui.chatWindow.scrollTop = ui.chatWindow.scrollHeight;
}

function openMathSolver() {
    modalVariableContexts = {}; 
    ui.algebraicEquationInput.value = ''; 
    ui.variableValueInput.value = '';
    updateVariableSelector(); 
    updateAssignedContextsDisplay(); 
    ui.mathCalculatorOverlay.style.display = 'flex';
}

function closeMathSolver() {
    ui.mathCalculatorOverlay.style.display = 'none';
}

function updateVariableSelector() {
    const equation = ui.algebraicEquationInput.value;
    const variables = [...new Set(equation.match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [])];
    const currentSelection = ui.variableSelectDropdown.value;

    ui.variableSelectDropdown.innerHTML = '<option value="">-- Select Variable --</option>';
    variables.forEach(v => {
        const option = document.createElement('option');
        option.value = v;
        option.textContent = v + (modalVariableContexts[v] ? ' ✓' : ''); 
        ui.variableSelectDropdown.appendChild(option);
    });
    if (variables.includes(currentSelection)) {
         ui.variableSelectDropdown.value = currentSelection;
    }
}

function assignVariableContext() {
    const selectedVar = ui.variableSelectDropdown.value;
    if (!selectedVar) { alert('Please select a variable first.'); return; }
    if (!modalVariableContexts[selectedVar]) {
         modalVariableContexts[selectedVar] = {};
    }
    
    if (ui.specialOperatorDropdown.value) modalVariableContexts[selectedVar].specialOperator = ui.specialOperatorDropdown.value;
    if (ui.physicsFieldDropdown.value) modalVariableContexts[selectedVar].physicsField = ui.physicsFieldDropdown.value;
    if (ui.mathOperationDropdown.value) modalVariableContexts[selectedVar].mathOperation = ui.mathOperationDropdown.value;

    updateAssignedContextsDisplay();
    updateVariableSelector(); 

    ui.specialOperatorDropdown.value = '';
    ui.physicsFieldDropdown.value = '';
    ui.mathOperationDropdown.value = '';
}

function clearVariableContext() {
    const selectedVar = ui.variableSelectDropdown.value;
    if (!selectedVar) return; 
    delete modalVariableContexts[selectedVar];
    updateAssignedContextsDisplay();
    updateVariableSelector();
    ui.variableValueInput.value = '';
    ui.specialOperatorDropdown.value = '';
    ui.physicsFieldDropdown.value = '';
    ui.mathOperationDropdown.value = '';
}

function updateAssignedContextsDisplay() {
    let contextHtml = Object.entries(modalVariableContexts).map(([variableName, context]) => {
        const valueDisplay = context.value ? `: <code>${context.value}</code>` : '';
        const contextParts = [context.specialOperator, context.physicsField, context.mathOperation].filter(Boolean).map(term => {
             const definition = leadEdgeExecutor.mathGlossary[term] || 'Definition...';
             return `<abbr title="${definition}">${term}</abbr>`;
         }).join(', ');

        return `<b>${variableName}</b>${valueDisplay} (${contextParts || 'No context'})`;
    }).join('<br>');
    ui.assignedContextsDisplay.innerHTML = contextHtml || 'No contexts assigned yet.';
}

function addModalDataToBatch() {
    const equation = ui.algebraicEquationInput.value.trim();
    
    if (equation) {
        addPrompt(equation, true); 
    }
    
    let termsToDefine = new Set();
    
    for (const [variableName, context] of Object.entries(modalVariableContexts)) {
        if (context.value) {
            addPrompt(`${variableName}=${context.value}`, true);
        }
        if (context.specialOperator) termsToDefine.add(context.specialOperator);
        if (context.physicsField) termsToDefine.add(context.physicsField);
        if (context.mathOperation) termsToDefine.add(context.mathOperation);
    }
    
    termsToDefine.forEach(term => {
        addPrompt(term, true);
    });
    
    closeMathSolver(); 
}

// --- FLOATING CALCULATOR LOGIC (NEW) ---
function handleCalculatorInput(value) {
    if (!activePromptInput) {
        // If no prompt is active, try to focus the last prompt or create a new one
        const promptInputs = ui.promptsContainer.querySelectorAll('input[type="text"]');
        if (promptInputs.length > 0) {
            activePromptInput = promptInputs[promptInputs.length - 1];
            activePromptInput.focus();
        } else {
            addPrompt(); // Create a new prompt
            activePromptInput = ui.promptsContainer.querySelector('input[type="text"]:last-child');
            activePromptInput.focus();
        }
    }

    const start = activePromptInput.selectionStart;
    const end = activePromptInput.selectionEnd;
    const currentValue = activePromptInput.value;
    let newValue = currentValue;
    let cursorPosition = start;

    switch (value) {
        case 'AC': // All Clear
            newValue = '';
            cursorPosition = 0;
            break;
        case 'DEL': // Delete (BackSpace) - if we had a DEL button
            if (start > 0) {
                newValue = currentValue.substring(0, start - 1) + currentValue.substring(end);
                cursorPosition = start - 1;
            }
            break;
        case 'sqrt':
            newValue = currentValue.substring(0, start) + 'sqrt()' + currentValue.substring(end);
            cursorPosition = start + 5; // Place cursor inside parentheses
            break;
        case 'sin': case 'cos': case 'tan': case 'log': case 'ln':
            newValue = currentValue.substring(0, start) + value + '()' + currentValue.substring(end);
            cursorPosition = start + value.length + 1; // Place cursor inside parentheses
            break;
        case 'pi':
            newValue = currentValue.substring(0, start) + 'pi' + currentValue.substring(end);
            cursorPosition = start + 2;
            break;
        case 'e':
            newValue = currentValue.substring(0, start) + 'e' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        case 'Ans': // For a potential 'Ans' functionality (not implemented in Math.js directly)
            // For now, let's just insert 'Ans' as a placeholder
            newValue = currentValue.substring(0, start) + 'Ans' + currentValue.substring(end);
            cursorPosition = start + 3;
            break;
        case '÷':
            newValue = currentValue.substring(0, start) + '/' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        case '×':
            newValue = currentValue.substring(0, start) + '*' + currentValue.substring(end);
            cursorPosition = start + 1;
            break;
        default:
            newValue = currentValue.substring(0, start) + value + currentValue.substring(end);
            cursorPosition = start + value.length;
            break;
    }

    activePromptInput.value = newValue;
    activePromptInput.setSelectionRange(cursorPosition, cursorPosition);
    activePromptInput.focus(); // Re-focus to maintain active state
}
