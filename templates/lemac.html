<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radical Deepscale: Algebraic Maze Solver</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00ffcc;
            max-width: 300px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid #ff0055;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 220px;
            z-index: 10;
        }

        .control-group { display: flex; justify-content: space-between; align-items: center; }
        label { margin-right: 10px; font-size: 12px; }
        input[type=range] { width: 100px; }
        input[type=checkbox] { transform: scale(1.5); accent-color: #ff0055; }

        button {
            background: #ff0055; color: white; border: none; padding: 10px; 
            cursor: pointer; font-weight: bold; margin-top: 5px;
            text-transform: uppercase; letter-spacing: 1px;
            transition: background 0.2s;
            font-size: 11px;
        }
        button:hover { background: #ff4477; }
        
        .divider { border-bottom: 1px solid #444; margin: 5px 0; }
        .status { font-size: 11px; color: #aaa; margin-top: 5px; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info">
        <h3>Lead Edge Maze Ash</h3>
        <p>Method: <strong>Algebraic Byproduct</strong></p>
        <p>Logic: (Maze Perimeter) - (Dead Ends) = Solution Path</p>
        <div class="status" id="statusText">Initializing...</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Width (X)</label>
            <input type="range" id="widthSlider" min="5" max="50" value="20">
        </div>
        <div class="control-group">
            <label>Height (Y)</label>
            <input type="range" id="heightSlider" min="5" max="50" value="20">
        </div>
        <div class="control-group">
            <label>Unit Size</label>
            <input type="range" id="scaleSlider" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>
        
        <button id="btnGenerate">Generate Structure</button>
        
        <div class="divider"></div>

        <div class="control-group">
            <label for="chkInstant">Instant Solve</label>
            <input type="checkbox" id="chkInstant">
        </div>
        <button id="btnSolve">Calculate Path</button>
        
        <div class="divider"></div>

        <button id="btnExportGLB">Export Scene (.GLB)</button>
        <button id="btnExportPNG">Export 4K Image</button>
        
        <div class="divider"></div>
        
        <button id="btnInfoCard">Download Math Info Card</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

        // ------------------------------------------------------------------
        // GLOBAL STATE
        // ------------------------------------------------------------------
        let scene, camera, renderer, controls;
        let mazeGroup, solutionGroup, markersGroup, masterGroup;
        
        let isAnimating = false;
        let animationQueue = [];
        let animationSpeed = 2; 

        let MAZE_STATE = {
            width: 20,
            height: 20,
            unitSize: 1.0,
            wallHeight: 1.5,
            grid: [],
            start: {x:0, y:0},
            end: {x:0, y:0}
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.002); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
            camera.position.set(0, 30, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; 
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 3);
            dirLight.position.set(50, 200, 100); 
            dirLight.castShadow = true; 

            const d = 500; 
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.far = 1000; 
            dirLight.shadow.bias = -0.0005;
            dirLight.shadow.mapSize.width = 4096;
            dirLight.shadow.mapSize.height = 4096;
            scene.add(dirLight);

            // Create Groups
            mazeGroup = new THREE.Group();
            solutionGroup = new THREE.Group();
            markersGroup = new THREE.Group();
            
            masterGroup = new THREE.Group();
            masterGroup.name = "RadicalMaze";
            masterGroup.add(mazeGroup);
            masterGroup.add(solutionGroup);
            masterGroup.add(markersGroup);
            scene.add(masterGroup);

            // Listeners
            document.getElementById('btnGenerate').addEventListener('click', generateMaze);
            document.getElementById('btnSolve').addEventListener('click', solveAlgebraic);
            document.getElementById('btnExportGLB').addEventListener('click', exportGLB_Baked);
            document.getElementById('btnExportPNG').addEventListener('click', export4KPNG);
            document.getElementById('btnInfoCard').addEventListener('click', downloadInfoCard);
            
            ['widthSlider', 'heightSlider', 'scaleSlider'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateSettings);
            });

            generateMaze();
        }

        function updateSettings() {
            MAZE_STATE.width = parseInt(document.getElementById('widthSlider').value);
            MAZE_STATE.height = parseInt(document.getElementById('heightSlider').value);
            MAZE_STATE.unitSize = parseFloat(document.getElementById('scaleSlider').value);
        }

        // ------------------------------------------------------------------
        // MAZE GENERATION
        // ------------------------------------------------------------------
        function generateMaze() {
            document.getElementById('statusText').innerText = "Constructing Perimeters...";
            isAnimating = false;
            
            [mazeGroup, solutionGroup, markersGroup].forEach(g => {
                while(g.children.length > 0){ 
                    if(g.children[0].geometry) g.children[0].geometry.dispose();
                    if(g.children[0].material) g.children[0].material.dispose();
                    g.remove(g.children[0]); 
                }
            });

            const w = MAZE_STATE.width;
            const h = MAZE_STATE.height;
            
            MAZE_STATE.grid = [];
            for(let y=0; y<h; y++) {
                let row = [];
                for(let x=0; x<w; x++) {
                    row.push({ top: true, right: true, bottom: true, left: true, visited: false });
                }
                MAZE_STATE.grid.push(row);
            }

            let stack = [];
            let current = { x: Math.floor(Math.random() * w), y: Math.floor(Math.random() * h) };
            MAZE_STATE.grid[current.y][current.x].visited = true;
            stack.push(current);

            while(stack.length > 0) {
                let cell = stack[stack.length - 1];
                let neighbors = getUnvisitedNeighbors(cell.x, cell.y, w, h);

                if(neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    removeWalls(cell, next);
                    MAZE_STATE.grid[next.y][next.x].visited = true;
                    stack.push(next);
                } else {
                    stack.pop();
                }
            }

            MAZE_STATE.start = { x: 0, y: 0 };
            MAZE_STATE.end = { x: w-1, y: h-1 };
            MAZE_STATE.grid[0][0].left = false; 
            MAZE_STATE.grid[h-1][w-1].right = false; 

            drawMazeGeometry();
            drawMarkers();
            document.getElementById('statusText').innerText = "Maze Constructed.";
        }

        function getUnvisitedNeighbors(x, y, w, h) {
            let n = [];
            if(y > 0 && !MAZE_STATE.grid[y-1][x].visited) n.push({x:x, y:y-1, dir:'top'});
            if(x < w-1 && !MAZE_STATE.grid[y][x+1].visited) n.push({x:x+1, y:y, dir:'right'});
            if(y < h-1 && !MAZE_STATE.grid[y+1][x].visited) n.push({x:x, y:y+1, dir:'bottom'});
            if(x > 0 && !MAZE_STATE.grid[y][x-1].visited) n.push({x:x-1, y:y, dir:'left'});
            return n;
        }

        function removeWalls(a, b) {
            let xDiff = a.x - b.x;
            let yDiff = a.y - b.y;
            if(xDiff === 1) { MAZE_STATE.grid[a.y][a.x].left = false; MAZE_STATE.grid[b.y][b.x].right = false; }
            else if (xDiff === -1) { MAZE_STATE.grid[a.y][a.x].right = false; MAZE_STATE.grid[b.y][b.x].left = false; }
            else if (yDiff === 1) { MAZE_STATE.grid[a.y][a.x].top = false; MAZE_STATE.grid[b.y][b.x].bottom = false; }
            else if (yDiff === -1) { MAZE_STATE.grid[a.y][a.x].bottom = false; MAZE_STATE.grid[b.y][b.x].top = false; }
        }

        function drawMazeGeometry() {
            const wallGeo = new THREE.BoxGeometry(MAZE_STATE.unitSize, MAZE_STATE.wallHeight, MAZE_STATE.unitSize * 0.1);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const instancedMesh = new THREE.InstancedMesh(wallGeo, wallMat, MAZE_STATE.width * MAZE_STATE.height * 4);
            
            let i = 0;
            const dummy = new THREE.Object3D();
            const offset = (MAZE_STATE.width * MAZE_STATE.unitSize) / 2;
            const u = MAZE_STATE.unitSize;

            for(let y=0; y<MAZE_STATE.height; y++) {
                for(let x=0; x<MAZE_STATE.width; x++) {
                    let cell = MAZE_STATE.grid[y][x];
                    let cx = (x * u) - offset + (u/2);
                    let cz = (y * u) - offset + (u/2);

                    if(cell.top) { dummy.position.set(cx, 0, cz - u/2); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); instancedMesh.setMatrixAt(i++, dummy.matrix); }
                    if(cell.bottom) { dummy.position.set(cx, 0, cz + u/2); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); instancedMesh.setMatrixAt(i++, dummy.matrix); }
                    if(cell.left) { dummy.position.set(cx - u/2, 0, cz); dummy.rotation.set(0, Math.PI/2, 0); dummy.updateMatrix(); instancedMesh.setMatrixAt(i++, dummy.matrix); }
                    if(cell.right) { dummy.position.set(cx + u/2, 0, cz); dummy.rotation.set(0, Math.PI/2, 0); dummy.updateMatrix(); instancedMesh.setMatrixAt(i++, dummy.matrix); }
                }
            }
            instancedMesh.count = i;
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.castShadow = true;
            instancedMesh.receiveShadow = true;
            mazeGroup.add(instancedMesh);
        }

        function drawMarkers() {
            const u = MAZE_STATE.unitSize;
            const offset = (MAZE_STATE.width * MAZE_STATE.unitSize) / 2;
            const markerGeo = new THREE.BoxGeometry(u*0.8, 0.1, u*0.8);
            
            const startMesh = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({color: 0x0088ff, emissive: 0x0044aa, roughness: 0.2}));
            startMesh.position.set((MAZE_STATE.start.x * u) - offset + u/2, 0.05, (MAZE_STATE.start.y * u) - offset + u/2);
            
            const endMesh = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({color: 0x9900ff, emissive: 0x5500aa, roughness: 0.2}));
            endMesh.position.set((MAZE_STATE.end.x * u) - offset + u/2, 0.05, (MAZE_STATE.end.y * u) - offset + u/2);

            markersGroup.add(startMesh);
            markersGroup.add(endMesh);
        }

        function solveAlgebraic() {
            document.getElementById('statusText').innerText = "Running Dead End Division...";
            while(solutionGroup.children.length > 0){ 
                solutionGroup.children[0].geometry.dispose();
                solutionGroup.children[0].material.dispose();
                solutionGroup.remove(solutionGroup.children[0]); 
            }

            const w = MAZE_STATE.width;
            const h = MAZE_STATE.height;
            let solutionMap = Array(h).fill().map(() => Array(w).fill(0));
            let counts = Array(h).fill().map(() => Array(w).fill(0));

            for(let y=0; y<h; y++) {
                for(let x=0; x<w; x++) {
                    let exits = 0;
                    if(!MAZE_STATE.grid[y][x].top) exits++;
                    if(!MAZE_STATE.grid[y][x].bottom) exits++;
                    if(!MAZE_STATE.grid[y][x].left) exits++;
                    if(!MAZE_STATE.grid[y][x].right) exits++;
                    counts[y][x] = exits;
                }
            }

            counts[MAZE_STATE.start.y][MAZE_STATE.start.x] += 10;
            counts[MAZE_STATE.end.y][MAZE_STATE.end.x] += 10;

            let changed = true;
            while(changed) {
                changed = false;
                for(let y=0; y<h; y++) {
                    for(let x=0; x<w; x++) {
                        if(solutionMap[y][x] === 0 && counts[y][x] === 1) {
                            solutionMap[y][x] = 1; 
                            changed = true;
                            if(!MAZE_STATE.grid[y][x].top && y > 0) counts[y-1][x]--;
                            if(!MAZE_STATE.grid[y][x].bottom && y < h-1) counts[y+1][x]--;
                            if(!MAZE_STATE.grid[y][x].left && x > 0) counts[y][x-1]--;
                            if(!MAZE_STATE.grid[y][x].right && x < w-1) counts[y][x+1]--;
                        }
                    }
                }
            }

            let orderedPath = [];
            let visitedPath = new Set();
            let stack = [MAZE_STATE.start];
            
            while(stack.length > 0) {
                let curr = stack.pop();
                let key = curr.x + "," + curr.y;
                if(visitedPath.has(key)) continue;
                
                visitedPath.add(key);
                orderedPath.push(curr);

                if(curr.x === MAZE_STATE.end.x && curr.y === MAZE_STATE.end.y) break;

                let ns = [];
                if(curr.y > 0 && !MAZE_STATE.grid[curr.y][curr.x].top && solutionMap[curr.y-1][curr.x] === 0) ns.push({x:curr.x, y:curr.y-1});
                if(curr.y < h-1 && !MAZE_STATE.grid[curr.y][curr.x].bottom && solutionMap[curr.y+1][curr.x] === 0) ns.push({x:curr.x, y:curr.y+1});
                if(curr.x > 0 && !MAZE_STATE.grid[curr.y][curr.x].left && solutionMap[curr.y][curr.x-1] === 0) ns.push({x:curr.x-1, y:curr.y});
                if(curr.x < w-1 && !MAZE_STATE.grid[curr.y][curr.x].right && solutionMap[curr.y][curr.x+1] === 0) ns.push({x:curr.x+1, y:curr.y});
                
                for(let n of ns) stack.push(n);
            }

            const isInstant = document.getElementById('chkInstant').checked;
            
            if(isInstant) {
                drawPathInstant(orderedPath);
                document.getElementById('statusText').innerText = "Path Calculated (Instant).";
            } else {
                animationQueue = orderedPath;
                isAnimating = true;
                document.getElementById('statusText').innerText = "Animating Solution...";
            }
        }

        function drawPathInstant(pathList) {
            const u = MAZE_STATE.unitSize;
            const offset = (MAZE_STATE.width * u) / 2;
            const pathGeo = new THREE.BoxGeometry(u*0.6, MAZE_STATE.wallHeight * 0.5, u*0.6);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, emissive: 0x0044aa, roughness: 0.2 });
            const instanced = new THREE.InstancedMesh(pathGeo, pathMat, pathList.length);
            
            const dummy = new THREE.Object3D();
            pathList.forEach((pos, i) => {
                let cx = (pos.x * u) - offset + (u/2);
                let cz = (pos.y * u) - offset + (u/2);
                dummy.position.set(cx, MAZE_STATE.wallHeight * 0.25, cz);
                dummy.updateMatrix();
                instanced.setMatrixAt(i, dummy.matrix);
            });
            
            instanced.instanceMatrix.needsUpdate = true;
            solutionGroup.add(instanced);
        }

        function animatePathStep() {
            if(animationQueue.length === 0) {
                isAnimating = false;
                document.getElementById('statusText').innerText = "Animation Complete.";
                return;
            }

            const u = MAZE_STATE.unitSize;
            const offset = (MAZE_STATE.width * u) / 2;
            const pathGeo = new THREE.BoxGeometry(u*0.6, MAZE_STATE.wallHeight * 0.5, u*0.6);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, emissive: 0x0044aa, roughness: 0.2 });

            for(let k=0; k<animationSpeed; k++) {
                if(animationQueue.length === 0) break;
                let pos = animationQueue.shift();
                
                let mesh = new THREE.Mesh(pathGeo, pathMat);
                let cx = (pos.x * u) - offset + (u/2);
                let cz = (pos.y * u) - offset + (u/2);
                mesh.position.set(cx, MAZE_STATE.wallHeight * 0.25, cz);
                solutionGroup.add(mesh);
            }
        }

        // ------------------------------------------------------------------
        // BAKED GLB EXPORT (Fix for Nomad/Blender)
        // ------------------------------------------------------------------
        function exportGLB_Baked() {
            document.getElementById('statusText').innerText = "Baking Geometry...";

            // Create a dedicated scene for export so we don't mess up the view
            const exportScene = new THREE.Scene();

            // 1. BAKE WALLS
            // Find the wall instanced mesh
            let wallInstancedMesh = null;
            mazeGroup.traverse(c => { if(c.isInstancedMesh) wallInstancedMesh = c; });

            if(wallInstancedMesh) {
                const count = wallInstancedMesh.count;
                const dummy = new THREE.Object3D();
                const geometries = [];

                for(let i=0; i<count; i++) {
                    wallInstancedMesh.getMatrixAt(i, dummy.matrix);
                    dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
                    
                    const cloneGeo = wallInstancedMesh.geometry.clone();
                    cloneGeo.applyMatrix4(dummy.matrix);
                    geometries.push(cloneGeo);
                }

                if(geometries.length > 0) {
                    const mergedGeo = BufferGeometryUtils.mergeGeometries(geometries);
                    const mergedMesh = new THREE.Mesh(mergedGeo, wallInstancedMesh.material);
                    mergedMesh.name = "Maze_Walls";
                    exportScene.add(mergedMesh);
                }
            }

            // 2. BAKE PATH
            // The path might be an InstancedMesh (Instant) or individual Meshes (Animated)
            const pathGeometries = [];
            let pathMaterial = null;

            solutionGroup.traverse(c => {
                if(c.isInstancedMesh) {
                    pathMaterial = c.material;
                    const count = c.count;
                    const dummy = new THREE.Object3D();
                    for(let i=0; i<count; i++) {
                        c.getMatrixAt(i, dummy.matrix);
                        const cloneGeo = c.geometry.clone();
                        cloneGeo.applyMatrix4(dummy.matrix);
                        pathGeometries.push(cloneGeo);
                    }
                } else if (c.isMesh) {
                    pathMaterial = c.material;
                    const cloneGeo = c.geometry.clone();
                    c.updateMatrixWorld();
                    cloneGeo.applyMatrix4(c.matrixWorld);
                    pathGeometries.push(cloneGeo);
                }
            });

            if(pathGeometries.length > 0 && pathMaterial) {
                const mergedPathGeo = BufferGeometryUtils.mergeGeometries(pathGeometries);
                const mergedPathMesh = new THREE.Mesh(mergedPathGeo, pathMaterial);
                mergedPathMesh.name = "Solution_Path";
                exportScene.add(mergedPathMesh);
            }

            // 3. ADD MARKERS (Already simple meshes)
            markersGroup.traverse(c => {
                if(c.isMesh) {
                    const clone = c.clone();
                    exportScene.add(clone);
                }
            });

            // 4. EXPORT
            const exporter = new GLTFExporter();
            exporter.parse(
                exportScene,
                function ( result ) {
                    const blob = new Blob( [ result ], { type: 'application/octet-stream' } );
                    const url = URL.createObjectURL( blob );
                    const link = document.createElement( 'a' );
                    link.style.display = 'none';
                    link.href = url;
                    link.download = 'radical_maze_baked.glb';
                    document.body.appendChild( link );
                    link.click();
                    document.body.removeChild( link );
                    document.getElementById('statusText').innerText = "Baked GLB Exported.";
                },
                function ( error ) {
                    console.error('GLB Error:', error);
                    document.getElementById('statusText').innerText = "Export Failed.";
                },
                { binary: true }
            );
        }

        function export4KPNG() {
            document.getElementById('statusText').innerText = "Rendering 4K Image...";
            const width = 4096;
            const height = 4096;

            const offscreenRenderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                preserveDrawingBuffer: true,
                alpha: true
            });
            
            offscreenRenderer.setSize(width, height);
            offscreenRenderer.setPixelRatio(1);
            
            const originalAspect = camera.aspect;
            camera.aspect = 1.0;
            camera.updateProjectionMatrix();

            offscreenRenderer.render(scene, camera);
            const dataURL = offscreenRenderer.domElement.toDataURL('image/png');

            const link = document.createElement('a');
            link.download = 'radical_maze_4k.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            offscreenRenderer.dispose();
            camera.aspect = originalAspect;
            camera.updateProjectionMatrix();
            document.getElementById('statusText').innerText = "4K Export Complete.";
        }

        // ------------------------------------------------------------------
        // NEW FUNCTION: DOWNLOAD INFO CARD (Integrated from info.html)
        // ------------------------------------------------------------------
        function downloadInfoCard() {
            document.getElementById('statusText').innerText = "Generating Math Card...";
            
            // Create in-memory canvas
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // 1. Background
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, 1920, 1080);

            // 2. Borders (Cyan & Pink Accents)
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(0, 255, 204, 0.5)"; // Cyan
            ctx.strokeRect(40, 40, 1840, 1000);
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(255, 0, 85, 0.3)"; // Pink
            ctx.strokeRect(50, 50, 1820, 980);

            // 3. Fonts Setup
            const fontMono = "Courier New, monospace";

            // 4. Header
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 60px " + fontMono;
            ctx.fillText("LEAD EDGE MAZE ASH CREATOR", 100, 150);
            
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(100, 180);
            ctx.lineTo(1820, 180);
            ctx.stroke();

            // 5. Sub-Header
            ctx.font = "40px " + fontMono;
            ctx.fillStyle = "#cccccc";
            ctx.fillText("METHOD:", 100, 260);
            ctx.fillStyle = "#ff0055";
            ctx.fillText("Algebraic Byproduct", 280, 260);
            
            ctx.fillStyle = "#888888";
            ctx.font = "32px " + fontMono;
            ctx.fillText("LOGIC:  Iterative Pruning / Dead End Division", 100, 310);

            // 6. Equation Box
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(100, 380, 1720, 240);
            ctx.strokeStyle = "#333";
            ctx.strokeRect(100, 380, 1720, 240);

            // 7. The Equation
            ctx.fillStyle = "#ffffff";
            ctx.font = "50px " + fontMono;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const eq = "P = Ω - Σ { v ∈ Φ(Ω) | deg(v) = 1 ∧ v ∉ {S,E} }";
            ctx.fillText(eq, 1920/2, 380 + 120);
            
            // Limit label
            ctx.font = "30px " + fontMono;
            ctx.fillStyle = "#666";
            ctx.textAlign = "right";
            ctx.fillText("k=1..∞", 1800, 430);

            // 8. Legend Section
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 36px " + fontMono;
            ctx.fillText("VARIABLE LEGEND", 100, 700);

            // Legend Text
            ctx.font = "30px " + fontMono;
            const leftColX = 100;
            const rightColX = 1000;
            let yStart = 760;
            let lineH = 60;

            function drawVar(key, desc, x, y) {
                ctx.fillStyle = "#ffffff";
                ctx.fillText(key, x, y);
                const width = ctx.measureText(key).width;
                ctx.fillStyle = "#bbbbbb";
                ctx.fillText(desc, x + width + 20, y);
            }

            drawVar("P", ":: Solution Path (The Byproduct)", leftColX, yStart);
            drawVar("Ω", ":: Initial Maze (Total Set)", leftColX, yStart + lineH);
            drawVar("deg(v)=1", ":: Dead End Condition", leftColX, yStart + lineH*2);

            drawVar("Φ", ":: Recursive Pruning Operator", rightColX, yStart);
            drawVar("{S,E}", ":: Terminals (Protected)", rightColX, yStart + lineH);
            drawVar("Σ", ":: Sum of Removed Variables", rightColX, yStart + lineH*2);

            // 9. Footer
            ctx.fillStyle = "#444";
            ctx.font = "24px " + fontMono;
            ctx.textAlign = "right";
            ctx.fillText("ALGORITHM REFERENCE :: RADICAL DEEPSCALE", 1820, 1000);
            
            // 10. Trigger Download
            const link = document.createElement('a');
            link.download = 'Lead_Edge_InfoCard.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            document.getElementById('statusText').innerText = "Info Card Downloaded.";
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isAnimating) animatePathStep();
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
