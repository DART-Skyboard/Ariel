<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radical Deepscale: Hybrid Algebraic Solver</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00d9ff;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00d9ff;
            max-width: 300px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid #ff0055;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 240px;
            z-index: 10;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-group { display: flex; justify-content: space-between; align-items: center; }
        label { margin-right: 10px; font-size: 11px; text-transform: uppercase; color: #aaa; }
        
        /* Updated Input Styling for Number Inputs */
        input[type=number] { 
            width: 70px; 
            background: #111; 
            color: #00d9ff; 
            border: 1px solid #00d9ff; 
            padding: 4px; 
            font-family: 'Courier New';
            font-size: 12px;
        }
        
        input[type=checkbox] { transform: scale(1.5); accent-color: #ff0055; }
        
        select { 
            background: #111; 
            color: #00d9ff; 
            border: 1px solid #00d9ff; 
            padding: 5px; 
            cursor: pointer; 
            font-family: 'Courier New'; 
            font-size: 11px; 
            width: 100%;
            margin-top: 4px;
        }

        button {
            background: #ff0055; color: white; border: none; padding: 10px; 
            cursor: pointer; font-weight: bold; margin-top: 5px;
            text-transform: uppercase; letter-spacing: 1px;
            transition: background 0.2s;
            font-size: 11px;
        }
        button:hover { background: #ff4477; box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        
        .divider { border-bottom: 1px solid #444; margin: 5px 0; }
        .status { font-size: 11px; color: #00d9ff; margin-top: 5px; text-transform: uppercase; }
  
        #bgvid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -10;
            pointer-events: none;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <video id="bgvid" autoplay muted loop playsinline>
        <source src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/mbmg.mp4" type="video/mp4">
    </video>

    <div id="info">
        <h3>Lead Edge Maze Ash</h3>
        <p>Method: <strong>Algebraic Byproduct</strong></p>
        <p id="logicText">Logic: (Maze Perimeter) - (Dead Ends) = Solution Path</p>
        <div class="status" id="statusText">Initializing Logic Core...</div>
    </div>

    <div id="controls">
        <label>Structure Mode</label>
        <select id="modeSelect">
            <option value="planar">Planar (2D Grid)</option>
            <option value="cubic" selected>Cubic (3D Voxel)</option>
        </select>

        <label>Rendering Engine</label>
        <select id="renderEngine">
            <option value="reflective">Reflective Red (Default)</option>
            <option value="dither">Bayer Dithered</option>
        </select>

        <div class="divider"></div>

        <!-- Inputs swapped from Sliders to Numeric Fields -->
        <div class="control-group">
            <label>Width (X)</label>
            <input type="number" id="widthInput" value="20" min="1" step="1">
        </div>
        <div class="control-group">
            <label>Height (Y)</label>
            <input type="number" id="heightInput" value="20" min="1" step="1">
        </div>
        <div class="control-group" id="depthWrapper">
            <label>Depth (Z)</label>
            <input type="number" id="depthInput" value="20" min="1" step="1">
        </div>
        <div class="control-group">
            <label>Unit Size</label>
            <input type="number" id="scaleInput" value="1.0" min="0.01" max="50" step="0.1">
        </div>
        
        <button id="btnGenerate">Generate Structure</button>
        
        <div class="divider"></div>

        <div class="control-group">
            <label for="chkInstant">Instant Solve</label>
            <input type="checkbox" id="chkInstant">
        </div>
        <button id="btnSolve">Calculate Path</button>
        
        <div class="divider"></div>

        <button id="btnExportGLB">Export Grouped .GLB</button>
        <button id="btnExportPNG">Export 4K Transparent</button>
        
        <div class="divider"></div>
        
        <button id="btnInfoCard">Download Master Math Card</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

        let scene, camera, renderer, controls;
        let mazeGroup, solutionGroup, markersGroup, masterGroup;
        
        let isAnimating = false;
        let animationQueue = [];
        let animationSpeed = 2; 

        let MAZE_STATE = {
            mode: 'cubic',
            engine: 'reflective',
            width: 20,
            height: 20,
            depth: 20,
            unitSize: 1.0,
            wallHeight: 1.5,
            grid: [],
            start: null,
            end: null
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = null;
            scene.fog = new THREE.FogExp2(0x050505, 0.002); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(40, 40, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor( 0x000000, 0 ); 
            renderer.shadowMap.enabled = true; 
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // --- HIGH QUALITY 4-LIGHT SYSTEM ---
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
            keyLight.position.set(-30, 50, 60); 
            keyLight.castShadow = true;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x00d9ff, 2.5);
            fillLight.position.set(50, -30, 50);
            scene.add(fillLight);

            const backLight = new THREE.DirectionalLight(0xffd4a3, 4.0);
            backLight.position.set(-50, 30, -50);
            scene.add(backLight);

            const ambient = new THREE.AmbientLight(0x404040, 1.0); 
            scene.add(ambient);

            // Group Initialization
            mazeGroup = new THREE.Group();
            mazeGroup.name = "MAZE_PERIMETER_WALLS";
            
            solutionGroup = new THREE.Group();
            solutionGroup.name = "SOLUTION_PATH";
            
            markersGroup = new THREE.Group();
            markersGroup.name = "START_END_MARKERS";
            
            masterGroup = new THREE.Group();
            masterGroup.name = "LEAD_EDGE_ROOT";
            masterGroup.add(mazeGroup, solutionGroup, markersGroup);
            scene.add(masterGroup);

            // UI Callbacks
            document.getElementById('btnGenerate').addEventListener('click', generate);
            document.getElementById('btnSolve').addEventListener('click', solve);
            document.getElementById('btnExportGLB').addEventListener('click', exportGLB_Grouped);
            document.getElementById('btnExportPNG').addEventListener('click', export4KTransparent);
            document.getElementById('btnInfoCard').addEventListener('click', downloadMasterInfoCard);
            
            document.getElementById('modeSelect').addEventListener('change', (e) => {
                MAZE_STATE.mode = e.target.value;
                document.getElementById('depthWrapper').style.display = MAZE_STATE.mode === 'cubic' ? 'flex' : 'none';
                generate();
            });

            document.getElementById('renderEngine').addEventListener('change', (e) => {
                MAZE_STATE.engine = e.target.value;
                generate();
            });

            generate();
        }

        function updateSettings() {
            MAZE_STATE.width = parseInt(document.getElementById('widthInput').value);
            MAZE_STATE.height = parseInt(document.getElementById('heightInput').value);
            MAZE_STATE.depth = parseInt(document.getElementById('depthInput').value);
            MAZE_STATE.unitSize = parseFloat(document.getElementById('scaleInput').value);
        }

        function clearGroups() {
            [mazeGroup, solutionGroup, markersGroup].forEach(g => {
                while(g.children.length > 0){ 
                    const child = g.children[0];
                    if(child.geometry) child.geometry.dispose();
                    if(child.material) {
                        if(Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                    g.remove(child); 
                }
            });
            isAnimating = false;
            animationQueue = [];
        }

        function getWallMaterial() {
            if (MAZE_STATE.engine === 'reflective') {
                return new THREE.MeshStandardMaterial({ 
                    color: 0xff0000, 
                    transparent: true, 
                    opacity: 0.5, 
                    metalness: 0.9,
                    roughness: 0.1,
                    side: THREE.DoubleSide 
                });
            } else {
                const ditherMat = new THREE.MeshStandardMaterial({ 
                    color: 0xc33c2d, 
                    emissive: 0x551005,
                    emissiveIntensity: 0.6,
                    metalness: 0.6,
                    roughness: 0.4,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 1.0
                });

                ditherMat.onBeforeCompile = (shader) => {
                    shader.fragmentShader = `
                        float dither4x4(vec2 position, float brightness) {
                            int x = int(mod(position.x, 4.0));
                            int y = int(mod(position.y, 4.0));
                            int index = x + y * 4;
                            float limit = 0.0;
                            if (index == 0) limit = 0.0625; else if (index == 1) limit = 0.5625;
                            else if (index == 2) limit = 0.1875; else if (index == 3) limit = 0.6875;
                            else if (index == 4) limit = 0.8125; else if (index == 5) limit = 0.3125;
                            else if (index == 6) limit = 0.9375; else if (index == 7) limit = 0.4375;
                            else if (index == 8) limit = 0.25; else if (index == 9) limit = 0.75;
                            else if (index == 10) limit = 0.125; else if (index == 11) limit = 0.625;
                            else if (index == 12) limit = 1.0; else if (index == 13) limit = 0.5;
                            else if (index == 14) limit = 0.875; else if (index == 15) limit = 0.375;
                            return brightness < limit ? 0.0 : 1.0;
                        }
                    ` + shader.fragmentShader;

                    shader.fragmentShader = shader.fragmentShader.replace(
                        '#include <dithering_fragment>',
                        `
                        #include <dithering_fragment>
                        vec3 viewDir = normalize(vViewPosition);
                        float fresnel = 1.0 - dot(vNormal, viewDir);
                        float dither = dither4x4(gl_FragCoord.xy, 0.4 + (pow(fresnel, 2.0) * 0.4));
                        if (dither < 0.1) discard;
                        if (dot(vNormal, vec3(0.0, 1.0, 0.0)) > 0.9 && mod(gl_FragCoord.x, 10.0) < 1.0) {
                             gl_FragColor.rgb += vec3(0.8, 0.4, 0.1);
                        }
                        `
                    );
                };
                return ditherMat;
            }
        }

        function generate() {
            updateSettings();
            clearGroups();
            if (MAZE_STATE.mode === 'planar') generatePlanar();
            else generateCubic();
        }

        function generatePlanar() {
            const w = MAZE_STATE.width, h = MAZE_STATE.height;
            let grid = Array(h).fill().map(() => Array(w).fill().map(() => ({ top: true, right: true, bottom: true, left: true, visited: false })));
            let stack = [{x:0, y:0}];
            grid[0][0].visited = true;

            while(stack.length > 0) {
                let curr = stack[stack.length - 1], ns = [];
                if(curr.y > 0 && !grid[curr.y-1][curr.x].visited) ns.push({x:curr.x, y:curr.y-1, d1:'top', d2:'bottom'});
                if(curr.y < h-1 && !grid[curr.y+1][curr.x].visited) ns.push({x:curr.x, y:curr.y+1, d1:'bottom', d2:'top'});
                if(curr.x > 0 && !grid[curr.y][curr.x-1].visited) ns.push({x:curr.x-1, y:curr.y, d1:'left', d2:'right'});
                if(curr.x < w-1 && !grid[curr.y][curr.x+1].visited) ns.push({x:curr.x+1, y:curr.y, d1:'right', d2:'left'});

                if(ns.length > 0) {
                    let next = ns[Math.floor(Math.random() * ns.length)];
                    grid[curr.y][curr.x][next.d1] = false;
                    grid[next.y][next.x][next.d2] = false;
                    grid[next.y][next.x].visited = true;
                    stack.push(next);
                } else stack.pop();
            }

            MAZE_STATE.start = getRandomPerimeter2D(w, h);
            MAZE_STATE.end = getRandomPerimeter2D(w, h, MAZE_STATE.start);
            grid[MAZE_STATE.start.y][MAZE_STATE.start.x][MAZE_STATE.start.face] = false;
            grid[MAZE_STATE.end.y][MAZE_STATE.end.x][MAZE_STATE.end.face] = false;

            MAZE_STATE.grid = grid;
            drawPlanarGeometry();
            drawMarkers();
            document.getElementById('statusText').innerText = "Planar Structure Baked.";
        }

        function getRandomPerimeter2D(w, h, exclude = null) {
            let res;
            do {
                const side = Math.floor(Math.random()*4);
                if(side === 0) res = {x: Math.floor(Math.random()*w), y: 0, face: 'top'};
                else if(side === 1) res = {x: Math.floor(Math.random()*w), y: h-1, face: 'bottom'};
                else if(side === 2) res = {x: 0, y: Math.floor(Math.random()*h), face: 'left'};
                else res = {x: w-1, y: Math.floor(Math.random()*h), face: 'right'};
            } while (exclude && res.x === exclude.x && res.y === exclude.y);
            return res;
        }

        function drawPlanarGeometry() {
            const u = MAZE_STATE.unitSize, w = MAZE_STATE.width, h = MAZE_STATE.height;
            const wallGeo = new THREE.BoxGeometry(u, MAZE_STATE.wallHeight, u * 0.1);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const inst = new THREE.InstancedMesh(wallGeo, wallMat, w * h * 4);
            const dummy = new THREE.Object3D(), ox = (w * u) / 2, oz = (h * u) / 2;
            let i = 0;

            for(let y=0; y<h; y++) {
                for(let x=0; x<w; x++) {
                    const c = MAZE_STATE.grid[y][x], cx = x*u - ox + u/2, cz = y*u - oz + u/2;
                    if(c.top) { dummy.position.set(cx, 0, cz - u/2); dummy.rotation.set(0,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                    if(c.bottom) { dummy.position.set(cx, 0, cz + u/2); dummy.rotation.set(0,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                    if(c.left) { dummy.position.set(cx - u/2, 0, cz); dummy.rotation.set(0,Math.PI/2,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                    if(c.right) { dummy.position.set(cx + u/2, 0, cz); dummy.rotation.set(0,Math.PI/2,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                }
            }
            inst.count = i;
            mazeGroup.add(inst);
        }

        function generateCubic() {
            const w = MAZE_STATE.width, h = MAZE_STATE.height, d = MAZE_STATE.depth;
            let grid = Array(d).fill().map(() => Array(h).fill().map(() => Array(w).fill().map(() => ({
                top:true, bottom:true, left:true, right:true, front:true, back:true, visited:false
            }))));
            let stack = [{x:0, y:0, z:0}];
            grid[0][0][0].visited = true;

            while(stack.length > 0) {
                let curr = stack[stack.length-1], ns = [];
                if(curr.x > 0 && !grid[curr.z][curr.y][curr.x-1].visited) ns.push({x:curr.x-1, y:curr.y, z:curr.z, d1:'left', d2:'right'});
                if(curr.x < w-1 && !grid[curr.z][curr.y][curr.x+1].visited) ns.push({x:curr.x+1, y:curr.y, z:curr.z, d1:'right', d2:'left'});
                if(curr.y > 0 && !grid[curr.z][curr.y-1][curr.x].visited) ns.push({x:curr.x, y:curr.y-1, z:curr.z, d1:'bottom', d2:'top'});
                if(curr.y < h-1 && !grid[curr.z][curr.y+1][curr.x].visited) ns.push({x:curr.x, y:curr.y+1, z:curr.z, d1:'top', d2:'bottom'});
                if(curr.z > 0 && !grid[curr.z-1][curr.y][curr.x].visited) ns.push({x:curr.x, y:curr.y, z:curr.z-1, d1:'back', d2:'front'});
                if(curr.z < d-1 && !grid[curr.z+1][curr.y][curr.x].visited) ns.push({x:curr.x, y:curr.y, z:curr.z+1, d1:'front', d2:'back'});

                if(ns.length > 0) {
                    let next = ns[Math.floor(Math.random() * ns.length)];
                    grid[curr.z][curr.y][curr.x][next.d1] = false;
                    grid[next.z][next.y][next.x][next.d2] = false;
                    grid[next.z][next.y][next.x].visited = true;
                    stack.push(next);
                } else stack.pop();
            }

            MAZE_STATE.start = getRandomPerimeter3D(w, h, d);
            MAZE_STATE.end = getRandomPerimeter3D(w, h, d, MAZE_STATE.start);
            grid[MAZE_STATE.start.z][MAZE_STATE.start.y][MAZE_STATE.start.x][MAZE_STATE.start.face] = false;
            grid[MAZE_STATE.end.z][MAZE_STATE.end.y][MAZE_STATE.end.x][MAZE_STATE.end.face] = false;

            MAZE_STATE.grid = grid;
            drawCubicGeometry();
            drawMarkers();
            document.getElementById('statusText').innerText = "Cubic Structure Baked.";
        }

        function getRandomPerimeter3D(w, h, d, exclude = null) {
            let res;
            do {
                const face = Math.floor(Math.random()*6);
                if(face === 0) res = {x:0, y:Math.floor(Math.random()*h), z:Math.floor(Math.random()*d), face:'left'};
                else if(face === 1) res = {x:w-1, y:Math.floor(Math.random()*h), z:Math.floor(Math.random()*d), face:'right'};
                else if(face === 2) res = {x:Math.floor(Math.random()*w), y:0, z:Math.floor(Math.random()*d), face:'bottom'};
                else if(face === 3) res = {x:Math.floor(Math.random()*w), y:h-1, z:Math.floor(Math.random()*d), face:'top'};
                else if(face === 4) res = {x:Math.floor(Math.random()*w), y:Math.floor(Math.random()*h), z:0, face:'back'};
                else res = {x:Math.floor(Math.random()*w), y:Math.floor(Math.random()*h), z:d-1, face:'front'};
            } while (exclude && res.x === exclude.x && res.y === exclude.y && res.z === exclude.z);
            return res;
        }

        function drawCubicGeometry() {
            const u = MAZE_STATE.unitSize, w = MAZE_STATE.width, h = MAZE_STATE.height, d = MAZE_STATE.depth;
            const wallGeo = new THREE.PlaneGeometry(u, u);
            const wallMat = getWallMaterial();
            const inst = new THREE.InstancedMesh(wallGeo, wallMat, w*h*d*6);
            const dummy = new THREE.Object3D(), ox = (w*u)/2, oy = (h*u)/2, oz = (d*u)/2;
            let i = 0;

            for(let z=0; z<d; z++) {
                for(let y=0; y<h; y++) {
                    for(let x=0; x<w; x++) {
                        const c = MAZE_STATE.grid[z][y][x], cx = x*u-ox+u/2, cy = y*u-oy+u/2, cz = z*u-oz+u/2;
                        if(c.left) { dummy.position.set(cx-u/2, cy, cz); dummy.rotation.set(0,Math.PI/2,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                        if(c.right) { dummy.position.set(cx+u/2, cy, cz); dummy.rotation.set(0,Math.PI/2,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                        if(c.bottom) { dummy.position.set(cx, cy-u/2, cz); dummy.rotation.set(Math.PI/2,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                        if(c.top) { dummy.position.set(cx, cy+u/2, cz); dummy.rotation.set(Math.PI/2,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                        if(c.back) { dummy.position.set(cx, cy, cz-u/2); dummy.rotation.set(0,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                        if(c.front) { dummy.position.set(cx, cy, cz+u/2); dummy.rotation.set(0,0,0); dummy.updateMatrix(); inst.setMatrixAt(i++, dummy.matrix); }
                    }
                }
            }
            inst.count = i;
            mazeGroup.add(inst);
        }

        function drawMarkers() {
            const u = MAZE_STATE.unitSize;
            const markerGeo = new THREE.SphereGeometry(u*0.35);
            const sM = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({ color: 0x00d9ff, emissive: 0x00d9ff, emissiveIntensity: 2 }));
            const eM = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 }));
            const ox = (MAZE_STATE.width*u)/2, oy = (MAZE_STATE.height*u)/2, oz = (MAZE_STATE.mode === 'cubic' ? (MAZE_STATE.depth*u)/2 : (MAZE_STATE.height*u)/2);

            function setPos(mesh, term) {
                let px = term.x*u - ox + u/2, py = 0, pz = 0;
                if(MAZE_STATE.mode === 'planar') {
                    pz = term.y*u - oz + u/2;
                    if(term.face === 'left') px -= u/2; if(term.face === 'right') px += u/2;
                    if(term.face === 'top') pz -= u/2; if(term.face === 'bottom') pz += u/2;
                } else {
                    py = term.y*u - oy + u/2; pz = term.z*u - oz + u/2;
                    if(term.face === 'left') px -= u/2; if(term.face === 'right') px += u/2;
                    if(term.face === 'bottom') py -= u/2; if(term.face === 'top') py += u/2;
                    if(term.face === 'back') pz -= u/2; if(term.face === 'front') pz += u/2;
                }
                mesh.position.set(px, py, pz);
            }
            setPos(sM, MAZE_STATE.start); setPos(eM, MAZE_STATE.end);
            markersGroup.add(sM, eM);
        }

        function solve() {
            while(solutionGroup.children.length > 0) solutionGroup.remove(solutionGroup.children[0]);
            const is3D = MAZE_STATE.mode === 'cubic', grid = MAZE_STATE.grid;
            let degreeMap = new Map(), allCells = [];
            if(!is3D) {
                for(let y=0; y<MAZE_STATE.height; y++) for(let x=0; x<MAZE_STATE.width; x++){
                    let d = 0, c = grid[y][x];
                    if(!c.top) d++; if(!c.bottom) d++; if(!c.left) d++; if(!c.right) d++;
                    degreeMap.set(`${x},${y}`, d); allCells.push({x,y});
                }
            } else {
                for(let z=0; z<MAZE_STATE.depth; z++) for(let y=0; y<MAZE_STATE.height; y++) for(let x=0; x<MAZE_STATE.width; x++){
                    let d = 0, c = grid[z][y][x];
                    if(!c.top) d++; if(!c.bottom) d++; if(!c.left) d++; if(!c.right) d++; if(!c.front) d++; if(!c.back) d++;
                    degreeMap.set(`${x},${y},${z}`, d); allCells.push({x,y,z});
                }
            }
            const sK = is3D ? `${MAZE_STATE.start.x},${MAZE_STATE.start.y},${MAZE_STATE.start.z}` : `${MAZE_STATE.start.x},${MAZE_STATE.start.y}`;
            const eK = is3D ? `${MAZE_STATE.end.x},${MAZE_STATE.end.y},${MAZE_STATE.end.z}` : `${MAZE_STATE.end.x},${MAZE_STATE.end.y}`;
            degreeMap.set(sK, 10); degreeMap.set(eK, 10);
            let changed = true, pruned = new Set();
            while(changed) {
                changed = false;
                allCells.forEach(cell => {
                    const key = is3D ? `${cell.x},${cell.y},${cell.z}` : `${cell.x},${cell.y}`;
                    if(!pruned.has(key) && degreeMap.get(key) === 1) {
                        pruned.add(key); changed = true;
                        getNeighbors(cell, is3D).forEach(n => {
                            const nk = is3D ? `${n.x},${n.y},${n.z}` : `${n.x},${n.y}`;
                            degreeMap.set(nk, degreeMap.get(nk) - 1);
                        });
                    }
                });
            }
            let path = allCells.filter(c => !pruned.has(is3D ? `${c.x},${c.y},${c.z}` : `${c.x},${c.y}`));
            let ordered = [], current = {x: MAZE_STATE.start.x, y: MAZE_STATE.start.y, z: MAZE_STATE.start.z};
            let pathSet = new Set(path.map(p => is3D ? `${p.x},${p.y},${p.z}` : `${p.x},${p.y}`));
            let visited = new Set(), stack = [current];
            while(stack.length > 0) {
                let p = stack.pop();
                let key = is3D ? `${p.x},${p.y},${p.z}` : `${p.x},${p.y}`;
                if(visited.has(key)) continue;
                visited.add(key); ordered.push(p);
                getNeighbors(p, is3D).forEach(n => { if(pathSet.has(is3D ? `${n.x},${n.y},${n.z}` : `${n.x},${n.y}`)) stack.push(n); });
            }
            if(document.getElementById('chkInstant').checked) drawPath(ordered);
            else { animationQueue = ordered; isAnimating = true; }
        }

        function getNeighbors(k, is3D) {
            let ns = [], g = MAZE_STATE.grid;
            if(!is3D) {
                let c = g[k.y][k.x];
                if(!c.top && k.y > 0) ns.push({x:k.x, y:k.y-1});
                if(!c.bottom && k.y < MAZE_STATE.height-1) ns.push({x:k.x, y:k.y+1});
                if(!c.left && k.x > 0) ns.push({x:k.x-1, y:k.y});
                if(!c.right && k.x < MAZE_STATE.width-1) ns.push({x:k.x+1, y:k.y});
            } else {
                let c = g[k.z][k.y][k.x];
                if(!c.top && k.y < MAZE_STATE.height-1) ns.push({x:k.x, y:k.y+1, z:k.z});
                if(!c.bottom && k.y > 0) ns.push({x:k.x, y:k.y-1, z:k.z});
                if(!c.left && k.x > 0) ns.push({x:k.x-1, y:k.y, z:k.z});
                if(!c.right && k.x < MAZE_STATE.width-1) ns.push({x:k.x+1, y:k.y, z:k.z});
                if(!c.front && k.z < MAZE_STATE.depth-1) ns.push({x:k.x, y:k.y, z:k.z+1});
                if(!c.back && k.z > 0) ns.push({x:k.x, y:k.y, z:k.z-1});
            }
            return ns;
        }

        function drawPath(list) {
            const u = MAZE_STATE.unitSize;
            const geo = new THREE.BoxGeometry(u*0.5, u*0.5, u*0.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00d9ff, emissive: 0x00d9ff, emissiveIntensity: 1.5 });
            const ox = (MAZE_STATE.width*u)/2, oy = (MAZE_STATE.height*u)/2, oz = (MAZE_STATE.mode === 'cubic' ? (MAZE_STATE.depth*u)/2 : (MAZE_STATE.height*u)/2);
            list.forEach(p => {
                const mesh = new THREE.Mesh(geo, mat);
                const py = MAZE_STATE.mode === 'cubic' ? p.y*u - oy + u/2 : 0;
                const pz = MAZE_STATE.mode === 'cubic' ? p.z*u - oz + u/2 : p.y*u - oz + u/2;
                mesh.position.set(p.x*u - ox + u/2, py, pz);
                solutionGroup.add(mesh);
            });
        }

        function export4KTransparent() {
    document.getElementById('statusText').innerText = "Exporting Transparent PNG...";
    const w = 4096,
        h = 4096;
    const originalBG = scene.background;
    scene.background = null;

}

function exportGLB_Grouped() {
    document.getElementById('statusText').innerText = "Baking Scene for GLB...";
    
    const exportScene = new THREE.Scene();
    
    // 1. Create named groups for the export hierarchy to maintain organization in Blender/Unity
    const mazeWallsExport = new THREE.Group();
    mazeWallsExport.name = "Maze_Wall_Perimeters";
    
    const pathsExport = new THREE.Group();
    pathsExport.name = "Path_Objects";
    
    const markersExport = new THREE.Group();
    markersExport.name = "Marker_Objects";
    
    exportScene.add(mazeWallsExport, pathsExport, markersExport);
    
    // 2. Map original groups to our export groups
    const groupsMap = [
        { original: mazeGroup, target: mazeWallsExport },
        { original: solutionGroup, target: pathsExport },
        { original: markersGroup, target: markersExport }
    ];
    
    groupsMap.forEach(({ original, target }) => {
        if (!original) return;
        
        original.traverse(obj => {
            if (obj.isInstancedMesh) {
                // Bake InstancedMesh into a single merged Mesh for better compatibility
                const count = obj.count;
                const dummy = new THREE.Object3D();
                const geos = [];
                
                for (let i = 0; i < count; i++) {
                    obj.getMatrixAt(i, dummy.matrix);
                    const cloneGeo = obj.geometry.clone();
                    cloneGeo.applyMatrix4(dummy.matrix);
                    geos.push(cloneGeo);
                }
                
                if (geos.length > 0) {
                    // Corrected usage of imported BufferGeometryUtils
                    const merged = BufferGeometryUtils.mergeGeometries(geos);
                    const bakedMesh = new THREE.Mesh(merged, obj.material.clone());
                    bakedMesh.name = obj.name || "Baked_Structure";
                    target.add(bakedMesh);
                }
            } else if (obj.isMesh) {
                // Clone standard meshes directly
                const clonedMesh = obj.clone();
                target.add(clonedMesh);
            }
        });
    });
    
    // 3. Export to GLB
    const exporter = new GLTFExporter();
    
    exporter.parse(
        exportScene, 
        (result) => {
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'LeadEdge_Maze_Grouped.glb';
            link.click();
            document.getElementById('statusText').innerText = "GLB Export Complete.";
        },
        (error) => {
            console.error("Export Error:", error);
            document.getElementById('statusText').innerText = "Export Failed.";
        },
        { binary: true } // This ensures a .glb file instead of .gltf
    );
}

        function animate() {
            requestAnimationFrame(animate);
            if(isAnimating && animationQueue.length > 0) {
                for(let i=0; i<animationSpeed; i++) {
                    if(animationQueue.length > 0) drawPath([animationQueue.shift()]);
                }
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
