<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LEATR: DART Potentials v6.6 (True Reset & Centered Start)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/misc/GPUComputationRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        canvas { display: block; }

        #ui-container {
            position: absolute; top: 20px; left: 20px; width: 380px;
            background: rgba(2, 6, 12, 0.95); border: 1px solid #38bdf8; border-radius: 8px; color: #f1f5f9;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.1); display: flex; flex-direction: column; max-height: 90vh;
            pointer-events: auto; z-index: 1000;
        }

        #ui-header {
            padding: 15px 20px; background: rgba(56, 189, 248, 0.15); border-bottom: 1px solid #1e293b;
            cursor: move; display: flex; justify-content: space-between; align-items: center;
        }
        h1 { margin: 0; font-size: 0.85rem; color: #f8fafc; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; pointer-events: none; }

        #ui-content-scroll { overflow-y: auto; flex-grow: 1; }
        #ui-content { padding: 20px; }
        .collapsed #ui-content-scroll { display: none; }
        .collapsed { height: auto; }

        .subtitle { font-size: 0.7rem; color: #94a3b8; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 4px; font-weight: bold; margin-top: 20px; letter-spacing: 1px; text-transform: uppercase;}
        .subtitle:first-child { margin-top: 0; }

        .control-group { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 0.7rem; color: #38bdf8; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
        label span { color: #64748b; }
        
        input[type=range] { width: 100%; cursor: pointer; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #f8fafc; margin-top: -5px; box-shadow: 0 0 10px #38bdf8; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; }
        
        .cyan-slider::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1e293b, #00e5ff); }
        .gold-slider::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1e293b, #f59e0b); }
        .red-slider::-webkit-slider-runnable-track { background: linear-gradient(90deg, #1e293b, #ef4444); }

        .btn-row { display: flex; gap: 8px; margin-top: 20px; }
        button { flex: 1; padding: 12px 5px; border: none; border-radius: 4px; font-weight: bold; text-transform: uppercase; cursor: pointer; font-size: 0.65rem; transition: all 0.2s; color: white; }
        .btn-seed { background: #8b5cf6; }
        .btn-reset { background: #ef4444; }
        .btn-export { background: #10b981; }

        .math-box { background: #0f172a; padding: 15px; border: 1px solid #1e293b; margin-top: 20px; border-radius: 6px; text-align: center; }
        
        #instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 0.7rem; pointer-events: none; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; text-shadow: 0 2px 10px #000; }
  
      #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%; 
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            background-size: cover;
            object-fit: cover;
            filter: brightness(1);
        }

  
    </style>
</head>
<body>
<video autoplay muted loop id="bg-video">
    <source src="https://raw.githubusercontent.com/DART-Skyboard/Ariel/main/static/abaddonhalo.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>
    <div id="ui-container">
        <div id="ui-header">
            <h1>LEATR: DART Potentials v6.6</h1>
            <span style="font-size: 0.8rem; color: #38bdf8;">▼</span>
        </div>
        
        <div id="ui-content-scroll">
        <div id="ui-content">
            <div class="subtitle">Celestial Physics</div>
            <div class="control-group">
                <label>Spiral Arms <span id="val-arms">6</span></label>
                <input type="range" id="arms" min="2" max="12" value="6" step="1" oninput="updateLabel('arms'); refreshAllGalaxies()">
            </div>
            <div class="control-group">
                <label>Core Mass (Gravity)</label>
                <input type="range" id="gravity" min="0" max="100" value="5" oninput="updatePhysics()">
            </div>
            <div class="control-group">
                <label>Core Reach (Localization)</label>
                <input type="range" id="gravity-reach" min="1" max="500" value="150" oninput="updatePhysics()">
            </div>
            <div class="control-group">
                <label>Black Hole Scale</label>
                <input type="range" id="size" min="10" max="150" value="60" oninput="updatePhysics()">
            </div>
            <div class="control-group">
                <label>Viscosity (Drag)</label>
                <input type="range" id="viscosity" min="0" max="100" value="20">
            </div>

            <div class="subtitle">Cloud Density</div>
            <div class="control-group">
                <label style="color:#00e5ff">Turquoise</label>
                <input type="range" class="cyan-slider" id="dens-cyan" min="0" max="100" value="60" oninput="refreshAllGalaxies()">
            </div>
            <div class="control-group">
                <label style="color:#f59e0b">Gold</label>
                <input type="range" class="gold-slider" id="dens-gold" min="0" max="100" value="50" oninput="refreshAllGalaxies()">
            </div>
            <div class="control-group">
                <label style="color:#ef4444">Red</label>
                <input type="range" class="red-slider" id="dens-red" min="0" max="100" value="40" oninput="refreshAllGalaxies()">
            </div>

            <div class="subtitle">Light Intensity</div>
            <div class="control-group">
                <label style="color:#00e5ff">Turquoise</label>
                <input type="range" class="cyan-slider" id="light-cyan" min="0" max="200" value="120">
            </div>
            <div class="control-group">
                <label style="color:#f59e0b">Gold</label>
                <input type="range" class="gold-slider" id="light-gold" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label style="color:#ef4444">Red</label>
                <input type="range" class="red-slider" id="light-red" min="0" max="200" value="140">
            </div>
            
            <div class="subtitle">Ecosystem</div>
            <div class="btn-row">
                <button class="btn-seed" onclick="seedNewGalaxy()">+ Seed Galaxy</button>
                <button class="btn-reset" onclick="resetSimulation()">⚠ Reset All</button>
                <button class="btn-export" onclick="capture4K()">📷 Export 4K</button>
            </div>
            <div id="galaxy-count" style="text-align: center; font-size: 0.7rem; color: #64748b; margin-top: 10px;">Active Galaxies: 1</div>

            <div class="math-box">
                <div id="formula" style="color: #e2e8f0; font-size: 0.7rem;">$ V_{Reflex} = \frac{((dist \cdot 2) + 1)}{dist} $</div>
            </div>
        </div>
        </div>
    </div>

    <div id="instructions">Drag LABEL to move Galaxy. Drag BLACK HOLE for localized gravity.</div>

    <script id="computeShaderVelocity" type="x-shader/x-fragment">
        uniform float time;
        uniform float viscosity;
        uniform vec3 probePositions[8];
        uniform float probeMasses[8];
        uniform float gravityReach;
        uniform int probeCount;
        uniform vec3 galaxyCenter;

        float getReflex(float d) { 
            if(d < 0.1) d = 0.1; 
            return ((d * 2.0) + 1.0) / d; 
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec4 posData = texture2D(texturePosition, uv);
            vec4 velData = texture2D(textureVelocity, uv); 
            vec3 pos = posData.xyz; vec3 vel = velData.xyz; float type = velData.w;

            float speedMod = (type < 0.1) ? 1.2 : (type < 0.3) ? 0.7 : 1.0;
            float gravMod = (type < 0.1) ? 0.8 : (type < 0.3) ? 1.4 : 1.0;

            vec3 acc = vec3(0.0);

            vec3 toCenter = galaxyCenter - pos;
            float dCenter = length(toCenter);
            vec3 tan = normalize(cross(toCenter, vec3(0.0, 1.0, 0.0)));
            acc += tan * (6.0 * speedMod) / (dCenter + 10.0) * 0.05;

            for(int i = 0; i < 8; i++) {
                if(i >= probeCount) break;
                vec3 toProbe = probePositions[i] - pos;
                float d = length(toProbe);
                float falloff = (d * d) / (gravityReach + 1.0);
                float force = (probeMasses[i] * 50.0) / (falloff + 10.0);
                float reflex = getReflex(d);
                acc += normalize(toProbe) * (force * reflex * 0.01 * gravMod);
                if(d < 5.0) vel *= 0.9;
            }
            
            vel += acc;
            vel *= (0.98 - (viscosity * 0.001)); 
            gl_FragColor = vec4(vel, type);
        }
    </script>

    <script id="computeShaderPosition" type="x-shader/x-fragment">
        uniform vec3 galaxyCenter;
        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec4 pos = texture2D(texturePosition, uv);
            vec4 vel = texture2D(textureVelocity, uv);
            pos.xyz += vel.xyz * 0.15; 
            if(distance(pos.xyz, galaxyCenter) > 900.0) {
                pos.xyz = galaxyCenter + normalize(pos.xyz - galaxyCenter) * 10.0;
            }
            gl_FragColor = pos;
        }
    </script>

    <script id="particleVertexShader" type="x-shader/x-vertex">
        uniform sampler2D texturePosition;
        uniform sampler2D textureVelocity;
        uniform float size;
        varying float vType;

        void main() {
            vec4 posData = texture2D(texturePosition, uv); 
            vType = texture2D(textureVelocity, uv).w;
            vec4 mvPosition = modelViewMatrix * vec4(posData.xyz, 1.0); 
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = size * (450.0 / -mvPosition.z);
        }
    </script>

    <script id="particleFragmentShader" type="x-shader/x-fragment">
        varying float vType;
        uniform vec3 lightIntensities; 

        void main() {
            if(length(gl_PointCoord - 0.5) > 0.5) discard;
            vec3 color = (vType < 0.1) ? vec3(0.0, 0.9, 1.0) : (vType < 0.3) ? vec3(1.0, 0.7, 0.1) : vec3(1.0, 0.1, 0.3);
            float intensity = (vType < 0.1) ? lightIntensities.x : (vType < 0.3) ? lightIntensities.y : lightIntensities.z;
            float dist = length(gl_PointCoord - 0.5);
            float glow = exp(-dist * 4.5);
            gl_FragColor = vec4(color * (intensity * 0.01 + 0.4) + (glow * 0.25), 0.75); 
        }
    </script>

    <script>
        const WIDTH = 512; const PARTICLES = WIDTH * WIDTH; const MAX_G = 8;
        let renderer, scene, camera, controls, dragControls;
        let galaxies = []; 
        let globalProbePositions = new Array(MAX_G).fill().map(() => new THREE.Vector3());
        let globalProbeMasses = new Array(MAX_G).fill(0);
        let interactables = [];

        class Galaxy {
            constructor(id, pos) {
                this.id = id;
                this.center = pos.clone();
                this.initGPGPU();
                this.initVisuals();
                this.initObjects();
            }

            initGPGPU() {
                this.gpu = new THREE.GPUComputationRenderer(WIDTH, WIDTH, renderer);
                const dtP = this.gpu.createTexture(); const dtV = this.gpu.createTexture();
                this.seed(dtP, dtV);
                this.vVar = this.gpu.addVariable("textureVelocity", document.getElementById('computeShaderVelocity').textContent, dtV);
                this.pVar = this.gpu.addVariable("texturePosition", document.getElementById('computeShaderPosition').textContent, dtP);
                this.gpu.setVariableDependencies(this.vVar, [this.pVar, this.vVar]);
                this.gpu.setVariableDependencies(this.pVar, [this.pVar, this.vVar]);
                this.vUni = this.vVar.material.uniforms;
                this.vUni.time = { value: 0 };
                this.vUni.viscosity = { value: 0.2 };
                this.vUni.gravityReach = { value: 150 };
                this.vUni.galaxyCenter = { value: this.center };
                this.vUni.probePositions = { value: globalProbePositions };
                this.vUni.probeMasses = { value: globalProbeMasses };
                this.vUni.probeCount = { value: 0 };
                this.pVar.material.uniforms.galaxyCenter = { value: this.center };
                this.gpu.init();
            }

            seed(dtP, dtV) {
                const p = dtP.image.data; const v = dtV.image.data;
                const arms = parseInt(document.getElementById('arms').value);
                const dc = parseInt(document.getElementById('dens-cyan').value)/100;
                const dg = parseInt(document.getElementById('dens-gold').value)/100;
                for(let i=0; i<PARTICLES; i++) {
                    const i4 = i*4;
                    v[i4+3] = (Math.random() < dc) ? 0.0 : (Math.random() < dc+dg) ? 0.2 : 0.4;
                    const r = Math.pow(Math.random(), 1.4) * 280 + 10;
                    const a = (i % arms) * (Math.PI*2/arms) + r * 0.012;
                    p[i4+0] = this.center.x + Math.cos(a)*r + (Math.random()-0.5)*30;
                    p[i4+1] = this.center.y + (Math.random()-0.5)*20;
                    p[i4+2] = this.center.z + Math.sin(a)*r + (Math.random()-0.5)*30;
                }
            }

            initVisuals() {
                this.matUni = { 
                    texturePosition: { value: null }, textureVelocity: { value: null },
                    size: { value: 2.5 }, lightIntensities: { value: new THREE.Vector3(120, 100, 140) } 
                };
                const geo = new THREE.BufferGeometry();
                const uv = new Float32Array(PARTICLES*2);
                for(let i=0; i<PARTICLES; i++) { uv[i*2]=(i%WIDTH)/WIDTH; uv[i*2+1]=(i/WIDTH)/WIDTH; }
                geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLES*3), 3));
                geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
                this.mesh = new THREE.Points(geo, new THREE.ShaderMaterial({
                    uniforms: this.matUni,
                    vertexShader: document.getElementById('particleVertexShader').textContent,
                    fragmentShader: document.getElementById('particleFragmentShader').textContent,
                    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
                }));
                scene.add(this.mesh);
            }

            initObjects() {
                this.probe = new THREE.Group();
                this.probe.add(new THREE.Mesh(new THREE.SphereGeometry(4,16,16), new THREE.MeshBasicMaterial({color:0x000000})));
                this.probe.add(new THREE.Mesh(new THREE.TorusGeometry(8,0.4,16,64), new THREE.MeshBasicMaterial({color:0x38bdf8})));
                this.probe.position.copy(this.center);
                scene.add(this.probe);
                this.probe.userData = { isProbe: true, galaxy: this };

                const canv = document.createElement('canvas'); canv.width=256; canv.height=64;
                const c = canv.getContext('2d');
                c.fillStyle="rgba(15,23,42,0.95)"; c.fillRect(0,0,256,64);
                c.strokeStyle="#38bdf8"; c.lineWidth=4; c.strokeRect(0,0,256,64);
                c.fillStyle="white"; c.font="bold 26px Arial"; c.textAlign="center";
                c.fillText("GALAXY-" + this.id, 128, 42);
                this.label = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(canv)}));
                this.label.scale.set(75, 18, 1);
                this.label.position.copy(this.center).add(new THREE.Vector3(0, 65, 0));
                scene.add(this.label);
                this.label.userData = { isLabel: true, galaxy: this };
                interactables.push(this.probe, this.label);
            }

            update(time) {
                this.vUni.time.value = time;
                this.vUni.viscosity.value = document.getElementById('viscosity').value * 0.01;
                this.vUni.gravityReach.value = parseFloat(document.getElementById('gravity-reach').value);
                this.vUni.probeCount.value = galaxies.length;
                this.gpu.compute();
                this.matUni.texturePosition.value = this.gpu.getCurrentRenderTarget(this.pVar).texture;
                this.matUni.textureVelocity.value = this.gpu.getCurrentRenderTarget(this.vVar).texture;
                this.matUni.lightIntensities.value.set(document.getElementById('light-cyan').value, document.getElementById('light-gold').value, document.getElementById('light-red').value);
                this.probe.rotation.y += 0.02;
            }

            dispose() {
                scene.remove(this.mesh); scene.remove(this.probe); scene.remove(this.label);
            }
        }

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.body.appendChild(renderer.domElement);
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000000);
            camera.position.set(0, 700, 1100);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.target.set(0,0,0);
            setupDrag(); setupUI(); seedNewGalaxy(); animate();
        }

        function setupDrag() {
            dragControls = new THREE.DragControls(interactables, camera, renderer.domElement);
            dragControls.addEventListener('dragstart', () => controls.enabled = false);
            dragControls.addEventListener('drag', (e) => {
                const data = e.object.userData;
                if(data.isLabel) {
                    const delta = new THREE.Vector3().subVectors(e.object.position, data.galaxy.center).sub(new THREE.Vector3(0,65,0));
                    data.galaxy.center.add(delta);
                    data.galaxy.probe.position.add(delta);
                    e.object.position.copy(data.galaxy.center).add(new THREE.Vector3(0,65,0));
                }
            });
            dragControls.addEventListener('dragend', () => controls.enabled = true);
        }

        window.seedNewGalaxy = () => {
            if(galaxies.length >= MAX_G) return;
            // The first galaxy is always centered
            const pos = (galaxies.length === 0) ? new THREE.Vector3(0,0,0) : new THREE.Vector3((Math.random()-0.5)*1800, (Math.random()-0.5)*400, (Math.random()-0.5)*1800);
            galaxies.push(new Galaxy(galaxies.length, pos));
            document.getElementById('galaxy-count').innerText = "Active Galaxies: " + galaxies.length;
        }

        window.updatePhysics = () => {
            galaxies.forEach(g => {
                const s = document.getElementById('size').value / 50;
                g.probe.scale.set(s,s,s);
            });
        }

        window.refreshAllGalaxies = () => galaxies.forEach(g => { g.seed(g.gpu.createTexture(), g.gpu.createTexture()); g.gpu.init(); });

        window.resetSimulation = () => {
            galaxies.forEach(g => g.dispose());
            galaxies = []; interactables.length = 0;
            
            // Reset Sliders
            document.getElementById('arms').value = 6;
            document.getElementById('gravity').value = 5;
            document.getElementById('gravity-reach').value = 150;
            document.getElementById('size').value = 60;
            document.getElementById('viscosity').value = 20;
            document.querySelectorAll('input').forEach(i => updateLabel(i.id));

            // Reset Camera
            camera.position.set(0, 700, 1100);
            controls.target.set(0,0,0);
            controls.update();

            seedNewGalaxy();
        };

        window.capture4K = () => {
            const size = 4096;
            const exportTarget = new THREE.WebGLRenderTarget(size, size, { format: THREE.RGBAFormat });
            const exportCam = new THREE.PerspectiveCamera(60, 1, 1, 100000);
            const box = new THREE.Box3();
            galaxies.forEach(g => box.expandByPoint(g.center));
            const center = new THREE.Vector3(); box.getCenter(center);
            const sizeBox = new THREE.Vector3(); box.getSize(sizeBox);
            const maxDim = Math.max(sizeBox.x, sizeBox.z, 600);
            exportCam.position.set(center.x, maxDim * 1.6 + 500, center.z);
            exportCam.lookAt(center);
            galaxies.forEach(g => { g.label.visible = false; g.probe.visible = false; });
            renderer.setRenderTarget(exportTarget);
            renderer.render(scene, exportCam);
            const buffer = new Uint8Array(size * size * 4);
            renderer.readRenderTargetPixels(exportTarget, 0, 0, size, size, buffer);
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(size, size); imageData.data.set(buffer);
            ctx.putImageData(imageData, 0, 0);
            const flipCanvas = document.createElement('canvas'); flipCanvas.width = size; flipCanvas.height = size;
            const flipCtx = flipCanvas.getContext('2d');
            flipCtx.translate(0, size); flipCtx.scale(1, -1); flipCtx.drawImage(canvas, 0, 0);
            flipCanvas.toBlob((blob) => {
                const link = document.createElement('a');
                link.download = `LEATR_4K_${Date.now()}.png`;
                link.href = URL.createObjectURL(blob); link.click();
                renderer.setRenderTarget(null);
                galaxies.forEach(g => { g.label.visible = true; g.probe.visible = true; });
            }, 'image/png');
        };

        function setupUI() {
            const ui = document.getElementById('ui-container');
            const header = document.getElementById('ui-header');
            let isDragging = false; let startX, startY, origX, origY;
            const end = (e) => { if (e && e.cancelable) e.preventDefault(); if (!isDragging) ui.classList.toggle('collapsed'); };
            const start = (cx, cy) => { isDragging = false; startX = cx; startY = cy; origX = ui.offsetLeft; origY = ui.offsetTop; };
            const move = (cx, cy) => { 
                if (Math.abs(cx - startX) > 5 || Math.abs(cy - startY) > 5) isDragging = true; 
                if (isDragging) { ui.style.left = (origX + cx - startX) + 'px'; ui.style.top = (origY + cy - startY) + 'px'; }
            };
            header.onmousedown = e => { start(e.clientX, e.clientY); document.onmousemove = mv => move(mv.clientX, mv.clientY); document.onmouseup = (u) => { document.onmousemove = null; end(u); }; };
            header.ontouchstart = e => { start(e.touches[0].clientX, e.touches[0].clientY); document.ontouchmove = mv => { move(mv.touches[0].clientX, mv.touches[0].clientY); if (mv.cancelable) mv.preventDefault(); }; document.ontouchend = (u) => { document.ontouchmove = null; end(u); }; };
            window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            for(let i=0; i<MAX_G; i++) {
                if(i < galaxies.length) {
                    globalProbePositions[i].copy(galaxies[i].probe.position);
                    globalProbeMasses[i] = (document.getElementById('gravity').value) * galaxies[i].probe.scale.x;
                } else { globalProbeMasses[i] = 0; }
            }
            galaxies.forEach(g => g.update(time));
            controls.update();
            renderer.render(scene, camera);
        }

        function updateLabel(id) { 
            const el = document.getElementById('val-'+id);
            if(el) el.innerText = document.getElementById(id).value; 
        }

        init();
    </script>
</body>
</html>
